<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>坨坨桌布</title>

        <script src="https://cdn.tailwindcss.com"></script>
        <script src="data_config.js"></script>
        <script src="data_core.js"></script>
        <script src="data_intro.js"></script>
        <link rel="stylesheet" href="sprites.css">
        <link rel="stylesheet" href="./style.css">
        <link id="dynamicFavicon" rel="icon" href="./Favicon.png" type="image/png">
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./spine-player.min.css">
        <script src="./spine-player.min.js"></script>
        
        <script>
            const SafeStorage = {
                get: (k) => { try { return localStorage.getItem(k); } catch(e) { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} }
            };
            const isDarkMode = SafeStorage.get('theme') === 'dark' || (!SafeStorage.get('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDarkMode) { document.documentElement.classList.add('dark'); }
            window.currentLang = SafeStorage.get('user_lang') || "zh-TW";
            
            window.weVolume = 0.8;

            window.wallpaperPropertyListener = {
                applyUserProperties: function(properties) {
                    if (properties.volume) {
                        window.weVolume = (properties.volume.value / 100) * 0.8;
                        if (VoiceManager && VoiceManager.currentAudio) {
                            VoiceManager.currentAudio.volume = window.weVolume;
                        }
                    }
                }
            };
        </script>
        <style>
            html, body {
                margin: 0; padding: 0; width: 100vw; height: 100vh;
                overflow: hidden; background: transparent !important;
                font-family: 'Noto Sans TC', sans-serif;
            }

            /* 🌟 大廳背景層：將 1105x800 等比例完全擴大覆蓋整個桌面 */
            #desktopBgLayer {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                background-size: cover;
                background-position: center center;
                background-repeat: no-repeat;
                z-index: 0;
                pointer-events: none;
                transition: background-image 0.35s ease-in-out;
            }
            
            /* 🌟 左右雙欄 UI 容器 */
            #uiWrapper {
                position: fixed !important;
                inset: 0;
                z-index: 99999 !important;
                display: none !important;
                opacity: 0;
                transition: opacity 0.25s ease-in-out;
                width: 100vw;
                height: 100vh;
                padding: 2.5vh 3vw;
                align-items: center;
                justify-content: center;
                pointer-events: none;
            }

            #uiBackdrop {
                z-index: 99990 !important;
            }

            /* 🌟 保持頭像精靈圖清晰銳利，防止子像素模糊 */
            .avatar-crisp {
                image-rendering: -webkit-optimize-contrast;
                backface-visibility: hidden;
                -webkit-backface-visibility: hidden;
            }

            /* 🌟 鎖定滾動條預留空間，徹底防止滾輪出現時擠壓寬度造成換行 */
            #charGridContainer {
                scrollbar-gutter: stable;
            }
            
            #spineViewerSection {
                margin: 0; padding: 0; border: none; border-radius: 0;
                width: 100vw; height: 100vh; position: absolute; inset: 0;
                box-shadow: none; background: none !important; z-index: 10;
            }
            #spineCanvasContainer {
                width: 100vw !important; height: 100vh !important;
                border: none; border-radius: 0; margin: 0;
                background: transparent !important;
            }
            .spine-player-controls { display: none !important; }
            #spineCanvasContainer canvas {
                width: 100% !important; height: 100% !important;
                display: block !important; touch-action: none; pointer-events: auto;
            }
            .desktop-clock-shadow { 
                text-shadow: 0 4px 15px rgba(0,0,0,0.85), 0 1px 3px rgba(0,0,0,0.95), 0 0 6px rgba(0,0,0,0.55); 
            }

            /* 🌟 性格主題色動態變數與雙重性格/共鳴色彩漸變動畫 */
            @property --active-tone {
                syntax: '<color>';
                inherits: true;
                initial-value: #fcd34d;
            }
            #desktopInfoContainer {
                --c1: #fcd34d;
                --c2: #fcd34d;
                --active-tone: #fcd34d;
                transition: --active-tone 0.35s ease;
            }
            @keyframes dualTonePulse {
                0%, 100% { --active-tone: var(--c1); }
                50% { --active-tone: var(--c2); }
            }
            .desktop-dual-anim {
                animation: dualTonePulse 3s ease-in-out infinite;
            }
            @keyframes pentaTonePulse {
                0%, 100% { --active-tone: #4ade80; }
                20% { --active-tone: #60a5fa; }
                40% { --active-tone: #f87171; }
                60% { --active-tone: #facc15; }
                80% { --active-tone: #c084fc; }
            }
            .desktop-penta-anim {
                animation: pentaTonePulse 5s ease-in-out infinite;
            }

            /* 主色調：角色名字、日期、AM/PM */
            #introCharName, #clockDate, #clockAmPm {
                color: #fcd34d;
                color: var(--active-tone, #fcd34d);
            }
            /* 第一段簡介：82% 性格主色 + 18% 純白提亮 */
            #introLine1 {
                color: #fde68a;
                color: color-mix(in srgb, var(--active-tone, #fcd34d) 82%, #ffffff);
            }
            /* 第二段簡介與時鐘數字：52% 性格色調 + 48% 純白（保持高清晰度與色調一致） */
            #introLine2, #clockTimeDigits {
                color: #ffffff;
                color: color-mix(in srgb, var(--active-tone, #fcd34d) 52%, #ffffff);
            }
            /* 第三段簡介：38% 性格色調 + 62% 柔白 */
            #introLine3 {
                color: #e2e8f0;
                color: color-mix(in srgb, var(--active-tone, #fcd34d) 38%, #f8fafc);
            }

            .spine-player-loading-custom {
                position: absolute; top: 50%; left: 50%; width: 80px; height: 80px; margin: -40px 0 0 -40px;
                background: url('./golden_crayon.png') no-repeat center center; background-size: contain;
                animation: crayonFloat 1.5s ease-in-out infinite; z-index: 10;
            }
            @keyframes crayonFloat {
                0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 5px rgba(251, 191, 36, 0.5)); }
                50% { transform: translateY(-10px) scale(1.05); filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.9)); }
            }
            
            ::-webkit-scrollbar { width: 10px; height: 10px; }
            ::-webkit-scrollbar-track { background: rgba(0,0,0,0.08); border-radius: 10px; }
            .dark ::-webkit-scrollbar-track { background: rgba(255,255,255,0.08); }
            ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
            .dark ::-webkit-scrollbar-thumb { background-color: #475569; }
            ::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
            
            .group-grid-content {
                transition: max-height 0.25s ease-out, opacity 0.25s ease-out;
                overflow: visible;
            }
            .group-grid-content.collapsed {
                max-height: 0 !important;
                opacity: 0 !important;
                padding-top: 0 !important;
                overflow: hidden !important;
                pointer-events: none !important;
            }

            .outer-collapsible {
                transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
                overflow-x: hidden !important;
                overflow-y: auto !important;
            }
            .outer-collapsible.collapsed {
                max-height: 0 !important;
                opacity: 0 !important;
                overflow: hidden !important;
                pointer-events: none !important;
            }

            .custom-select-btn { -webkit-tap-highlight-color: transparent; }
            
            @keyframes dualColorPulse { 0% { border-color: var(--c1); box-shadow: 0 0 6px var(--c1); } 50% { border-color: var(--c2); box-shadow: 0 0 6px var(--c2); } 100% { border-color: var(--c1); box-shadow: 0 0 6px var(--c1); } }
            .dual-border-anim { --c1: #c084fc; --c2: #4ade80; animation: dualColorPulse 3s ease-in-out infinite; }
            @keyframes pentaColorPulse { 0% { border-color: #4ade80; box-shadow: 0 0 6px #4ade80; } 20% { border-color: #60a5fa; box-shadow: 0 0 6px #60a5fa; } 40% { border-color: #f87171; box-shadow: 0 0 6px #f87171; } 60% { border-color: #facc15; box-shadow: 0 0 6px #facc15; } 80% { border-color: #c084fc; box-shadow: 0 0 6px #c084fc; } 100% { border-color: #4ade80; box-shadow: 0 0 6px #4ade80; } }
            .penta-border-anim { animation: pentaColorPulse 5s ease-in-out infinite; }
        </style>
    </head>

        <script>
            // 🌟 大廳背景自動偵測與切換管理器
            const MAX_BG_SCAN = 60;
            const EXTRA_BG_IDS = [];
            let detectedBgList = [];

            function initLobbyBackgrounds() {
                const candidateIds = new Set();
                for (let i = 1; i <= MAX_BG_SCAN; i++) {
                    candidateIds.add(String(i).padStart(3, '0'));
                }
                EXTRA_BG_IDS.forEach(id => candidateIds.add(String(id)));

                const idsArray = Array.from(candidateIds);
                let pendingChecks = idsArray.length * 2;
                const foundMap = new Map();

                function onCheckDone() {
                    pendingChecks--;
                    if (pendingChecks <= 0) {
                        detectedBgList = Array.from(foundMap.entries())
                            .sort((a, b) => a[0].localeCompare(b[0]))
                            .map(([id, url]) => ({ id, url }));

                        const bgSelect = document.getElementById('bgSelect');
                        if (!bgSelect) return;
                        bgSelect.innerHTML = '<option value="none">無背景 (透明)</option>';

                        detectedBgList.forEach(item => {
                            const opt = document.createElement('option');
                            opt.value = item.url;
                            opt.text = `大廳背景 ${item.id}`;
                            bgSelect.appendChild(opt);
                        });

                        const savedBg = SafeStorage.get('we_lobby_bg');
                        if (savedBg === 'none') {
                            changeLobbyBackground('none');
                        } else if (savedBg && detectedBgList.some(b => b.url === savedBg)) {
                            changeLobbyBackground(savedBg);
                        } else if (detectedBgList.length > 0) {
                            changeLobbyBackground(detectedBgList[0].url);
                        }
                    }
                }

                idsArray.forEach(id => {
                    const folders = ['./bg/', './'];
                    folders.forEach(folder => {
                        const url = `${folder}Lobby${id}.png`;
                        const img = new Image();
                        img.onload = () => {
                            if (!foundMap.has(id)) {
                                foundMap.set(id, url);
                            }
                            onCheckDone();
                        };
                        img.onerror = () => {
                            onCheckDone();
                        };
                        img.src = url;
                    });
                });
            }

            function changeLobbyBackground(bgUrl) {
                const bgLayer = document.getElementById('desktopBgLayer');
                const bgSelect = document.getElementById('bgSelect');
                if (!bgLayer) return;

                if (!bgUrl || bgUrl === 'none') {
                    bgLayer.style.backgroundImage = 'none';
                    SafeStorage.set('we_lobby_bg', 'none');
                    if (bgSelect) bgSelect.value = 'none';
                } else {
                    bgLayer.style.backgroundImage = `url('${bgUrl}')`;
                    SafeStorage.set('we_lobby_bg', bgUrl);
                    if (bgSelect) bgSelect.value = bgUrl;
                }
            }

            function stepLobbyBackground(delta) {
                const bgSelect = document.getElementById('bgSelect');
                if (!bgSelect || bgSelect.options.length <= 1) return;
                let nextIdx = bgSelect.selectedIndex + delta;
                if (nextIdx >= bgSelect.options.length) nextIdx = 0;
                if (nextIdx < 0) nextIdx = bgSelect.options.length - 1;
                changeLobbyBackground(bgSelect.options[nextIdx].value);
            }

            // 🌟 終極 WE 雙擊解決方案
            let lastClickTime = 0;
            window.addEventListener('pointerdown', function(e) {
                if (e.target.closest('#uiLeftColumn') || e.target.closest('#uiRightColumn')) return;
                let currentTime = new Date().getTime();
                if (currentTime - lastClickTime < 400) {
                    const backdrop = document.getElementById('uiBackdrop');
                    if (window.getComputedStyle(backdrop).display === 'none' || backdrop.style.opacity === '0') {
                        toggleDesktopUI(true);
                    }
                    lastClickTime = 0;
                } else {
                    lastClickTime = currentTime;
                }
            }, true);

            function toggleDesktopUI(show) {
                const backdrop = document.getElementById('uiBackdrop');
                const uiWrapper = document.getElementById('uiWrapper');
                if (show) {
                    backdrop.style.setProperty('display', 'block', 'important');
                    uiWrapper.style.setProperty('display', 'flex', 'important');
                    backdrop.classList.remove('pointer-events-none');
                    requestAnimationFrame(() => { backdrop.style.opacity = '1'; uiWrapper.style.opacity = '1'; });
                } else {
                    backdrop.style.opacity = '0';
                    uiWrapper.style.opacity = '0';
                    backdrop.classList.add('pointer-events-none');
                    setTimeout(() => {
                        if (backdrop.style.opacity === '0') {
                            backdrop.style.setProperty('display', 'none', 'important');
                            uiWrapper.style.setProperty('display', 'none', 'important');
                        }
                    }, 250);
                }
            }
            document.getElementById('uiBackdrop').addEventListener('click', () => { toggleDesktopUI(false); });

            // 🌟 為左右兩欄綁定滑鼠事件隔離與滾輪手動驅動
            ['uiLeftColumn', 'uiRightColumn'].forEach(colId => {
                const colEl = document.getElementById(colId);
                if (!colEl) return;
                ['pointerdown', 'mousedown', 'touchstart', 'click'].forEach(evt => {
                    colEl.addEventListener(evt, (e) => { e.stopPropagation(); }, { passive: false });
                });
                colEl.addEventListener('wheel', (e) => {

               let targetZoom = mode === 'battle' ? 2.5 : 1.0;

                   backgroundColor: "#00000000", alpha: true, showControls: false,

                           if (tSkin) { player.skeleton.setSkinByName(tSkin.name); }

                       player.skeleton.setToSetupPose(); 
                       fixSpineMultiplyHole(player);
                       player.skeleton.updateWorldTransform();
                       
                       buildAnimationDropdown(player); 
            
                       setTimeout(() => {
                           const anims = player.skeleton.data.animations.map(a => a.name);
                           const fallbackAnim = mode === 'lobby' ? 'Idle_1' : 'Idle';
                           const startAnim = anims.includes(fallbackAnim) ? fallbackAnim : (anims.includes('idle') ? 'idle' : anims[0]);

                           if (startAnim) {
                               player.animationState.setAnimation(0, startAnim, true);
                               document.getElementById('animSelectText').innerText = startAnim;

                   error: function (p, reason) {
                       console.error("Spine載入失敗: ", reason);
                   }
               });
            }

            function applyDefaultCamera() {
                if (!globalPlayer || !globalPlayer.skeleton) return;
                currentZoom = currentMode === 'battle' ? 2.5 : 1.0;
                globalPlayer.skeleton.scaleX = currentZoom; globalPlayer.skeleton.scaleY = currentZoom;
                globalPlayer.skeleton.x = currentMode === 'battle' ? 1450 : 600; 
                globalPlayer.skeleton.y = currentMode === 'lobby' ? 600 * (1 - currentZoom) : 0;
                globalPlayer.skeleton.updateWorldTransform();
            }
            window.addEventListener('resize', applyDefaultCamera);
            
            function buildAnimationDropdown(player) {
                const animList = document.getElementById('animList'); animList.innerHTML = '';
                const anims = player.skeleton.data.animations.map(a => a.name).sort();
                anims.forEach(animName => {
                    const btn = document.createElement('button');
                    btn.className = "text-left px-4 py-2.5 text-sm hover:bg-amber-100/80 dark:hover:bg-slate-700/80 w-full truncate transition-colors text-gray-800 dark:text-gray-100 flex-shrink-0 border-b border-gray-200/50 dark:border-slate-700/50";
                    btn.innerText = animName;
                    btn.onclick = (e) => {
                        e.stopPropagation(); player.animationState.setAnimation(0, animName, true);
                        document.getElementById('animSelectText').innerText = animName;
                        animList.classList.add('hidden'); animList.classList.remove('flex');
                        player.play();
                        player.skeleton.updateWorldTransform();
                    };
                    animList.appendChild(btn);
                });
            }

            function setupComplexInteractions(player, container) {
                const canvas = container.querySelector('canvas');
                if (!canvas) return;
                canvas.style.touchAction = 'none';
                
                function screenToWorldCoords(cam, screenX, screenY, rect) {
                    let vec;
                    if (typeof spine !== 'undefined' && spine.webgl && spine.webgl.Vector3) {
                        vec = new spine.webgl.Vector3(screenX, screenY, 0);
                    } else {
                        vec = new spine.Vector3(screenX, screenY, 0);
                    }
                    cam.screenToWorld(vec, rect.width, rect.height);
                    return { x: vec.x, y: vec.y };
                }
                
                let pointers = {}; let isDragging = false;
                let startX = 0, startY = 0; let lastMouseX = 0, lastMouseY = 0; let dragDistance = 0;
                
                let hitZoneOnDown = null; let activeInteractBone = null; let initialBoneX = 0, initialBoneY = 0;
                let hasTriggeredRub = false; let tickleTimer = null; let voiceRecoveryTimer = null;
            
                const getIsLobby = () => typeof currentMode === 'undefined' || currentMode === 'lobby';
                const updateUI = (text) => { const el = document.getElementById('animSelectText'); if (el) el.innerText = text; };
                const safeClearIdle = () => { if (typeof globalIdleTimer !== 'undefined') clearTimeout(globalIdleTimer); };
                const safeStartIdle = () => { if (typeof startRandomAnimationLoop === 'function') startRandomAnimationLoop(); };
            
                function getHitZone(mouseX, mouseY) {
                    if (!getIsLobby()) return null;
                    const rect = canvas.getBoundingClientRect();
                    if (!globalPlayer || !globalPlayer.sceneRenderer || !globalPlayer.sceneRenderer.camera) return null;
                    const cam = globalPlayer.sceneRenderer.camera;
                    
                    const worldPos = screenToWorldCoords(cam, mouseX, mouseY, rect);
                    player.skeleton.updateWorldTransform();
                 
                    let clickedPart = null; let minDistance = Infinity;
                 
                    const hitZones = [
                        { name: "臉頰", bones: ["Character_Ball_Move"], radius: 60 },
                        { name: "頭部", bones: ["Character_Pat"], radius: 60 }, 
                        { name: "身體", bones: ["Character_Tickle"], radius: 70 }
                    ];
                 
                    hitZones.forEach(zone => {
                        let targetBone = null;
                        for (let bName of zone.bones) { targetBone = player.skeleton.findBone(bName); if (targetBone) break; }
                        if (targetBone) {
                            const distance = Math.hypot(worldPos.x - targetBone.worldX, worldPos.y - targetBone.worldY);
                            if (distance < zone.radius && distance < minDistance) { 
                                minDistance = distance; clickedPart = { ...zone, bone: targetBone }; 
                            }
                        }
                    });
                    return clickedPart;
                }
            
                canvas.addEventListener('pointerdown', (e) => {
                    pointers[e.pointerId] = { x: e.clientX, y: e.clientY }; clearTimeout(voiceRecoveryTimer);
                    isDragging = true; startX = lastMouseX = e.clientX; startY = lastMouseY = e.clientY;
                    dragDistance = 0; hasTriggeredRub = false; hitZoneOnDown = null; activeInteractBone = null;
                    canvas.setPointerCapture(e.pointerId);
            
                    const rect = canvas.getBoundingClientRect();
                    hitZoneOnDown = getHitZone(e.clientX - rect.left, e.clientY - rect.top);
                    
                    if (hitZoneOnDown && (hitZoneOnDown.name === "臉頰" || hitZoneOnDown.name === "頭部")) {
                        activeInteractBone = hitZoneOnDown.bone; initialBoneX = activeInteractBone.x; initialBoneY = activeInteractBone.y;
                    }
                });
            
                canvas.addEventListener('pointermove', (e) => {
                    if (pointers[e.pointerId]) { pointers[e.pointerId] = { x: e.clientX, y: e.clientY }; }
                    if (!isDragging || !player.skeleton) return;
                    const rect = canvas.getBoundingClientRect(); if (rect.width === 0) return;
            
                    const dx = e.clientX - lastMouseX; const dy = e.clientY - lastMouseY; dragDistance += Math.hypot(dx, dy);
            
                    if (dragDistance > 10 && hitZoneOnDown && !hasTriggeredRub) {
                        hasTriggeredRub = true; clearTimeout(tickleTimer); safeClearIdle(); 
                        const animNames = player.skeleton.data.animations.map(a => a.name);
            
                        if (hitZoneOnDown.name === "臉頰" && animNames.includes("Touch_Idle")) {
                            player.animationState.setAnimation(0, "Touch_Idle", true); updateUI("Touch_Idle");
                        } else if (hitZoneOnDown.name === "頭部" && animNames.includes("Pat_Idle")) {
                            player.animationState.setAnimation(0, "Pat_Idle", true); updateUI("Pat_Idle");
                       } else if (hitZoneOnDown.name === "身體" && animNames.includes("Tickle_Idle_1")) {
                            player.animationState.setAnimation(0, "Tickle_Idle_1", true); updateUI("Tickle_Idle_1");
                            VoiceManager.playTickleStart(() => {
                                if (isDragging) {
                                    if (animNames.includes("Tickle_Idle_2")) {
                                        player.animationState.setAnimation(0, "Tickle_Idle_2", true); updateUI("Tickle_Idle_2");
                                    }
                                    VoiceManager.playTickleDuring();
                                }
                            });
                        }
                    }
            
                    if (hasTriggeredRub && hitZoneOnDown && activeInteractBone) {
                        const isCheek = hitZoneOnDown.name === "臉頰"; const cam = globalPlayer.sceneRenderer.camera;
                        const startWorld = screenToWorldCoords(cam, startX - rect.left, startY - rect.top, rect);
                        const currentWorld = screenToWorldCoords(cam, e.clientX - rect.left, e.clientY - rect.top, rect);
                        
                        const stretchIntensity = isCheek ? 0.8 : 0.5; 
                        let worldDx = (currentWorld.x - startWorld.x) * stretchIntensity; let worldDy = (currentWorld.y - startWorld.y) * stretchIntensity;
                        if (isCheek && worldDx > 0) worldDx = 0; 
                        
                        let baseWorld = { x: initialBoneX, y: initialBoneY };
                        if (activeInteractBone.parent) {
                            activeInteractBone.parent.localToWorld(baseWorld);
                        } else {
                            baseWorld.x = player.skeleton.x + initialBoneX * player.skeleton.scaleX;
                            baseWorld.y = player.skeleton.y + initialBoneY * player.skeleton.scaleY;
                        }
                        
                        let targetWorld = { x: baseWorld.x + worldDx, y: baseWorld.y + worldDy };
                        if (activeInteractBone.parent) activeInteractBone.parent.worldToLocal(targetWorld);
                        
                        let localDx = targetWorld.x - initialBoneX; let localDy = targetWorld.y - initialBoneY;
                        let rawDistance = Math.hypot(localDx, localDy);
                        const MAX_RADIUS = isCheek ? 55 : 20; 
            
                        if (rawDistance > 0) {
                            let elasticDist = MAX_RADIUS * (1 - Math.exp(-rawDistance / (MAX_RADIUS * 1.2)));
                            localDx = (localDx / rawDistance) * elasticDist; localDy = (localDy / rawDistance) * elasticDist;
                        }
                        activeInteractBone.x = initialBoneX + localDx; activeInteractBone.y = initialBoneY + localDy;
                        player.skeleton.updateWorldTransform();
                    } 
                    lastMouseX = e.clientX; lastMouseY = e.clientY;
                });
            
                canvas.addEventListener('mousemove', (e) => {
                    const rect = canvas.getBoundingClientRect(); const hit = getHitZone(e.clientX - rect.left, e.clientY - rect.top);
                    if (hit) { canvas.style.cursor = 'pointer'; } else { canvas.style.cursor = 'default'; }
                });
            
                const stopDrag = (e) => { 
                    delete pointers[e.pointerId];
                    if (!isDragging) return;
                    isDragging = false; clearTimeout(tickleTimer); VoiceManager.stop(0.5);
            
                    if (!getIsLobby()) return;
                    const animNames = player.skeleton.data.animations.map(a => a.name);
            
                    if (activeInteractBone) {
                        let targetX = initialBoneX, targetY = initialBoneY; let bouncingBone = activeInteractBone; activeInteractBone = null; 
                        let velX = 0, velY = 0; const tension = 0.20, friction = 0.85; 
                        
                        function applyBounce() {
                            let dx = targetX - bouncingBone.x; let dy = targetY - bouncingBone.y;
                            velX += dx * tension; velY += dy * tension; velX *= friction; velY *= friction;
                            bouncingBone.x += velX; bouncingBone.y += velY;
                            if (Math.abs(dx) > 0.1 || Math.abs(velX) > 0.1 || Math.abs(dy) > 0.1 || Math.abs(velY) > 0.1) {
                                requestAnimationFrame(applyBounce);
                            } else { bouncingBone.x = targetX; bouncingBone.y = targetY; }
                        }
                        applyBounce();
                    } 
            
                    if (hasTriggeredRub) {
                        if (hitZoneOnDown && hitZoneOnDown.name === "臉頰" && animNames.includes("Touch_End")) {
                            player.animationState.setAnimation(0, "Touch_End", true); updateUI("Touch_End");
                            VoiceManager.playTouch(() => {
                                voiceRecoveryTimer = setTimeout(() => {
                                    player.animationState.setAnimation(0, "Idle_1", true); updateUI("Idle_1"); safeStartIdle();
                                }, 500);
                            });
                        } else if (hitZoneOnDown && hitZoneOnDown.name === "頭部" && animNames.includes("Pat_End")) {
                            player.animationState.setAnimation(0, "Pat_End", true); updateUI("Pat_End");
                            VoiceManager.playPat(() => {
                                voiceRecoveryTimer = setTimeout(() => {
                                    player.animationState.setAnimation(0, "Idle_1", true); updateUI("Idle_1"); safeStartIdle();
                                }, 500);
                            });
                        } else if (hitZoneOnDown && hitZoneOnDown.name === "身體" && animNames.includes("Tickle_End")) {
                            player.animationState.setAnimation(0, "Tickle_End", false); player.animationState.addAnimation(0, "Idle_1", true, 0); updateUI("Tickle_End"); safeStartIdle();
                        } else {
                            player.animationState.setAnimation(0, "Idle_1", true); updateUI("Idle_1"); safeStartIdle();
                        }
                    } else if (hitZoneOnDown && dragDistance < 10) {
                        if ((hitZoneOnDown.name === "頭部" || hitZoneOnDown.name === "臉頰") && animNames.includes("Smash_End_1")) {
                            player.animationState.setAnimation(0, "Smash_End_1", false);
                            if (animNames.includes("Smash_End_2")) { player.animationState.addAnimation(0, "Smash_End_2", true, 0); }
                            updateUI("Smash_End");
                            VoiceManager.playSmash(() => {
                                voiceRecoveryTimer = setTimeout(() => {
                                    player.animationState.setAnimation(0, "Idle_1", true); updateUI("Idle_1"); safeStartIdle();
                                }, 500);
                            });
                        } else { safeStartIdle(); }
                    } else { safeStartIdle(); }
                };
            
                canvas.addEventListener('pointerup', stopDrag);
                canvas.addEventListener('pointercancel', stopDrag);
                canvas.addEventListener('pointerout', stopDrag);
            }

            window.wallpaperMiniPlayers = [];
            function loadWallpaperMiniSpines(charName, costumeKey, count = 5) {
                const container = document.getElementById('wallpaperMiniContainer'); if (!container) return;

                if (window.wallpaperMiniPlayers && window.wallpaperMiniPlayers.length > 0) {
                    window.wallpaperMiniPlayers.forEach(p => p.dispose()); window.wallpaperMiniPlayers = [];
                }
                container.innerHTML = ''; const skinName = `Mini_${costumeKey}`;

                const vw = window.innerWidth || 1920;
                const vh = window.innerHeight || 1080;

                // 動態偵測角色簡介 + 時鐘容器的實際佔用矩形（包含 24px 安全邊距）
                const infoEl = document.getElementById('desktopInfoContainer');
                let infoBox = null;
                if (infoEl) {
                    const rect = infoEl.getBoundingClientRect();
                    if (rect.width > 0 && rect.height > 0) {
                        const pad = 24;
                        infoBox = {
                            left: rect.left - pad,
                            right: rect.right + pad,
                            top: rect.top - pad,
                            bottom: rect.bottom + pad
                        };
                    }
                }

                // 動態偵測左上角 Logo 容器的實際佔用矩形（包含 16px 安全邊距）
                const logoEl = document.getElementById('desktopLogoContainer');
                let logoBox = null;
                if (logoEl) {
                    const rect = logoEl.getBoundingClientRect();
                    if (rect.width > 0 && rect.height > 0) {
                        const pad = 16;
                        logoBox = {
                            left: rect.left - pad,
                            right: rect.right + pad,
                            top: rect.top - pad,
                            bottom: rect.bottom + pad
                        };
                    }
                }

                // 記錄已放置的迷你 Spine（中心像素座標與碰撞半徑）
                const placedMinis = [];
                const BASE_SIZE = 420;

                for (let i = 0; i < count; i++) {
                    const randomAngle = Math.floor(Math.random() * 8) * 45;
                    const visualScale = parseFloat(((Math.random() * 0.3 + 0.9) * 0.5).toFixed(2));
                    const radius = (BASE_SIZE * visualScale) * 0.45;
                    const edgeMargin = Math.max(radius * 0.7, 60);

                    let chosenX = null;
                    let chosenY = null;
                    const maxAttempts = 400;

                    for (let attempt = 0; attempt < maxAttempts; attempt++) {
                        // 優先保留 20px 額外呼吸間距，若螢幕較小則逐步放寬
                        const extraGap = attempt < 250 ? 20 : (attempt < 350 ? 5 : 0);

                        const cx = edgeMargin + Math.random() * Math.max(10, vw - edgeMargin * 2);
                        const cy = edgeMargin + Math.random() * Math.max(10, vh - edgeMargin * 2);

                        // 1. 避開角色簡介與時鐘區域（圓形對矩形碰撞檢測）
                        let hitsInfoArea = false;
                        if (infoBox) {
                            const nearestX = Math.max(infoBox.left, Math.min(cx, infoBox.right));
                            const nearestY = Math.max(infoBox.top, Math.min(cy, infoBox.bottom));
                            if (Math.hypot(cx - nearestX, cy - nearestY) < radius) {
                                hitsInfoArea = true;
                            }
                        } else {
                            const pctX = (cx / vw) * 100;
                            const pctY = (cy / vh) * 100;
                            if (pctX > 25 && pctX < 68 && pctY > 45) hitsInfoArea = true;
                        }
                        if (hitsInfoArea) continue;

                        // 1.5 避開左上角 Logo 區域
                        if (logoBox) {
                            const nearestLogoX = Math.max(logoBox.left, Math.min(cx, logoBox.right));
                            const nearestLogoY = Math.max(logoBox.top, Math.min(cy, logoBox.bottom));
                            if (Math.hypot(cx - nearestLogoX, cy - nearestLogoY) < radius) {
                                continue;
                            }
                        }

                        // 2. 避開右側主 Spine 區域
                        const pctX = (cx / vw) * 100;
                        const pctY = (cy / vh) * 100;
                        const inMainCharacterArea = (pctX > 45 && pctY > 26);
                        if (inMainCharacterArea) continue;

                        // 3. 避開其他已生成的迷你 Spine（圓形中心距離檢測）
                        let overlapsOtherMini = false;
                        for (const other of placedMinis) {
                            const minDist = radius + other.radius + extraGap;
                            if (Math.hypot(cx - other.x, cy - other.y) < minDist) {
                                overlapsOtherMini = true;
                                break;
                            }
                        }
                        if (overlapsOtherMini) continue;

                        chosenX = cx;
                        chosenY = cy;
                        break;
                    }

                    // 空間不足時安全跳過剩餘個數，防止無窮迴圈
                    if (chosenX === null || chosenY === null) continue;

                    placedMinis.push({ x: chosenX, y: chosenY, radius });

                    const leftVw = ((chosenX / vw) * 100).toFixed(2);
                    const topVh = ((chosenY / vh) * 100).toFixed(2);
                    const wrapperId = `mini-wp-${i}`;

                    const wrapperHtml = `<div id="${wrapperId}" style="position: absolute; left: ${leftVw}vw; top: ${topVh}vh; width: 420px; height: 420px; transform: translate(-50%, -50%) rotate(${randomAngle}deg) scale(${visualScale}); transform-origin: center center; opacity: 0.9; z-index: 5; pointer-events: none;"></div>`;
                    container.insertAdjacentHTML('beforeend', wrapperHtml);

                    const miniPlayer = new spine.SpinePlayer(wrapperId, {
                        skelUrl: "./mini/Minimi.skel.bytes", atlasUrl: "./mini/Minimi.atlas.txt",
                        skin: skinName, animation: "Idle", showControls: false, showLoading: false,
                        backgroundColor: "#00000000", alpha: true, premultipliedAlpha: true,
                        viewport: { x: -210, y: -35, width: 420, height: 420 },
                        success: (player) => {
                            if (typeof fixSpineMultiplyHole === 'function') { fixSpineMultiplyHole(player); }
                            const canvas = document.getElementById(wrapperId).querySelector('canvas');
                            if (canvas) {
                                canvas.style.width = '100%'; canvas.style.height = '100%';
                                canvas.style.position = 'relative'; canvas.style.zIndex = '99999';
                            }
                            const anims = player.skeleton.data.animations.map(a => a.name);
                            if (!anims.includes("Idle")) {
                                let targetAnim = anims.includes("idle") ? "idle" : anims[0];
                                if (targetAnim) { player.animationState.setAnimation(0, targetAnim, true); }
                            }
                            player.animationState.timeScale = 0.5 + Math.random() * 0.5;
                            player.play(); window.wallpaperMiniPlayers.push(player);
                        },
                        error: () => {
                            const el = document.getElementById(wrapperId); if (el) el.remove();
                        }
                    });
                }
            }
        </script>
    </body>
