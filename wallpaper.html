<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>坨坨桌布</title>

        <script src="https://cdn.tailwindcss.com"></script>
        <script src="data_config.js"></script>
        <script src="data_core.js"></script>
        <link rel="stylesheet" href="sprites.css">
        <link rel="stylesheet" href="./style.css">
        <link id="dynamicFavicon" rel="icon" href="./Favicon.png" type="image/png">
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./spine-player.min.css">
        <script src="./spine-player.min.js"></script>
        
        <script>
            const SafeStorage = {
                get: (k) => { try { return localStorage.getItem(k); } catch(e) { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} }
            };
            const isDarkMode = SafeStorage.get('theme') === 'dark' || (!SafeStorage.get('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDarkMode) { document.documentElement.classList.add('dark'); }
            window.currentLang = SafeStorage.get('user_lang') || "zh-TW";
            
            window.weVolume = 0.8;

            window.wallpaperPropertyListener = {
                applyUserProperties: function(properties) {
                    if (properties.volume) {
                        window.weVolume = (properties.volume.value / 100) * 0.8;
                        if (VoiceManager && VoiceManager.currentAudio) {
                            VoiceManager.currentAudio.volume = window.weVolume;
                        }
                    }
                }
            };
        </script>
        <style>
            html, body {
                margin: 0; padding: 0; width: 100vw; height: 100vh;
                overflow: hidden; background: transparent !important;
                font-family: 'Noto Sans TC', sans-serif;
            }

            /* 🌟 大廳背景層：將 1105x800 等比例完全擴大覆蓋整個桌面 */
            #desktopBgLayer {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                background-size: cover;
                background-position: center center;
                background-repeat: no-repeat;
                z-index: 0;
                pointer-events: none;
                transition: background-image 0.35s ease-in-out;
            }
            
            /* 🌟 整體 UI 放大與層級強制置頂 */
            #uiWrapper {
                position: relative !important;
                z-index: 99999 !important;
                display: none !important; opacity: 0;
                transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
                max-width: 850px; margin: 0 auto; padding: 1.5rem;
                transform: scale(1.12);
                transform-origin: center center;
                pointer-events: auto !important;
            }
            #uiBackdrop {
                z-index: 99990 !important;
            }
            
            #spineViewerSection {
                margin: 0; padding: 0; border: none; border-radius: 0;
                width: 100vw; height: 100vh; position: absolute; inset: 0;
                box-shadow: none; background: none !important; z-index: 10;
            }
            #spineCanvasContainer {
                width: 100vw !important; height: 100vh !important;
                border: none; border-radius: 0; margin: 0;
                background: transparent !important;
            }
            .spine-player-controls { display: none !important; }
            #spineCanvasContainer canvas {
                width: 100% !important; height: 100% !important;
                display: block !important; touch-action: none; pointer-events: auto;
            }
            .desktop-clock-shadow { 
                text-shadow: 0 4px 15px rgba(0,0,0,0.8), 0 1px 3px rgba(0,0,0,0.9), 0 0 5px rgba(0,0,0,0.5); 
            }
            .spine-player-loading-custom {
                position: absolute; top: 50%; left: 50%; width: 80px; height: 80px; margin: -40px 0 0 -40px;
                background: url('./golden_crayon.png') no-repeat center center; background-size: contain;
                animation: crayonFloat 1.5s ease-in-out infinite; z-index: 10;
            }
            @keyframes crayonFloat {
                0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 5px rgba(251, 191, 36, 0.5)); }
                50% { transform: translateY(-10px) scale(1.05); filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.9)); }
            }
            
            ::-webkit-scrollbar { width: 10px; height: 10px; }
            ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 10px; }
            .dark ::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); }
            ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
            .dark ::-webkit-scrollbar-thumb { background-color: #475569; }
            ::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
            
            .collapsible-content { 
                transition: max-height 0.3s ease-out, opacity 0.3s ease-out; 
                overflow-x: hidden !important; 
                overflow-y: auto !important; 
                pointer-events: auto !important;
            }
            .collapsed { 
                max-height: 0 !important; 
                opacity: 0 !important; 
                margin-top: 0 !important; 
                overflow: hidden !important; 
                pointer-events: none !important; 
            }
            .custom-select-btn { -webkit-tap-highlight-color: transparent; }
            
            @keyframes dualColorPulse { 0% { border-color: var(--c1); box-shadow: 0 0 6px var(--c1); } 50% { border-color: var(--c2); box-shadow: 0 0 6px var(--c2); } 100% { border-color: var(--c1); box-shadow: 0 0 6px var(--c1); } }
            .dual-border-anim { --c1: #c084fc; --c2: #4ade80; animation: dualColorPulse 3s ease-in-out infinite; }
            @keyframes pentaColorPulse { 0% { border-color: #4ade80; box-shadow: 0 0 6px #4ade80; } 20% { border-color: #60a5fa; box-shadow: 0 0 6px #60a5fa; } 40% { border-color: #f87171; box-shadow: 0 0 6px #f87171; } 60% { border-color: #facc15; box-shadow: 0 0 6px #facc15; } 80% { border-color: #c084fc; box-shadow: 0 0 6px #c084fc; } 100% { border-color: #4ade80; box-shadow: 0 0 6px #4ade80; } }
            .penta-border-anim { animation: pentaColorPulse 5s ease-in-out infinite; }
        </style>
    </head>
    <body class="text-gray-800 dark:text-gray-200 transition-colors duration-300">
        
        <!-- 🌟 最底層大廳背景 -->
        <div id="desktopBgLayer"></div>

        <div id="wallpaperMiniContainer" class="fixed inset-0 pointer-events-none z-[5] overflow-hidden"></div>
        <div id="uiBackdrop" class="fixed inset-0 bg-black/70 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300" style="display: none !important;"></div>

        <!-- 🌟 z-index 提升為 2，確保在背景圖層之上 -->
        <div id="desktopClock" class="fixed text-white desktop-clock-shadow pointer-events-none" style="bottom: 12vh; left: 3vw; z-index: 2; display: flex; flex-direction: column; align-items: flex-start;">
            <div id="clockDate" class="text-3xl sm:text-4xl font-black tracking-widest text-amber-300 mb-1">DD/MM/YYYY</div>
            <div id="clockTime" class="text-5xl sm:text-6xl font-black tracking-wider flex items-baseline gap-2">
                <span id="clockTimeDigits">HH:MM:SS</span> 
                <span id="clockAmPm" class="text-2xl sm:text-3xl text-amber-500 font-bold">AM</span>
            </div>
        </div>

        <div id="uiWrapper" class="space-y-4 relative">
            <header class="bg-white/95 dark:bg-slate-800/95 backdrop-blur-md p-5 rounded-2xl shadow-xl border-4 border-amber-400 dark:border-slate-600 flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-black text-amber-950 dark:text-amber-400 mb-0.5 flex items-center gap-2">
                        <div class="sprite-base sprite-common sprite-Title_Rim scale-[0.7] origin-center shrink-0"></div>
                        <span class="-ml-1">坨坨桌布</span>
                    </h1>
                </div>
                <div class="flex items-center gap-3 shrink-0">
                    <button onclick="toggleTimeFormat()" class="px-3 py-2 text-sm bg-slate-600 text-white font-bold rounded-lg shadow hover:bg-slate-700 transition shrink-0">🕒 <span id="timeFormatText">12H</span></button>
                    <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-amber-100 dark:bg-slate-700 text-amber-900 dark:text-white border border-amber-300 dark:border-slate-500 text-sm font-bold rounded-lg px-3 py-2 outline-none shadow-sm cursor-pointer">
                        <option value="zh-TW">繁中</option>
                        <option value="ja">日本語</option>
                        <option value="en">EN</option>
                    </select>
                </div>
            </header>
            
            <section class="bg-white/95 dark:bg-slate-800/95 backdrop-blur-md p-5 rounded-2xl shadow-xl border border-amber-200 dark:border-slate-700 transition-all">
                <div class="flex justify-between items-center mb-3 border-b border-amber-200 dark:border-slate-700 pb-2">
                    <h2 class="text-lg font-bold text-amber-900 dark:text-amber-400" data-i18n="ui_select_char">👥 選擇坨坨</h2>
                    <button id="toggleAllCharBtn" onclick="toggleAllCharacters()" class="px-3 py-1.5 text-xs font-bold bg-amber-100 dark:bg-slate-700 text-amber-800 dark:text-gray-300 rounded-lg hover:bg-amber-200 transition shadow-sm" data-i18n="ui_show_all">顯示全部 🔽</button>
                </div>
                <div id="charGridContainer" class="space-y-3 collapsible-content collapsed pr-2" style="max-height: 0px; opacity: 0; overflow-y: auto;"></div>
            </section>

            <div id="playerControls" class="bg-amber-50/95 dark:bg-slate-700/95 backdrop-blur-md p-5 rounded-xl border-2 border-amber-300 dark:border-slate-500 flex flex-col gap-3 transition-opacity w-full mx-auto shadow-xl">
                <div class="flex items-center justify-between border-b border-amber-200 dark:border-slate-600 pb-3">
                    <div class="flex items-center gap-3">
                        <div id="activeCharIconContainer" class="w-12 h-12 rounded-lg border-2 border-amber-400 shadow-sm overflow-hidden bg-white dark:bg-slate-700 hidden relative items-center justify-center shrink-0"></div>
                        <h2 id="activeCharName" class="text-xl font-black text-amber-900 dark:text-amber-300" data-i18n="ui_please_select">請先選擇坨坨</h2>
                    </div>
                </div>

                <div class="flex items-center justify-between gap-3 flex-wrap">
                    <div class="flex items-center gap-2">
                        <button id="btnPlayPause" onclick="togglePlay()" class="w-10 h-10 flex items-center justify-center bg-amber-500 text-white rounded-lg shadow hover:bg-amber-600 transition text-base" title="播放/暫停">⏸️</button>
                    </div>
                    <div class="flex items-center gap-2 flex-wrap">
                        <!-- 🌟 大廳背景選擇器與快速切換按鈕 -->
                        <div class="flex items-center gap-1 bg-white dark:bg-slate-800 border border-gray-300 dark:border-slate-500 rounded-lg px-1.5 py-1 shadow-sm">
                            <span class="text-xs pl-1">🖼️</span>
                            <button onclick="stepLobbyBackground(-1)" class="px-1.5 py-1 text-xs font-bold text-gray-600 dark:text-gray-300 hover:bg-amber-100 dark:hover:bg-slate-700 rounded" title="上一張背景">◀</button>
                            <select id="bgSelect" onchange="changeLobbyBackground(this.value)" class="bg-transparent text-gray-800 dark:text-gray-200 text-xs sm:text-sm font-bold px-1 py-1 outline-none cursor-pointer min-w-[110px]">
                                <option value="none">無背景 (透明)</option>
                            </select>
                            <button onclick="stepLobbyBackground(1)" class="px-1.5 py-1 text-xs font-bold text-gray-600 dark:text-gray-300 hover:bg-amber-100 dark:hover:bg-slate-700 rounded" title="下一張背景">▶</button>
                        </div>

                        <button id="btnModeSwitch" onclick="toggleViewerMode()" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white text-sm font-bold rounded-lg shadow whitespace-nowrap" data-i18n="ui_mode_lobby">🔄 模式: 大廳</button>
                        <select id="costumeSelect" onchange="changeSpineCostume(this.value)" class="bg-white text-gray-800 border border-gray-300 text-sm font-bold rounded-lg px-3 py-2 outline-none min-w-[110px]">
                            <option value="" data-i18n="ui_costume">服裝</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-between w-full relative z-[100] items-center gap-4">
                    <div class="relative w-full" id="animDropdownWrapper">
                        <button onclick="toggleCustomSelect('animList')" class="custom-select-btn w-full bg-white border border-gray-300 text-sm font-bold rounded-lg px-3 py-2.5 flex justify-between items-center text-left shadow-sm">
                            <span id="animSelectText" class="truncate text-amber-900" data-i18n="ui_select_anim">選擇動作</span>
                            <span class="ml-1 text-gray-400 shrink-0 text-xs">▼</span>
                        </button>
                        <div id="animList" class="hidden absolute top-[calc(100%+6px)] left-0 w-full bg-white border border-amber-300 rounded-lg shadow-2xl max-h-[220px] overflow-y-auto flex-col py-1 z-[110]"></div>
                    </div>
                </div>
            </div>
        </div>

        <section id="spineViewerSection">
            <div id="spineCanvasContainer" class="w-full h-full relative overflow-hidden flex items-center justify-center pointer-events-auto"></div>
        </section>

        <script>
            // 🌟 大廳背景自動偵測與切換管理器
            // 若你的編號超過 060，可調大 MAX_BG_SCAN 或在 EXTRA_BG_IDS 手動補充編號字串（例如 ["101", "102"]）
            const MAX_BG_SCAN = 60;
            const EXTRA_BG_IDS = [];
            let detectedBgList = [];

            function initLobbyBackgrounds() {
                const candidateIds = new Set();
                for (let i = 1; i <= MAX_BG_SCAN; i++) {
                    candidateIds.add(String(i).padStart(3, '0'));
                }
                EXTRA_BG_IDS.forEach(id => candidateIds.add(String(id)));

                const idsArray = Array.from(candidateIds);
                let pendingChecks = idsArray.length * 2; // 同時檢查 ./bg/ 與根目錄 ./
                const foundMap = new Map();

                function onCheckDone() {
                    pendingChecks--;
                    if (pendingChecks <= 0) {
                        // 依編號由小到大排序
                        detectedBgList = Array.from(foundMap.entries())
                            .sort((a, b) => a[0].localeCompare(b[0]))
                            .map(([id, url]) => ({ id, url }));

                        const bgSelect = document.getElementById('bgSelect');
                        if (!bgSelect) return;
                        bgSelect.innerHTML = '<option value="none">無背景 (透明)</option>';

                        detectedBgList.forEach(item => {
                            const opt = document.createElement('option');
                            opt.value = item.url;
                            opt.text = `大廳背景 ${item.id}`;
                            bgSelect.appendChild(opt);
                        });

                        // 還原上次選擇的背景，若無紀錄則預設套用第一張找到的背景
                        const savedBg = SafeStorage.get('we_lobby_bg');
                        if (savedBg === 'none') {
                            changeLobbyBackground('none');
                        } else if (savedBg && detectedBgList.some(b => b.url === savedBg)) {
                            changeLobbyBackground(savedBg);
                        } else if (detectedBgList.length > 0) {
                            changeLobbyBackground(detectedBgList[0].url);
                        }
                    }
                }

                idsArray.forEach(id => {
                    const folders = ['./bg/', './'];
                    folders.forEach(folder => {
                        const url = `${folder}Lobby${id}.png`;
                        const img = new Image();
                        img.onload = () => {
                            if (!foundMap.has(id)) {
                                foundMap.set(id, url);
                            }
                            onCheckDone();
                        };
                        img.onerror = () => {
                            onCheckDone();
                        };
                        img.src = url;
                    });
                });
            }

            function changeLobbyBackground(bgUrl) {
                const bgLayer = document.getElementById('desktopBgLayer');
                const bgSelect = document.getElementById('bgSelect');
                if (!bgLayer) return;

                if (!bgUrl || bgUrl === 'none') {
                    bgLayer.style.backgroundImage = 'none';
                    SafeStorage.set('we_lobby_bg', 'none');
                    if (bgSelect) bgSelect.value = 'none';
                } else {
                    bgLayer.style.backgroundImage = `url('${bgUrl}')`;
                    SafeStorage.set('we_lobby_bg', bgUrl);
                    if (bgSelect) bgSelect.value = bgUrl;
                }
            }

            function stepLobbyBackground(delta) {
                const bgSelect = document.getElementById('bgSelect');
                if (!bgSelect || bgSelect.options.length <= 1) return;
                let nextIdx = bgSelect.selectedIndex + delta;
                if (nextIdx >= bgSelect.options.length) nextIdx = 0;
                if (nextIdx < 0) nextIdx = bgSelect.options.length - 1;
                changeLobbyBackground(bgSelect.options[nextIdx].value);
            }

            // 🌟 終極 WE 雙擊解決方案
            let lastClickTime = 0;
            window.addEventListener('pointerdown', function(e) {
                if (e.target.closest('#uiWrapper')) return;
                let currentTime = new Date().getTime();
                if (currentTime - lastClickTime < 400) {
                    const backdrop = document.getElementById('uiBackdrop');
                    if (window.getComputedStyle(backdrop).display === 'none' || backdrop.style.opacity === '0') {
                        toggleDesktopUI(true);
                    }
                    lastClickTime = 0;
                } else {
                    lastClickTime = currentTime;
                }
            }, true);

            function toggleDesktopUI(show) {
                const backdrop = document.getElementById('uiBackdrop'); const uiWrapper = document.getElementById('uiWrapper');
                if (show) {
                    backdrop.style.setProperty('display', 'block', 'important'); uiWrapper.style.setProperty('display', 'block', 'important');
                    backdrop.classList.remove('pointer-events-none');
                    requestAnimationFrame(() => { backdrop.style.opacity = '1'; uiWrapper.style.opacity = '1'; });
                } else {
                    backdrop.style.opacity = '0'; uiWrapper.style.opacity = '0'; backdrop.classList.add('pointer-events-none');
                    setTimeout(() => {
                        if (backdrop.style.opacity === '0') {
                            backdrop.style.setProperty('display', 'none', 'important'); uiWrapper.style.setProperty('display', 'none', 'important');
                        }
                    }, 300);
                }
            }
            document.getElementById('uiBackdrop').addEventListener('click', () => { toggleDesktopUI(false); });

            // 🌟 強制隔離 UI 事件並修復滾輪在容器內的滾動行為
            const uiWrapperElement = document.getElementById('uiWrapper');
            if (uiWrapperElement) {
                ['pointerdown', 'mousedown', 'touchstart', 'click'].forEach(evt => {
                    uiWrapperElement.addEventListener(evt, (e) => { e.stopPropagation(); }, { passive: false });
                });
                uiWrapperElement.addEventListener('wheel', (e) => {
                    e.stopPropagation();
                    const scrollable = e.target.closest('.overflow-y-auto');
                    if (scrollable) {
                        scrollable.scrollTop += e.deltaY;
                        e.preventDefault();
                    }
                }, { passive: false });
            }

            let is24HourFormat = SafeStorage.get('we_time_format') === '24';
            function toggleTimeFormat() {
                is24HourFormat = !is24HourFormat; SafeStorage.set('we_time_format', is24HourFormat ? '24' : '12'); updateClock(); 
            }
            function updateClock() {
                const now = new Date(); const dd = String(now.getDate()).padStart(2, '0'); const mm = String(now.getMonth() + 1).padStart(2, '0'); const yyyy = now.getFullYear();
                document.getElementById('clockDate').innerText = `${dd}/${mm}/${yyyy}`;
                let rawHours = now.getHours(); let hh, ampm; const ampmEl = document.getElementById('clockAmPm');
                if (is24HourFormat) { hh = String(rawHours).padStart(2, '0'); ampm = ''; ampmEl.style.display = 'none'; } 
                else { hh = String(rawHours % 12 || 12).padStart(2, '0'); ampm = rawHours >= 12 ? 'PM' : 'AM'; ampmEl.style.display = 'inline-block'; ampmEl.innerText = ampm; }
                const m = String(now.getMinutes()).padStart(2, '0'); const s = String(now.getSeconds()).padStart(2, '0');
                document.getElementById('clockTimeDigits').innerText = `${hh}:${m}:${s}`;
                const formatTextEl = document.getElementById('timeFormatText'); if (formatTextEl) formatTextEl.innerText = is24HourFormat ? '24H' : '12H';
            }
            setInterval(updateClock, 1000); updateClock();

            const VoiceManager = {
                currentAudio: null, fadeInterval: null, baseName: "", skinSuffix: "",
                init(baseName, costumeKey) {
                    this.baseName = baseName || "";
                    let suffix = (costumeKey || "").replace(this.baseName, ""); 
                    this.skinSuffix = suffix ? `_${suffix}` : ""; 
                    if (!this.currentAudio) { this.currentAudio = new Audio(); this.currentAudio.setAttribute('playsinline', 'true'); }
                },
                stop(fadeDuration = 0.5) {
                    if (this.fadeInterval) { clearInterval(this.fadeInterval); this.fadeInterval = null; }
                    if (this.currentAudio && !this.currentAudio.paused) {
                        const audio = this.currentAudio; audio.loop = false;
                        this.fadeInterval = setInterval(() => {
                            if (audio.volume > 0.1) audio.volume -= 0.1; 
                            else { audio.pause(); audio.currentTime = 0; audio.volume = window.weVolume || 0.8; clearInterval(this.fadeInterval); }
                        }, (fadeDuration * 1000) / 10);
                    }
                },
                play(folder, filename, onEnded = null, loop = false) {
                    if (this.fadeInterval) { clearInterval(this.fadeInterval); this.fadeInterval = null; }
                    if (!this.currentAudio) { this.currentAudio = new Audio(); this.currentAudio.setAttribute('playsinline', 'true'); }
                    const audio = this.currentAudio;
                    audio.pause(); audio.onended = null;
                    audio.src = `./${folder}/${filename}.mp3`; 
                    audio.volume = window.weVolume || 0.8; 
                    audio.loop = loop; audio.currentTime = 0; audio.load();
                    if (onEnded && !loop) audio.onended = onEnded;
                    const playPromise = audio.play();
                    if (playPromise !== undefined) playPromise.catch(e => { if (onEnded) onEnded(); });
                    return audio;
                },
                playRandom(folder, variants, suffix = "", onEnded = null) {
                    const pick = variants[Math.floor(Math.random() * variants.length)]; return this.play(folder, `${pick}${suffix}`, onEnded);
                },
                playSpawn(onEnded = null) { this.playRandom('spawn', [`Voice_${this.baseName}_Spawn1`, `Voice_${this.baseName}_Spawn2`], "", onEnded); },
                playTickleStart(onEnded = null) { this.play('tickle', `Voice_${this.baseName}_TickleStart1`, onEnded); },
                playTickleDuring() { this.play('tickle', `Voice_${this.baseName}_TickleDuring1`, null, true); },
                playTouch(onEnded = null) { this.playRandom('touch', [`Voice_${this.baseName}_Touch1`, `Voice_${this.baseName}_Touch1_1`, `Voice_${this.baseName}_Touch1_2`], this.skinSuffix, onEnded); },
                playPat(onEnded = null) { this.playRandom('pat', [`Voice_${this.baseName}_Touch2`, `Voice_${this.baseName}_Touch2_1`, `Voice_${this.baseName}_Touch2_2`], this.skinSuffix, onEnded); },
                playSmash(onEnded = null) { this.play('smash', `Voice_${this.baseName}_DutchRubEnd1`, () => { this.play('smash', `Voice_${this.baseName}_DutchRubEnd2${this.skinSuffix}`, onEnded); }); }
            };

            function fixSpineMultiplyHole(player) {
                if (!player || !player.skeleton) return;
                player.skeleton.slots.forEach(slot => {
                    if (slot.data.blendMode === spine.BlendMode.Multiply || slot.data.name.toLowerCase().includes('shadow')) {
                       slot.data.blendMode = spine.BlendMode.Normal; slot.color.a = Math.min(slot.color.a, 0.6);
                    }
                });
            }
            
            function changeLanguage(lang) { SafeStorage.set('user_lang', lang); window.currentLang = lang; location.reload(); }
            function applyTranslations() {
                const langSelect = document.getElementById('langSelect'); if (langSelect) langSelect.value = window.currentLang;
                document.querySelectorAll('[data-i18n]').forEach(el => { el.innerText = getI18n(el.getAttribute('data-i18n')); });
                document.title = getI18n('ui_title');
            }
            function getI18n(key) {

                        player.skeleton.updateWorldTransform();
                    } 
                    lastMouseX = e.clientX; lastMouseY = e.clientY;
                });
            
                canvas.addEventListener('mousemove', (e) => {
                    const rect = canvas.getBoundingClientRect(); const hit = getHitZone(e.clientX - rect.left, e.clientY - rect.top);
                    if (hit) { canvas.style.cursor = 'pointer'; } else { canvas.style.cursor = 'default'; }
                });
            
                const stopDrag = (e) => { 
                    delete pointers[e.pointerId];
                    if (!isDragging) return;
                    isDragging = false; clearTimeout(tickleTimer); VoiceManager.stop(0.5);
            
                    if (!getIsLobby()) return;
                    const animNames = player.skeleton.data.animations.map(a => a.name);
            
                    if (activeInteractBone) {
                        let targetX = initialBoneX, targetY = initialBoneY; let bouncingBone = activeInteractBone; activeInteractBone = null; 
                        let velX = 0, velY = 0; const tension = 0.20, friction = 0.85; 
                        
                        function applyBounce() {
                            let dx = targetX - bouncingBone.x; let dy = targetY - bouncingBone.y;
                            velX += dx * tension; velY += dy * tension; velX *= friction; velY *= friction;
                            bouncingBone.x += velX; bouncingBone.y += velY;
                            if (Math.abs(dx) > 0.1 || Math.abs(velX) > 0.1 || Math.abs(dy) > 0.1 || Math.abs(velY) > 0.1) {
                                requestAnimationFrame(applyBounce);
                            } else { bouncingBone.x = targetX; bouncingBone.y = targetY; }
                        }
                        applyBounce();
                    } 
            
                    if (hasTriggeredRub) {
                        if (hitZoneOnDown && hitZoneOnDown.name === "臉頰" && animNames.includes("Touch_End")) {
                            player.animationState.setAnimation(0, "Touch_End", true); updateUI("Touch_End");
                            VoiceManager.playTouch(() => {
                                voiceRecoveryTimer = setTimeout(() => {
                                    player.animationState.setAnimation(0, "Idle_1", true); updateUI("Idle_1"); safeStartIdle();
                                }, 500);
                            });
                        } else if (hitZoneOnDown && hitZoneOnDown.name === "頭部" && animNames.includes("Pat_End")) {
                            player.animationState.setAnimation(0, "Pat_End", true); updateUI("Pat_End");
                            VoiceManager.playPat(() => {
                                voiceRecoveryTimer = setTimeout(() => {
                                    player.animationState.setAnimation(0, "Idle_1", true); updateUI("Idle_1"); safeStartIdle();
                                }, 500);
                            });
                        } else if (hitZoneOnDown && hitZoneOnDown.name === "身體" && animNames.includes("Tickle_End")) {
                            player.animationState.setAnimation(0, "Tickle_End", false); player.animationState.addAnimation(0, "Idle_1", true, 0); updateUI("Tickle_End"); safeStartIdle();
                        } else {
                            player.animationState.setAnimation(0, "Idle_1", true); updateUI("Idle_1"); safeStartIdle();
                        }
                    } else if (hitZoneOnDown && dragDistance < 10) {
                        if ((hitZoneOnDown.name === "頭部" || hitZoneOnDown.name === "臉頰") && animNames.includes("Smash_End_1")) {
                            player.animationState.setAnimation(0, "Smash_End_1", false);
                            if (animNames.includes("Smash_End_2")) { player.animationState.addAnimation(0, "Smash_End_2", true, 0); }
                            updateUI("Smash_End");
                            VoiceManager.playSmash(() => {
                                voiceRecoveryTimer = setTimeout(() => {
                                    player.animationState.setAnimation(0, "Idle_1", true); updateUI("Idle_1"); safeStartIdle();
                                }, 500);
                            });
                        } else { safeStartIdle(); }
                    } else { safeStartIdle(); }
                };
            
                canvas.addEventListener('pointerup', stopDrag);
                canvas.addEventListener('pointercancel', stopDrag);
                canvas.addEventListener('pointerout', stopDrag);
            }

            window.wallpaperMiniPlayers = [];
            function loadWallpaperMiniSpines(charName, costumeKey, count = 5) {
                const container = document.getElementById('wallpaperMiniContainer'); if (!container) return;

                if (window.wallpaperMiniPlayers && window.wallpaperMiniPlayers.length > 0) {
                    window.wallpaperMiniPlayers.forEach(p => p.dispose()); window.wallpaperMiniPlayers = [];
                }
                container.innerHTML = ''; const skinName = `Mini_${costumeKey}`;

                for (let i = 0; i < count; i++) {
                    let randomX, randomY, isValidPosition = false;
                    while (!isValidPosition) {
                        randomX = Math.floor(Math.random() * 80) + 5; 
                        randomY = Math.floor(Math.random() * 80) + 5; 
                        const inClockArea = (randomX < 35 && randomY > 65);
                        const inMainCharacterArea = (randomX > 45 && randomY > 30);
                        if (!inClockArea && !inMainCharacterArea) { isValidPosition = true; }
                    }
                    const randomAngle = Math.floor(Math.random() * 8) * 45; 
                    const visualScale = ((Math.random() * 0.3 + 0.9) * 0.5).toFixed(2);
                    const wrapperId = `mini-wp-${i}`;
                    
                    const wrapperHtml = `<div id="${wrapperId}" style="position: absolute; left: ${randomX}vw; top: ${randomY}vh; width: 420px; height: 420px; transform: translate(-50%, -50%) rotate(${randomAngle}deg) scale(${visualScale}); transform-origin: center center; opacity: 0.9; z-index: 5; pointer-events: none;"></div>`;
                    container.insertAdjacentHTML('beforeend', wrapperHtml);

                    const miniPlayer = new spine.SpinePlayer(wrapperId, {
                        skelUrl: "./mini/Minimi.skel.bytes", atlasUrl: "./mini/Minimi.atlas.txt",
                        skin: skinName, animation: "Idle", showControls: false, showLoading: false,
                        backgroundColor: "#00000000", alpha: true, premultipliedAlpha: true,
                        viewport: { x: -210, y: -35, width: 420, height: 420 },
                        success: (player) => {
                            if (typeof fixSpineMultiplyHole === 'function') { fixSpineMultiplyHole(player); }
                            const canvas = document.getElementById(wrapperId).querySelector('canvas');
                            if (canvas) {
                                canvas.style.width = '100%'; canvas.style.height = '100%';
                                canvas.style.position = 'relative'; canvas.style.zIndex = '99999';
                            }
                            const anims = player.skeleton.data.animations.map(a => a.name);
                            if (!anims.includes("Idle")) {
                                let targetAnim = anims.includes("idle") ? "idle" : anims[0];
                                if (targetAnim) { player.animationState.setAnimation(0, targetAnim, true); }
                            }
                            player.animationState.timeScale = 0.5 + Math.random() * 0.5;
                            player.play(); window.wallpaperMiniPlayers.push(player);
                        },
                        error: () => {
                            const el = document.getElementById(wrapperId); if (el) el.remove();
                        }
                    });
                }
            }
        </script>
    </body>
