<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>坨坨桌布</title>
        
        <!-- 🌟 修復 1：加回 Tailwind CSS，解決時鐘跑位與排版崩壞問題 -->
        <script src="https://cdn.tailwindcss.com"></script>
        
        <script src="data_config.js"></script>
        <script src="data_core.js"></script>
        <link rel="stylesheet" href="sprites.css">
        <link id="dynamicFavicon" rel="icon" href="./Favicon.png" type="image/png">
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./spine-player.min.css">
        <script src="./spine-player.min.js"></script>
        <script>
            const isDarkMode = localStorage.getItem('theme') === 'dark' || 
                               (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDarkMode) { document.documentElement.classList.add('dark'); }
            window.currentLang = localStorage.getItem('user_lang') || "zh-TW";
        </script>
        <style>
            html, body {
                margin: 0; padding: 0; width: 100vw; height: 100vh;
                overflow: hidden; background: transparent !important;
                font-family: 'Noto Sans TC', sans-serif;
            }
            #uiWrapper {
                position: relative; z-index: 50 !important;
                display: none !important; opacity: 0;
                transition: opacity 0.3s ease-in-out;
                max-width: 800px; margin: 0 auto; padding: 1rem;
            }
            #spineViewerSection {
                margin: 0; padding: 0; border: none; border-radius: 0;
                width: 100vw; height: 100vh; position: absolute; inset: 0;
                box-shadow: none; background: none !important;
                z-index: 10;
            }
            #spineCanvasContainer {
                width: 100vw !important; height: 100vh !important;
                border: none; border-radius: 0; margin: 0;
                background: transparent !important;
            }
            .spine-player-controls { display: none !important; }
            #spineCanvasContainer canvas {
                width: 100% !important; height: 100% !important;
                display: block !important; touch-action: none;
            }
            .desktop-clock-shadow {
                text-shadow: 0 4px 15px rgba(0,0,0,0.6), 0 1px 3px rgba(0,0,0,0.8);
            }
            .spine-player-loading-custom {
                position: absolute; top: 50%; left: 50%;
                width: 80px; height: 80px; margin: -40px 0 0 -40px;
                background: url('./golden_crayon.png') no-repeat center center;
                background-size: contain;
                animation: crayonFloat 1.5s ease-in-out infinite;
                z-index: 10;
            }
            @keyframes crayonFloat {
                0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 5px rgba(251, 191, 36, 0.5)); }
                50% { transform: translateY(-10px) scale(1.05); filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.9)); }
            }
            ::-webkit-scrollbar { width: 6px; height: 6px; }
            ::-webkit-scrollbar-track { background: transparent; }
            ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
            .dark ::-webkit-scrollbar-thumb { background-color: #475569; }
            .collapsible-content { transition: max-height 0.3s ease-out, opacity 0.3s ease-out; overflow: hidden; }
            .collapsed { max-height: 0; opacity: 0; margin-top: 0 !important; overflow: hidden;}
            .custom-select-btn { -webkit-tap-highlight-color: transparent; }
            
            @keyframes dualColorPulse {
                0% { border-color: var(--c1); box-shadow: 0 0 6px var(--c1); }
                50% { border-color: var(--c2); box-shadow: 0 0 6px var(--c2); }
                100% { border-color: var(--c1); box-shadow: 0 0 6px var(--c1); }
            }
            .dual-border-anim { --c1: #c084fc; --c2: #4ade80; animation: dualColorPulse 3s ease-in-out infinite; }
            @keyframes pentaColorPulse {
                0% { border-color: #4ade80; box-shadow: 0 0 6px #4ade80; }
                20% { border-color: #60a5fa; box-shadow: 0 0 6px #60a5fa; }
                40% { border-color: #f87171; box-shadow: 0 0 6px #f87171; }
                60% { border-color: #facc15; box-shadow: 0 0 6px #facc15; }
                80% { border-color: #c084fc; box-shadow: 0 0 6px #c084fc; }
                100% { border-color: #4ade80; box-shadow: 0 0 6px #4ade80; }
            }
            .penta-border-anim { animation: pentaColorPulse 5s ease-in-out infinite; }
        </style>
    </head>
    <body class="text-gray-800 dark:text-gray-200 transition-colors duration-300">
        
        <div id="wallpaperMiniContainer" class="fixed inset-0 pointer-events-none z-[5] overflow-hidden"></div>

        <div id="uiBackdrop" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[40] opacity-0 pointer-events-none transition-opacity duration-300" style="display: none !important;"></div>

        <!-- 🌟 加入雙重防護：保留 Tailwind class 同時加上 style 確保時鐘絕對在右下角 -->
        <div id="desktopClock" class="fixed text-white desktop-clock-shadow pointer-events-none" style="bottom: 15vh; right: 20vw; z-index: 0; display: flex; flex-direction: column; align-items: flex-start;">
            <div id="clockDate" class="text-3xl sm:text-4xl font-black tracking-widest text-amber-300 mb-1">DD/MM/YYYY</div>
            <div id="clockTime" class="text-5xl sm:text-6xl font-black tracking-wider flex items-baseline gap-2">
                <span id="clockTimeDigits">HH:MM:SS</span> 
                <span id="clockAmPm" class="text-2xl sm:text-3xl text-amber-500 font-bold">AM</span>
            </div>
        </div>

        <div id="uiWrapper" class="space-y-4 relative z-50">
            <header class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md p-4 sm:p-5 rounded-2xl shadow-md border-4 border-amber-400 dark:border-slate-600 flex justify-between items-center">
                <div>
                    <h1 class="text-xl sm:text-2xl font-black text-amber-950 dark:text-amber-400 mb-0.5 flex items-center gap-2">
                        <div class="sprite-base sprite-common sprite-Title_Rim scale-[0.6] origin-center shrink-0"></div>
                        <span class="-ml-2">坨坨桌布</span>
                    </h1>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <button onclick="toggleTimeFormat()" class="px-2 py-1.5 sm:px-3 sm:py-2 text-[10px] sm:text-xs bg-slate-600 text-white font-bold rounded-lg shadow hover:bg-slate-700 transition shrink-0">
                    🕒 <span id="timeFormatText">12H</span>
                    </button>
                    <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-amber-100 dark:bg-slate-700 text-amber-900 dark:text-white border border-amber-300 dark:border-slate-500 text-xs sm:text-sm font-bold rounded-lg px-2 py-1.5 outline-none shadow-sm cursor-pointer">
                        <option value="zh-TW">繁中</option>
                        <option value="ja">日本語</option>
                        <option value="en">EN</option>
                    </select>
                </div>
            </header>
            
            <section class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md p-4 sm:p-5 rounded-2xl shadow-md border border-amber-200 dark:border-slate-700 transition-all">
                <div class="flex justify-between items-center mb-3 border-b border-amber-200 dark:border-slate-700 pb-2">
                    <h2 class="text-base sm:text-lg font-bold text-amber-900 dark:text-amber-400" data-i18n="ui_select_char">👥 選擇坨坨</h2>
                    <button id="toggleAllCharBtn" onclick="toggleAllCharacters()" class="px-3 py-1 text-xs font-bold bg-amber-100 dark:bg-slate-700 text-amber-800 dark:text-gray-300 rounded-lg hover:bg-amber-200 transition shadow-sm" data-i18n="ui_show_all">
                    顯示全部 🔽
                    </button>
                </div>
                <div id="charGridContainer" class="space-y-3 collapsible-content collapsed" style="max-height: 0px; opacity: 0;"></div>
            </section>

            <div id="playerControls" class="bg-amber-50/90 dark:bg-slate-700/90 backdrop-blur-md p-4 rounded-xl border-2 border-amber-300 dark:border-slate-500 flex flex-col gap-3 transition-opacity w-full mx-auto shadow-lg">
                <div class="flex items-center justify-between border-b border-amber-200 dark:border-slate-600 pb-3">
                    <div class="flex items-center gap-3">
                        <div id="activeCharIconContainer" class="w-10 h-10 rounded-lg border-2 border-amber-400 shadow-sm overflow-hidden bg-white dark:bg-slate-700 hidden relative items-center justify-center shrink-0"></div>
                        <h2 id="activeCharName" class="text-lg font-black text-amber-900 dark:text-amber-300" data-i18n="ui_please_select">請先選擇坨坨</h2>
                    </div>
                </div>

                <div class="flex items-center justify-between gap-2 flex-wrap">
                    <div class="flex items-center gap-2">
                        <button id="btnPlayPause" onclick="togglePlay()" class="w-9 h-9 flex items-center justify-center bg-amber-500 text-white rounded-lg shadow hover:bg-amber-600 transition" title="播放/暫停">⏸️</button>
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="btnModeSwitch" onclick="toggleViewerMode()" class="px-3 py-1.5 bg-blue-500 hover:bg-blue-600 text-white text-xs font-bold rounded-lg shadow whitespace-nowrap" data-i18n="ui_mode_lobby">🔄 模式: 大廳</button>
                        <select id="costumeSelect" onchange="changeSpineCostume(this.value)" class="bg-white border border-gray-300 text-xs font-bold rounded-lg px-2 py-1.5 outline-none min-w-[100px]">
                            <option value="" data-i18n="ui_costume">服裝</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-between w-full relative z-[100] items-center gap-4">
                    <div class="relative w-full" id="animDropdownWrapper">
                        <button onclick="toggleCustomSelect('animList')" class="custom-select-btn w-full bg-white border border-gray-300 text-xs font-bold rounded-lg px-2 py-1.5 flex justify-between items-center text-left shadow-sm">
                            <span id="animSelectText" class="truncate text-amber-900" data-i18n="ui_select_anim">選擇動作</span>
                            <span class="ml-1 text-gray-400 shrink-0 text-[10px]">▼</span>
                        </button>
                        <div id="animList" class="hidden absolute top-[calc(100%+6px)] left-0 w-full bg-white border border-amber-300 rounded-lg shadow-2xl max-h-[240px] overflow-y-auto flex-col py-1 z-[110]"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 🌟 修復 2：將雙擊事件綁定移到外部區塊，確保隨時可點擊 -->
        <section id="spineViewerSection" ondblclick="handleDesktopDoubleClick(event)">
            <div id="spineCanvasContainer" class="w-full h-full relative overflow-hidden flex items-center justify-center pointer-events-auto"></div>
        </section>

        <script>
            // ==========================================
            // 雙擊開啟 UI 邏輯 (完全解耦，不會再卡住)
            // ==========================================
            function toggleDesktopUI(show) {
                const backdrop = document.getElementById('uiBackdrop');
                const uiWrapper = document.getElementById('uiWrapper');
                
                if (show) {
                    backdrop.style.setProperty('display', 'block', 'important');
                    uiWrapper.style.setProperty('display', 'block', 'important');
                    backdrop.classList.remove('pointer-events-none');
                    
                    requestAnimationFrame(() => {
                        backdrop.style.opacity = '1';
                        uiWrapper.style.opacity = '1';
                    });
                } else {
                    backdrop.style.opacity = '0';
                    uiWrapper.style.opacity = '0';
                    backdrop.classList.add('pointer-events-none');
                    
                    setTimeout(() => {
                        if (backdrop.style.opacity === '0') {
                            backdrop.style.setProperty('display', 'none', 'important');
                            uiWrapper.style.setProperty('display', 'none', 'important');
                        }
                    }, 300);
                }
            }

            function handleDesktopDoubleClick(e) {
                const backdrop = document.getElementById('uiBackdrop');
                if (backdrop.style.opacity === '0' || !backdrop.style.opacity) { 
                    toggleDesktopUI(true); 
                }
            }
            document.getElementById('uiBackdrop').addEventListener('click', () => { toggleDesktopUI(false); });

            // ==========================================
            // 時鐘邏輯
            // ==========================================
            let is24HourFormat = localStorage.getItem('we_time_format') === '24';
            function toggleTimeFormat() {
                is24HourFormat = !is24HourFormat;
                localStorage.setItem('we_time_format', is24HourFormat ? '24' : '12');
                updateClock(); 
            }
            function updateClock() {
                const now = new Date();
                const dd = String(now.getDate()).padStart(2, '0');
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const yyyy = now.getFullYear();
                document.getElementById('clockDate').innerText = `${dd}/${mm}/${yyyy}`;
                
                let rawHours = now.getHours();
                let hh, ampm;
                const ampmEl = document.getElementById('clockAmPm');
                
                if (is24HourFormat) {
                    hh = String(rawHours).padStart(2, '0');
                    ampm = '';
                    ampmEl.style.display = 'none'; 
                } else {
                    hh = String(rawHours % 12 || 12).padStart(2, '0');
                    ampm = rawHours >= 12 ? 'PM' : 'AM';
                    ampmEl.style.display = 'inline-block';
                    ampmEl.innerText = ampm;
                }
                const m = String(now.getMinutes()).padStart(2, '0');
                const s = String(now.getSeconds()).padStart(2, '0');
                document.getElementById('clockTimeDigits').innerText = `${hh}:${m}:${s}`;
                const formatTextEl = document.getElementById('timeFormatText');
                if (formatTextEl) formatTextEl.innerText = is24HourFormat ? '24H' : '12H';
            }
            setInterval(updateClock, 1000); updateClock();

            // ==========================================
            // SPINE 核心與資料初始化
            // ==========================================
            function fixSpineMultiplyHole(player) {
                if (!player || !player.skeleton) return;
                player.skeleton.slots.forEach(slot => {
                    if (slot.data.blendMode === spine.BlendMode.Multiply || slot.data.name.toLowerCase().includes('shadow')) {
                       slot.data.blendMode = spine.BlendMode.Normal;
                       slot.color.a = Math.min(slot.color.a, 0.6);
                    }
                });
            }
            
            function changeLanguage(lang) {
                localStorage.setItem('user_lang', lang);
                window.currentLang = lang; location.reload(); 
            }
            
            function applyTranslations() {
                const langSelect = document.getElementById('langSelect');
                if (langSelect) langSelect.value = window.currentLang;
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    el.innerText = getI18n(key); 
                });
                document.title = getI18n('ui_title');
            }
            
            function getI18n(key) {
                if (!key) return key;
                const safeLang = (typeof LANG_DICT !== 'undefined' && LANG_DICT[window.currentLang]) ? window.currentLang : 'zh-TW';
                if (typeof LANG_DICT !== 'undefined' && LANG_DICT[safeLang] && LANG_DICT[safeLang][key]) return LANG_DICT[safeLang][key];
                return key; 
            }

            const HEX_COLORS = { "天真": "#4ade80", "冷靜": "#60a5fa", "狂亂": "#f87171", "活潑": "#facc15", "憂鬱": "#c084fc" };
            const personalityColors = { 
                "天真": "border-green-400 text-green-400", "冷靜": "border-blue-400 text-blue-400", 
                "狂亂": "border-red-400 text-red-400", "活潑": "border-yellow-400 text-yellow-400", 
                "憂鬱": "border-purple-400 text-purple-400", "雙面": "penta-border-title-anim penta-text-anim",
                "共鳴": "border-rainbow text-rainbow"
            };
            const SPRITE_CLASS_MAP = {
                race_龍族: "sprite-Bg_Dragon", race_精靈: "sprite-Bg_Elf", race_妖精: "sprite-Bg_Sprite",
                race_幽靈: "sprite-Bg_Phantom", race_魔靈: "sprite-Bg_Elemental", race_不明: "sprite-Bg_Unknown",
                race_獸人: "sprite-Bg_Werebeast", race_魔女: "sprite-Bg_Witch", race_unknown: "sprite-Bg_Unknown"
            };
            const CHAR_SPRITE_MAP = {
                "冷靜": "sprite-char-composed", "憂鬱": "sprite-char-depressed",
                "天真": "sprite-char-innocence", "狂亂": "sprite-char-madness", "活潑": "sprite-char-vivacious", "共鳴": "sprite-char-resonance", "雙面": "sprite-char-multifaceted"
            };

            let globalPlayer = null;
            let activeCharData = null; 
            let currentMode = 'lobby'; 
            let currentZoom = 1.0;
            
            function saveCurrentConfig(charObj, costume) {
                if(charObj) {
                    localStorage.setItem('we_char', charObj.name);
                    localStorage.setItem('we_spine', charObj.spineName);
                }
                if(costume) localStorage.setItem('we_costume', costume);
            }

            window.onload = function() { 
                applyTranslations(); initCharacterGrid(); 

                const savedCharName = localStorage.getItem('we_char');
                const savedSpine = localStorage.getItem('we_spine');
                const savedCostume = localStorage.getItem('we_costume');
                
                let charObj = INITIAL_DATA[0];
                let spineName = typeof SPINE_MAP !== 'undefined' ? (SPINE_MAP[charObj.name] || charObj.name) : charObj.name;
                
                if (savedCharName && INITIAL_DATA.find(c => c.name === savedCharName)) {
                    charObj = INITIAL_DATA.find(c => c.name === savedCharName);
                    spineName = savedSpine || (typeof SPINE_MAP !== 'undefined' ? SPINE_MAP[charObj.name] || charObj.name : charObj.name);
                }
                
                window.pendingCostume = savedCostume; 
                selectCharacter(charObj, spineName, ""); 
            };

            document.addEventListener('click', (e) => {
                if (!e.target.closest('#animDropdownWrapper')) {
                    document.getElementById('animList').classList.add('hidden'); document.getElementById('animList').classList.remove('flex');
                }
            });
            
            function toggleCustomSelect(listId) {
                const list = document.getElementById(listId);
                if (list.classList.contains('hidden')) { list.classList.remove('hidden'); list.classList.add('flex'); } 
                else { list.classList.add('hidden'); list.classList.remove('flex'); }
            }
            
            function toggleAllCharacters() {
                const container = document.getElementById('charGridContainer'); const btn = document.getElementById('toggleAllCharBtn');
                if (container.classList.contains('collapsed')) {
                    container.classList.remove('collapsed'); container.style.maxHeight = '2000px'; container.style.opacity = '1'; btn.innerHTML = `${getI18n('ui_hide_all')} 🔼`;
                } else {
                    container.classList.add('collapsed'); container.style.maxHeight = '0px'; container.style.opacity = '0'; btn.innerHTML = `${getI18n('ui_show_all')} 🔽`;
                }
            }
            
            function togglePersonalityGroup(id, btnId) {
                const group = document.getElementById(id); const btn = document.getElementById(btnId);
                if (group.classList.contains('collapsed')) {
                    group.classList.remove('collapsed'); group.style.maxHeight = '1000px'; group.style.opacity = '1'; btn.innerHTML = btn.innerHTML.replace('🔽', '🔼');
                } else {
                    group.classList.add('collapsed'); group.style.maxHeight = '0px'; group.style.opacity = '0'; btn.innerHTML = btn.innerHTML.replace('🔼', '🔽');
                }
            }
            
            function initCharacterGrid() {
                const container = document.getElementById('charGridContainer');
                if (typeof INITIAL_DATA === 'undefined' || !INITIAL_DATA) return;
                const personalities = ["共鳴", "雙面", "天真", "冷靜", "狂亂", "活潑", "憂鬱"];
                
                personalities.forEach((p, index) => {
                    const chars = INITIAL_DATA.filter(c => p === "雙面" ? c.personality.includes(",") : c.personality === p);
                    if (chars.length === 0) return;
                    
                    const borderTextClass = personalityColors[p] || "border-gray-400 text-gray-400";
                    const borderClass = borderTextClass.split(' ')[0]; const textClass = borderTextClass.split(' ')[1] || borderClass;
                    const groupId = `group_${index}`; const btnId = `btn_${index}`;
            
                    const row = document.createElement('div');
                    row.className = "flex flex-col bg-amber-50/50 dark:bg-slate-800/50 p-2 rounded-xl border border-dashed border-amber-200 dark:border-slate-700";
                    
                    const header = document.createElement('div');
                    header.className = "flex justify-between items-center cursor-pointer hover:bg-amber-100/50 dark:hover:bg-slate-700/50 p-1.5 rounded-lg transition";
                    header.onclick = () => togglePersonalityGroup(groupId, btnId);
                    const pSprite = SPRITE_CLASS_MAP[`p_${p}`] || "";
                    
                    header.innerHTML = `
                        <div class="flex items-center gap-1">
                            <div class="sprite-base sprite-common ${pSprite} shrink-0 scale-[0.35] origin-left -ml-2"></div>
                            <h3 class="text-xs sm:text-sm font-black border-l-4 ${borderClass} pl-1 -ml-3"><span class="${textClass}">${getI18n(p)}</span></h3>
                        </div>
                        <span id="${btnId}" class="text-xs text-gray-400">🔼</span>
                    `;
                    
                    const iconContainer = document.createElement('div');
                    iconContainer.id = groupId; iconContainer.className = "flex flex-wrap gap-1.5 pt-2 pl-1 collapsible-content";
                    iconContainer.style.maxHeight = "1000px"; iconContainer.style.opacity = "1";
            
                    chars.forEach(c => {
                        const spineName = typeof SPINE_MAP !== 'undefined' ? SPINE_MAP[c.name] : c.name;
                        const displayName = getI18n(c.name);
                        const btn = document.createElement('button');
                        btn.className = "group flex flex-col items-center gap-0.5 transition-transform hover:scale-110 active:scale-95 w-12 sm:w-14";
                        btn.onclick = () => selectCharacter(c, spineName, "");
            
                        const displayPersonality = c.personality.includes(",") ? "雙面" : c.personality;
                        const charSpriteBase = CHAR_SPRITE_MAP[displayPersonality] || "sprite-char-innocence";
                        const charSpriteClass = `sprite-${spineName}`;
                        let raceKey = c.race === "???" ? "unknown" : c.race;
                        const raceSprite = SPRITE_CLASS_MAP[`race_${raceKey}`] || "sprite-Bg_Unknown";
            
                        let charStyle = ""; let charBorderClass = borderClass; 
                        
                        if (displayPersonality === "雙面") {
                            const parts = c.personality.split(',').map(s => s.trim());
                            const c1 = HEX_COLORS[parts[0]] || "#c084fc"; const c2 = HEX_COLORS[parts[1]] || "#4ade80";
                            charStyle = `style="--c1: ${c1}; --c2:${c2};"`; charBorderClass = "dual-border-anim"; 
                        }

                        btn.innerHTML = `
                            <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl border-2 ${charBorderClass} overflow-hidden shadow-sm group-hover:shadow-md transition-all relative flex items-center justify-center" ${charStyle}>
                                <div class="absolute inset-0 flex items-center justify-center opacity-80"><div class="sprite-base sprite-common ${raceSprite} shrink-0 scale-[0.6]"></div></div>
                                <div class="w-full h-full bg-white/20 dark:bg-black/20 backdrop-blur-[1px] absolute inset-0"></div>
                                <div class="sprite-base ${charSpriteBase} ${charSpriteClass} shrink-0 scale-[0.35] relative z-10"></div>
                            </div>
                            <span class="text-[9px] sm:text-[10px] font-bold text-gray-600 dark:text-gray-300 group-hover:text-amber-600 dark:group-hover:text-amber-400 text-center w-full truncate leading-tight">${displayName}</span>
                        `;
                        iconContainer.appendChild(btn);
                    });
            
                    row.appendChild(header); row.appendChild(iconContainer); container.appendChild(row);
                });
            }
            
            function toggleViewerMode() {
                if (!activeCharData) return;
                currentMode = currentMode === 'lobby' ? 'battle' : 'lobby';
                const btn = document.getElementById('btnModeSwitch');
                btn.innerHTML = currentMode === 'lobby' ? getI18n('ui_mode_lobby') : getI18n('ui_mode_battle');
                btn.className = currentMode === 'lobby' ? "px-3 py-1.5 bg-blue-500 hover:bg-blue-600 text-white text-xs font-bold rounded-lg shadow whitespace-nowrap" : "px-3 py-1.5 bg-red-500 hover:bg-red-600 text-white text-xs font-bold rounded-lg shadow whitespace-nowrap";
                refreshCostumeDropdownAndLoad();
            }

            function selectCharacter(charObj, spineName, iconUrl) {
                activeCharData = { ...charObj, spineName: spineName }; saveCurrentConfig(activeCharData, null);
                let pColors = "border-amber-400 text-amber-900"; const displayPersonality = charObj.personality.includes(",") ? "雙面" : charObj.personality; let customStyle = ""; 

                pColors = personalityColors[displayPersonality] || pColors;
                if (displayPersonality === "雙面") {
                    const parts = charObj.personality.split(',').map(s => s.trim());
                    const c1 = HEX_COLORS[parts[0]] || "#c084fc"; const c2 = HEX_COLORS[parts[1]] || "#4ade80";
                    customStyle = `--c1: ${c1}; --c2: ${c2};`; pColors = "dual-border-anim dual-text-anim"; 
                }
                const borderClass = pColors.split(' ')[0]; const textClass = pColors.split(' ')[1] || "";  
                
                const iconEl = document.getElementById('activeCharIconContainer');
                let raceKey = charObj.race === "???" ? "unknown" : charObj.race; const raceSprite = SPRITE_CLASS_MAP[`race_${raceKey}`] || "sprite-Bg_Unknown";
                const charSpriteBase = CHAR_SPRITE_MAP[displayPersonality] || "sprite-char-innocence"; const charSpriteClass = `sprite-${spineName}`;
                
                iconEl.innerHTML = `
                <div class="absolute inset-0 flex items-center justify-center opacity-80"><div class="sprite-base sprite-common ${raceSprite} shrink-0 scale-[0.45]"></div></div>
                <div class="w-full h-full bg-white/20 dark:bg-black/20 backdrop-blur-[1px] absolute inset-0"></div>
                <div class="sprite-base ${charSpriteBase} ${charSpriteClass} shrink-0 scale-[0.36] relative z-10"></div>
                `;
                
                iconEl.className = `w-10 h-10 rounded-lg border-2 ${borderClass} shadow-sm overflow-hidden bg-white dark:bg-slate-700 flex items-center justify-center shrink-0 relative`;
                iconEl.style.display = 'flex';
                if (customStyle) iconEl.setAttribute("style", customStyle); else iconEl.removeAttribute("style");
                
                const nameEl = document.getElementById('activeCharName');
                nameEl.innerText = getI18n(charObj.name); nameEl.className = `text-lg font-black ${textClass}`;
                if (customStyle) nameEl.setAttribute("style", customStyle); else nameEl.removeAttribute("style");
            
                document.getElementById('animList').classList.add('hidden'); 
                const btnMode = document.getElementById('btnModeSwitch');
                btnMode.style.display = 'inline-block'; btnMode.innerHTML = currentMode === 'lobby' ? getI18n('ui_mode_lobby') : getI18n('ui_mode_battle');
            
                refreshCostumeDropdownAndLoad();
            }
            
            function getCostumeList(charName, mode) {
                if (mode === 'lobby') return (typeof COSTUME_MAP !== 'undefined' && COSTUME_MAP[charName]) ? COSTUME_MAP[charName] : [];
                else return (typeof SD_COSTUME !== 'undefined' && SD_COSTUME[charName]) ? SD_COSTUME[charName] : ((typeof COSTUME_MAP !== 'undefined' && COSTUME_MAP[charName]) ? COSTUME_MAP[charName] : []);
            }

            function refreshCostumeDropdownAndLoad() {
                const costumes = getCostumeList(activeCharData.name, currentMode);
                const fallbackKey = costumes.length > 0 ? costumes[0] : activeCharData.spineName;
                const selectEl = document.getElementById('costumeSelect');
                let currentSelection = window.pendingCostume || selectEl.value; window.pendingCostume = null;

                let targetCostume = costumes.includes(currentSelection) ? currentSelection : fallbackKey;
                selectEl.innerHTML = '';
            
                if (costumes.length > 0) {
                    costumes.forEach((costume, idx) => {
                        const opt = document.createElement('option'); opt.value = costume; 
                        opt.text = idx === 0 ? getI18n('ui_default_costume') : `${getI18n('ui_costume')} ${idx}`;
                        if (costume === targetCostume) opt.selected = true; selectEl.appendChild(opt);
                    });
                    selectEl.style.display = 'inline-block';
                } else selectEl.style.display = 'none';
                
                saveCurrentConfig(null, targetCostume);
                loadSpine(activeCharData.spineName, targetCostume, currentMode);
                loadWallpaperMiniSpines(activeCharData.spineName, targetCostume, 5);
            }

            function changeSpineCostume(costumeKey) {
                if(!costumeKey || !activeCharData) return;
                saveCurrentConfig(null, costumeKey);
                loadSpine(activeCharData.spineName, costumeKey, currentMode);
                loadWallpaperMiniSpines(activeCharData.spineName, costumeKey, 5);
            }
            
            // ==========================================
            // 🌟 修復 3：移除舊版 WebGL 覆寫，讓主 Spine 恢復正常載入
            // ==========================================
            function loadSpine(baseFolderKey, costumeKey, mode) {
               const container = document.getElementById('spineCanvasContainer');
               if (globalPlayer) { globalPlayer.dispose(); globalPlayer = null; }
            
               container.innerHTML = '<div class="spine-player-loading-custom"></div>';
               
               let skelUrl = mode === 'lobby' ? `./spine_assets/${baseFolderKey}/${costumeKey}.skel.bytes` : `./spine_sd_assets/${costumeKey}.skel.bytes`;
               let atlasUrl = mode === 'lobby' ? `./spine_assets/${baseFolderKey}/${costumeKey}.atlas.txt` : `./spine_sd_assets/${costumeKey}.atlas.txt`;
               let targetZoom = mode === 'battle' ? 2.5 : 1.0;
               let baseViewport = mode === 'lobby' ? { x: -400, y: 0, width: 800, height: 1000 } : { x: -750, y: -150, width: 1500, height: 3000 };
               currentZoom = targetZoom;
            
               globalPlayer = new spine.SpinePlayer(container, {
                   skelUrl: skelUrl, atlasUrl: atlasUrl, premultipliedAlpha: true,
                   backgroundColor: "#00000000", alpha: true, showControls: false,
                   showLoading: false, viewport: { ...baseViewport },
                   
                   success: function (player) {
                       const loader = container.querySelector('.spine-player-loading-custom');
                       if (loader) loader.remove();
        
                       player.speed = 1;
                       const skins = player.skeleton.data.skins;
                       if (skins && skins.length > 0) {
                           const tSkin = skins.find(s => s.name === 'Normal') || skins.find(s => s.name !== 'default') || skins[0];
                           if (tSkin) { player.skeleton.setSkinByName(tSkin.name); }
                       }
                       
                       player.skeleton.scaleX = currentZoom; player.skeleton.scaleY = currentZoom;
                       player.skeleton.setToSetupPose(); 
                       fixSpineMultiplyHole(player);
                       player.skeleton.updateWorldTransform();
                       
                       buildAnimationDropdown(player); 
            
                       setTimeout(() => {
                           const anims = player.skeleton.data.animations.map(a => a.name);
                           const fallbackAnim = mode === 'lobby' ? 'Idle_1' : 'Idle';
                           const startAnim = anims.includes(fallbackAnim) ? fallbackAnim : (anims.includes('idle') ? 'idle' : anims[0]);

                           if (startAnim) {
                               player.animationState.setAnimation(0, startAnim, true);
                               document.getElementById('animSelectText').innerText = startAnim;
                               document.getElementById('btnPlayPause').innerText = '⏸️';
                           }
                           player.play();
                           applyDefaultCamera();
                       }, 50);
                   },
                   error: function () {
                       container.innerHTML = `<div class="text-red-500 font-bold text-sm text-center p-4">載入失敗：檔案不存在或路徑錯誤</div>`;
                   }
               });
            }

            function togglePlay() {
                if (!globalPlayer) return;
                if (globalPlayer.paused) { globalPlayer.play(); document.getElementById('btnPlayPause').innerText = '⏸️'; } 
                else { globalPlayer.pause(); document.getElementById('btnPlayPause').innerText = '▶️'; }
            }
            
            function buildAnimationDropdown(player) {
                const animList = document.getElementById('animList'); animList.innerHTML = '';
                const anims = player.skeleton.data.animations.map(a => a.name).sort();
                anims.forEach(animName => {
                    const btn = document.createElement('button');
                    btn.className = "text-left px-3 py-2 text-xs hover:bg-amber-100 w-full truncate transition-colors text-gray-700 flex-shrink-0 border-b border-gray-50";
                    btn.innerText = animName;
                    btn.onclick = (e) => {
                        e.stopPropagation(); player.animationState.setAnimation(0, animName, true);
                        document.getElementById('animSelectText').innerText = animName;
                        animList.classList.add('hidden'); animList.classList.remove('flex');
                        player.play(); document.getElementById('btnPlayPause').innerText = '⏸️';
                        player.skeleton.updateWorldTransform();
                    };
                    animList.appendChild(btn);
                });
            }
            
            function applyDefaultCamera() {
                if (!globalPlayer || !globalPlayer.skeleton) return;
                currentZoom = currentMode === 'battle' ? 2.5 : 1.0;
                globalPlayer.skeleton.scaleX = currentZoom; globalPlayer.skeleton.scaleY = currentZoom;
                
                globalPlayer.skeleton.x = currentMode === 'battle' ? 500 : 250; 
                globalPlayer.skeleton.y = currentMode === 'lobby' ? 600 * (1 - currentZoom) : 0;
                globalPlayer.skeleton.updateWorldTransform();
            }
            window.addEventListener('resize', applyDefaultCamera);

            // ==========================================
            // 超迷你小人背景生成
            // ==========================================
            window.wallpaperMiniPlayers = [];
            function loadWallpaperMiniSpines(charName, costumeKey, count = 5) {
                const container = document.getElementById('wallpaperMiniContainer'); if (!container) return;

                if (window.wallpaperMiniPlayers && window.wallpaperMiniPlayers.length > 0) {
                    window.wallpaperMiniPlayers.forEach(p => p.dispose()); window.wallpaperMiniPlayers = [];
                }
                container.innerHTML = ''; const skinName = `Mini_${costumeKey}`;

                for (let i = 0; i < count; i++) {
                    let randomX, randomY, isRightBottom = true;
                    while (isRightBottom) {
                        randomX = Math.floor(Math.random() * 90) + 3; randomY = Math.floor(Math.random() * 85) + 5; 
                        if (!(randomX > 60 && randomY > 50)) { isRightBottom = false; }
                    }
                    const randomAngle = Math.floor(Math.random() * 8) * 45; const randomScale = (Math.random() * 0.3 + 0.9).toFixed(2);
                    const wrapperId = `mini-wp-${i}`;
                    
                    const wrapperHtml = `
                        <div id="${wrapperId}" style="position: absolute; left: ${randomX}vw; top: ${randomY}vh; width: 150px; height: 150px; transform: rotate(${randomAngle}deg) scale(${randomScale}); opacity: 0.85; z-index: 5; pointer-events: none;"></div>
                    `;
                    container.insertAdjacentHTML('beforeend', wrapperHtml);

                    const miniPlayer = new spine.SpinePlayer(wrapperId, {
                        skelUrl: "./mini/Minimi.skel.bytes", atlasUrl: "./mini/Minimi.atlas.txt",
                        skin: skinName, animation: "Idle", showControls: false, showLoading: false,
                        backgroundColor: "#00000000", alpha: true, premultipliedAlpha: true,
                        viewport: { x: -250, y: 0, width: 500, height: 500 },
                        success: (player) => {
                            if (typeof fixSpineMultiplyHole === 'function') { fixSpineMultiplyHole(player); }
                            const canvas = document.getElementById(wrapperId).querySelector('canvas');
                            if (canvas) {
                                canvas.style.width = '100%'; canvas.style.height = '100%';
                                canvas.style.position = 'relative'; canvas.style.zIndex = '99999';
                            }
                            const anims = player.skeleton.data.animations.map(a => a.name);
                            if (!anims.includes("Idle")) {
                                let targetAnim = anims.includes("idle") ? "idle" : anims[0];
                                if (targetAnim) { player.animationState.setAnimation(0, targetAnim, true); }
                            }
                            player.animationState.timeScale = 0.5 + Math.random() * 0.5;
                            player.play(); window.wallpaperMiniPlayers.push(player);
                        },
                        error: () => {
                            const el = document.getElementById(wrapperId); if (el) el.remove();
                        }
                    });
                }
            }
        </script>
    </body>
</html>
