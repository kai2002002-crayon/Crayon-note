<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD 戰鬥小人 - 基礎測試版</title>
    
    <script src="data_core.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-player@4.1.23/dist/spine-player.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-player@4.1.23/dist/iife/spine-player.min.js"></script>

    <style>
        body { font-family: sans-serif; }
        
        /* 🐛 終極防禦：確保 Canvas 絕對不會被壓縮成 0x0 */
        #spineContainer canvas {
            width: 100% !important;
            height: 100% !important;
            display: block !important;
        }

        /* 讓 Spine 控制器在亮色背景下也能看清楚 */
        .spine-player-controls {
            background-color: rgba(0, 0, 0, 0.7) !important;
        }
    </style>
</head>
<body class="bg-slate-100 p-4 sm:p-8 min-h-screen">

    <div class="max-w-5xl mx-auto space-y-6">
        
        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-amber-500">
            <h1 class="text-xl font-bold text-gray-800">SD 戰鬥小人 - 基礎測試版</h1>
            <p class="text-sm text-gray-500 mt-1">只保留最基礎的 Block 排版與控制器，確保 Spine 畫布能成功渲染。</p>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-md font-bold text-gray-700 mb-4">1. 選擇角色</h2>
            <div id="charButtons" class="flex flex-wrap gap-2 max-h-48 overflow-y-auto p-2 border bg-gray-50 rounded-lg">
                <span class="text-sm text-gray-400">載入角色清單中...</span>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <div class="flex justify-between items-end mb-4">
                <h2 class="text-md font-bold text-gray-700">2. 戰鬥動態圖預覽</h2>
                <span id="currentCharName" class="text-amber-600 font-black text-lg">尚未選擇</span>
            </div>

            <div id="spineContainer" class="w-full h-[600px] bg-slate-800 rounded-lg overflow-hidden block relative shadow-inner">
                <div class="absolute inset-0 flex items-center justify-center text-gray-500 font-bold pointer-events-none">
                    請從上方選擇角色
                </div>
            </div>
        </div>

    </div>

    <script>
        let globalPlayer = null;

        // 初始化頁面：生成按鈕
        window.onload = function() {
            const btnContainer = document.getElementById('charButtons');
            if (typeof INITIAL_DATA === 'undefined' || INITIAL_DATA.length === 0) {
                btnContainer.innerHTML = '<span class="text-red-500">找不到 INITIAL_DATA，請確認 data_core.js 是否正確載入。</span>';
                return;
            }

            btnContainer.innerHTML = '';
            INITIAL_DATA.forEach(char => {
                const btn = document.createElement('button');
                btn.innerText = char.name;
                btn.className = "px-3 py-1.5 bg-white border border-gray-300 text-gray-700 text-sm font-bold rounded shadow-sm hover:bg-amber-100 hover:border-amber-400 hover:text-amber-700 transition-colors";
                btn.onclick = () => loadSpine(char.name);
                btnContainer.appendChild(btn);
            });
        };

        // 載入 Spine 核心函數 (完全參照 SkillSpinePlayer 的成功邏輯)
        function loadSpine(charName) {
            document.getElementById('currentCharName').innerText = charName;
            const container = document.getElementById('spineContainer');
            
            // 清理舊的播放器
            if (globalPlayer) {
                globalPlayer.dispose();
                globalPlayer = null;
            }
            container.innerHTML = '';

            // 取得資料夾名稱
            const baseFolderKey = typeof SPINE_MAP !== 'undefined' && SPINE_MAP[charName] ? SPINE_MAP[charName] : charName;
            const skelUrl = `./spine_sd_assets/${baseFolderKey}.skel.bytes`;
            const atlasUrl = `./spine_sd_assets/${baseFolderKey}.atlas.txt`;

            console.log(`[載入測試] 準備載入 ${charName} 的 SD 檔案:`, skelUrl);

            // 🚀 啟動 Player
            globalPlayer = new spine.SpinePlayer(container, {
                skelUrl: skelUrl,
                atlasUrl: atlasUrl,
                
                animation: "Idle",        // 預設播 Idle
                skin: "Normal",           // 預設皮膚 Normal
                premultipliedAlpha: false, // ⚠️ SD 檔案的救命關鍵：關閉 PMA
                backgroundColor: "#00000000",
                alpha: true,
                showControls: true,       // ⚠️ 開啟原生控制器，讓您可以選動作
                showLoading: true,
                
                // 採用 char_detail.html 中成功的 viewport 比例 (稍微縮小一點適應 600px 高度)
                viewport: { x: -500, y: -150, width: 1500, height: 3000 },

                success: function (player) {
                    console.log(`✅ [成功] ${charName} Spine 載入完成！`);
                    
                    // 🐛 暴力確保 Canvas 撐滿容器
                    const canvas = container.querySelector('canvas');
                    if (canvas) {
                        canvas.style.width = '100%';
                        canvas.style.height = '100%';
                        canvas.style.display = 'block';
                    }

                    // 嘗試設置 Skin，避免部分角色預設是透明的
                    const skins = player.skeleton.data.skins;
                    if (skins && skins.length > 0) {
                        // 找 Normal，沒有就找 default，再沒有就拿第一個
                        const targetSkin = skins.find(s => s.name === 'Normal') || skins.find(s => s.name === 'default') || skins[0];
                        if (targetSkin) {
                            player.skeleton.setSkinByName(targetSkin.name);
                            player.skeleton.setSlotsToSetupPose(); 
                        }
                    }

                    // 檢查動作庫，沒有 Idle 就隨便播第一個
                    const anims = player.skeleton.data.animations.map(a => a.name);
                    if (!anims.includes("Idle") && !anims.includes("idle")) {
                        if (anims.length > 0) {
                            player.animationState.setAnimation(0, anims[0], true);
                            console.log(`找不到 Idle，改播: ${anims[0]}`);
                        }
                    }
                },
                error: function (player, reason) {
                    console.error(`❌ [失敗] ${charName} Spine 載入錯誤:`, reason);
                    container.innerHTML = `
                        <div class="w-full h-full flex flex-col items-center justify-center text-red-500 bg-red-50 font-bold p-4 text-center">
                            <span class="text-4xl mb-2">⚠️</span>
                            載入失敗！請按 F12 查看 Console 確認路徑或檔案是否正確。<br>
                            檔案路徑: ${skelUrl}
                        </div>
                    `;
                }
            });
        }
    </script>
</body>
</html>
