            :root { --user-bg-image: url('https://i.postimg.cc/fTJ36ZFT/CG-Schedule-Rim.png'); }
            body { 
            font-family: 'Noto Sans TC', sans-serif; background-color: #fcf8f2;

            body::before {
            content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0;

            background-position: center; background-repeat: no-repeat;

            content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0;

            .table-glow-container {
            position: absolute;

            /* 🌟 3星彩色發光調整 */

    <body class="p-3 sm:p-6 md:p-8 text-gray-800 dark:text-gray-100">

                    <div class="absolute left-3 flex items-center justify-center pointer-events-none">

                    <div class="absolute left-3 flex items-center justify-center pointer-events-none">

            <div class="relative w-full max-w-4xl mx-auto mb-6 aspect-video bg-white/90 dark:bg-gray-800/90 rounded-2xl shadow-xl border-4 border-amber-300 dark:border-gray-600 overflow-hidden">
                <section id="gachaStage" class="absolute inset-0 w-full h-full bg-black transition-opacity duration-500 z-10 opacity-0 pointer-events-none">
                    <div id="gachaSpineContainerErpin" class="absolute inset-0 w-full h-full z-10 cursor-pointer"></div>
                    <div id="gachaSpineContainerCloseup" class="absolute inset-0 w-full h-full z-20 pointer-events-none" style="display: none; opacity: 0;"></div>
                    <div id="closeupTableGlow" class="table-glow-container z-[25]"></div>
                    <div id="gachaSpineContainerDocs" class="absolute inset-0 w-full h-full z-30 pointer-events-none"></div>
                </section>
                <section id="resultArea" class="absolute inset-0 w-full h-full bg-gradient-to-b from-white/95 to-amber-50/95 dark:from-gray-800/95 dark:to-gray-900/95 backdrop-blur-md p-2 sm:p-6 flex flex-col items-center justify-start overflow-y-auto transition-opacity duration-500 z-20">
                    <div class="h-full w-full flex items-center justify-center min-h-[250px]">

            </div>
            <section class="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md rounded-2xl p-4 shadow border-2 border-gray-200/80 dark:border-gray-700">
                <h3 class="text-sm font-bold text-gray-500 dark:text-gray-400 mb-4 border-b border-gray-200 dark:border-gray-700 pb-2">📜 招募紀錄</h3>
                <div id="historyArea" class="space-y-4 max-h-[500px] overflow-y-auto pr-2"></div>
            </section>
        </div>
        <script>
            // ==========================
            // 系統與 Firebase 初始化
            // ==========================
            const firebaseConfig = { apiKey: "AIzaSyDhv8D2pY_0M56UJrDTQw0RGPHA-BkXU8Y", authDomain: "crayon-note.firebaseapp.com", projectId: "crayon-note", storageBucket: "crayon-note.firebasestorage.app", messagingSenderId: "210614088940", appId: "1:210614088940:web:7addbdc7c466eeb05421c9", measurementId: "G-M1EJPE12TE" };
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();
            const auth = firebase.auth();
            let currentUser = null;
            auth.onAuthStateChanged(user => { currentUser = user; if (user) { loadHistoryFromCloud(); } });
            
            function saveHistoryToCloud(record) {
                if (!currentUser) return;
                db.collection("gacha_history").doc(currentUser.uid).update({ logs: firebase.firestore.FieldValue.arrayUnion(record) })
                .catch(() => { db.collection("gacha_history").doc(currentUser.uid).set({ logs: [record] }); });
            }
            
            function loadHistoryFromCloud() {
                if (!currentUser) return;
                db.collection("gacha_history").doc(currentUser.uid).get().then(doc => { 
                    if (doc.exists && doc.data().logs) { renderHistory(doc.data().logs); } 
                }).catch(err => console.error("讀取歷史紀錄失敗:", err));
            }
            
            // ==========================
            // 角色與UI初始化
            // ==========================
            let currentPool = { type: 'normal', rateUpChars: [], personality: null, name: '普通招募' };
            const personalities = ["天真", "冷靜", "狂亂", "活潑", "憂鬱"];
            const validChars = INITIAL_DATA.filter(c => !c.releaseDate || new Date(c.releaseDate).getTime() < Date.now()).map(c => {
                let starNum = 1; if (typeof GRADE_MAP !== 'undefined' && GRADE_MAP[c.name]) { const parsedStar = parseInt(GRADE_MAP[c.name]); if (!isNaN(parsedStar)) starNum = parsedStar; }
                let isEldainChar = false; if (typeof ELDAIN_LIST !== 'undefined') { isEldainChar = ELDAIN_LIST.includes(c.name) || (c.name === '羽伊' && ELDAIN_LIST.includes('羽依')); }
                return { ...c, star: starNum, isEldain: isEldainChar };
            });
            
            function initUI() {
                const poolBtnContainer = document.getElementById('poolButtons'); const pBtnContainer = document.getElementById('personalityButtons');
                poolBtnContainer.innerHTML = ''; pBtnContainer.innerHTML = '';
                let currentRateUps = [];
                if (typeof PICKUP_SCHEDULE !== 'undefined') {
                    const now = new Date().getTime();
                    PICKUP_SCHEDULE.forEach(s => { if (now >= new Date(s.start).getTime() && now <= new Date(s.end).getTime()) { currentRateUps.push(...s.chars); } });
                    currentRateUps = [...new Set(currentRateUps)];
                }
                let firstBtn = null;
                currentRateUps.forEach(charName => {
                    const btn = document.createElement('button'); btn.className = 'pool-btn px-3 py-1.5 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 font-bold text-sm text-gray-700 dark:text-gray-200';
                    btn.innerText = `🎯 特選招募 - ${charName}`; btn.onclick = () => setPool('rateup', [charName], null, btn.innerText, btn);
                    poolBtnContainer.appendChild(btn); if (!firstBtn) firstBtn = { btn, type: 'rateup', args: [[charName], null, btn.innerText] };
                });
                const normalBtn = document.createElement('button'); normalBtn.className = 'pool-btn px-3 py-1.5 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 font-bold text-sm text-gray-700 dark:text-gray-200';
                normalBtn.innerText = `🌟 普通招募`; normalBtn.onclick = () => setPool('normal', [], null, normalBtn.innerText, normalBtn);
                poolBtnContainer.appendChild(normalBtn); if (!firstBtn) firstBtn = { btn: normalBtn, type: 'normal', args: [[], null, normalBtn.innerText] };
                
                const pPoolBtn = document.createElement('button'); pPoolBtn.className = 'pool-btn px-3 py-1.5 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 font-bold text-sm text-gray-700 dark:text-gray-200';
                pPoolBtn.innerText = `🔮 性格選擇招募`;
                pPoolBtn.onclick = () => { document.getElementById('personalitySubMenu').classList.remove('hidden'); setPool('personality', [], personalities[0], `🔮 性格選擇招募 - ${personalities[0]}`, pPoolBtn); updatePersonalityBtns(personalities[0]); };
                poolBtnContainer.appendChild(pPoolBtn);
                personalities.forEach(p => {
                    const btn = document.createElement('button'); btn.className = 'p-sub-btn px-2 py-1 rounded border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-800 text-xs font-bold';
                    btn.innerText = p; btn.onclick = () => { setPool('personality', [], p, `🔮 性格選擇招募 - ${p}`, pPoolBtn); updatePersonalityBtns(p); };
                    pBtnContainer.appendChild(btn);
                });
                if (firstBtn) { setPool(firstBtn.type, firstBtn.args[0], firstBtn.args[1], firstBtn.args[2], firstBtn.btn); }
            }
            
            function setPool(type, rateUpChars, personality, poolName, activeElement) {
                currentPool = { type, rateUpChars, personality, name: poolName };
                document.querySelectorAll('.pool-btn').forEach(b => b.classList.remove('active')); if (activeElement) activeElement.classList.add('active');
                if (type !== 'personality') document.getElementById('personalitySubMenu').classList.add('hidden');
                const icon1 = document.getElementById('iconGacha1'); const icon10 = document.getElementById('iconGacha10');
                if (icon1 && icon10) {
                    if (type === 'personality') { icon1.className = "sprite-base sprite-common sprite-Icon_GachaPersonality scale-[0.4] origin-center"; icon10.className = "sprite-base sprite-common sprite-Icon_GachaPersonality_10 scale-[0.4] origin-center"; } 
                    else { icon1.className = "sprite-base sprite-common sprite-Icon_GachaTicketHero scale-[0.4] origin-center"; icon10.className = "sprite-base sprite-common sprite-Icon_GachaTicketHero_10 scale-[0.4] origin-center"; }
                }
            }
            
            function updatePersonalityBtns(selectedP) {
                document.querySelectorAll('.p-sub-btn').forEach(b => {
                    if(b.innerText === selectedP) { b.classList.add('bg-purple-500', 'text-white', 'border-purple-600'); b.classList.remove('bg-gray-50', 'text-black', 'dark:bg-gray-800'); } 
                    else { b.classList.remove('bg-purple-500', 'text-white', 'border-purple-600'); b.classList.add('bg-gray-50', 'text-black', 'dark:bg-gray-800'); }
                });
            }
            
            // ==========================
            // 機率運算
            // ==========================
            function getGachaPool(isGuaranteed) {
                let p1 = isGuaranteed ? 0 : 0.76; let p2 = isGuaranteed ? 0.97 : 0.21; let p3 = 0.03; let eldainBase = 0.00036;
                let availableChars = validChars; 
                if (currentPool.type === 'personality') availableChars = validChars.filter(c => c.personality === currentPool.personality);
                let stars1 = availableChars.filter(c => c.star === 1); let stars2 = availableChars.filter(c => c.star === 2); let stars3 = availableChars.filter(c => c.star === 3);
                let weightedPool = [];
                
                if (stars1.length > 0) { let w = p1 / stars1.length; stars1.forEach(c => weightedPool.push({ char: c, weight: w, isRateUp: false })); }
                if (stars2.length > 0) { let w = p2 / stars2.length; stars2.forEach(c => weightedPool.push({ char: c, weight: w, isRateUp: false })); }
                if (stars3.length > 0) {
                    let allEldains = stars3.filter(c => c.isEldain); let normal3s = stars3.filter(c => !c.isEldain);
                    if (currentPool.type === 'personality') {
                        let eldainTotalWeight = 0; 
                        if (allEldains.length > 0) { 
                            eldainTotalWeight = 0.00032; let w = eldainTotalWeight / allEldains.length; 
                            allEldains.forEach(c => weightedPool.push({ char: c, weight: w, isRateUp: false })); 
                        }
                        let remaining3Prob = p3 - eldainTotalWeight; 
                        if (normal3s.length > 0) { let w = remaining3Prob / normal3s.length; normal3s.forEach(c => weightedPool.push({ char: c, weight: w, isRateUp: false })); }
                    } else {
                        let rateUpEldains = allEldains.filter(c => currentPool.rateUpChars.includes(c.name)); 
                        let rateUpNormals = normal3s.filter(c => currentPool.rateUpChars.includes(c.name));
                        if (rateUpEldains.length > 0) { 
                            let totalEldainProb = allEldains.length * eldainBase; let targetWeight = (totalEldainProb * 2) / rateUpEldains.length; 
                            rateUpEldains.forEach(c => weightedPool.push({ char: c, weight: targetWeight, isRateUp: true })); 
                        } else { allEldains.forEach(c => weightedPool.push({ char: c, weight: eldainBase, isRateUp: false })); }
                        
                        let currentTotal3Weight = weightedPool.filter(p => p.char.star === 3).reduce((sum, p) => sum + p.weight, 0); 
                        let remaining3Prob = p3 - currentTotal3Weight;
                        
                        if (normal3s.length > 0) {
                            if (rateUpNormals.length > 0) {
                                let targetRateUpWeight = 0.008; // 修正特選為精準 0.8%
                                let totalRateUpWeight = targetRateUpWeight * rateUpNormals.length;
                                let otherNormalWeight = Math.max(0, (remaining3Prob - totalRateUpWeight) / (normal3s.length - rateUpNormals.length));
                                normal3s.forEach(c => { 
                                    if (currentPool.rateUpChars.includes(c.name)) { weightedPool.push({ char: c, weight: targetRateUpWeight, isRateUp: true }); } 
                                    else { weightedPool.push({ char: c, weight: otherNormalWeight, isRateUp: false }); } 
                                });
                            } else { 
                                let w = remaining3Prob / normal3s.length; normal3s.forEach(c => weightedPool.push({ char: c, weight: w, isRateUp: false })); 
                            }
                        }
                    }
                }
                return weightedPool;
            }
            
            function pullOne(isGuaranteed) { const pool = getGachaPool(isGuaranteed); const rand = Math.random(); let accum = 0; for (let i = 0; i < pool.length; i++) { accum += pool[i].weight; if (rand <= accum) return pool[i]; } return pool[pool.length - 1]; }
            
            let pendingGachaTimes = 0; let pendingGachaResults = []; let has3Star = false; let has2Star = false; let hasRateUp = false; let isGachaRunning = false;
            
            function performGacha(times) {
                if (isGachaRunning) return; isGachaRunning = true; document.querySelectorAll('.btn-gacha').forEach(btn => { btn.classList.add('opacity-50', 'cursor-not-allowed'); });
                pendingGachaTimes = times; pendingGachaResults = []; has3Star = false; has2Star = false; hasRateUp = false;
                for (let i = 0; i < times; i++) {
                    let isGuaranteed = (times === 10 && i === 9); let result = pullOne(isGuaranteed); pendingGachaResults.push(result);
                    if (result.char.star === 3) has3Star = true; if (result.char.star === 2) has2Star = true; if (result.isRateUp) hasRateUp = true;
                }
                startGachaAnimation();
            }
            
            // ==========================
            // UI 生成區 (整合舊歷史與新排版)
            // ==========================
            function getGachaCharIconHTML(charData, isLarge = false, isRateUp = false) {
                const personalityBorderColors = { "天真": "border-green-500", "冷靜": "border-blue-500", "狂亂": "border-red-500", "活潑": "border-yellow-400", "憂鬱": "border-purple-500" };
                const personalityHexMap = { "天真": "#22c55e", "冷靜": "#3b82f6", "狂亂": "#ef4444", "活潑": "#facc15", "憂鬱": "#a855f7" };
                const bgClassMap = { "龍族": "sprite-Bg_Dragon", "精靈": "sprite-Bg_Elf", "妖精": "sprite-Bg_Sprite", "獸人": "sprite-Bg_Werebeast", "幽靈": "sprite-Bg_Phantom", "???": "sprite-Bg_Unknown", "unknown": "sprite-Bg_Unknown", "魔靈": "sprite-Bg_Elemental", "魔女": "sprite-Bg_Witch" };
                const charSpriteBaseMap = { "冷靜": "sprite-char-composed", "憂鬱": "sprite-char-depressed", "天真": "sprite-char-innocence", "狂亂": "sprite-char-madness", "活潑": "sprite-char-vivacious" };
                
                const borderColor = personalityBorderColors[charData.personality] || "border-gray-300"; 
                const pColorHex = personalityHexMap[charData.personality] || "rgba(255,255,255,0.5)"; 
                const raceKey = (charData.race === "???" || !charData.race) ? "unknown" : charData.race; 
                const bgSprite = bgClassMap[raceKey] || "sprite-Bg_Unknown";
                const spineName = typeof SPINE_MAP !== 'undefined' && SPINE_MAP[charData.name] ? SPINE_MAP[charData.name] : charData.name; 
                const charSpriteBase = charSpriteBaseMap[charData.personality] || ""; 
                const charSpriteClass = `sprite-${spineName}`;
                
                const sizeClass = isLarge ? "w-[58px] h-[58px] sm:w-[76px] sm:h-[76px]" : "w-10 h-10"; 
                const bgScaleClass = isLarge ? "scale-[0.52] sm:scale-[0.6]" : "scale-[0.45]"; 
                const charScaleClass = isLarge ? "scale-[0.45] sm:scale-[0.55]" : "scale-[0.35]";
                
                const innerHTML = `
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 sprite-base sprite-common ${bgSprite} ${bgScaleClass} z-0 opacity-90"></div>
                    <div class="absolute inset-0 bg-white/20 dark:bg-black/20 backdrop-blur-[1px] z-[5]"></div>
                    <div class="absolute inset-0 flex items-center justify-center z-10"><div class="sprite-base ${charSpriteBase} ${charSpriteClass} shrink-0 ${charScaleClass} origin-center"></div></div>
                `;

                if (isLarge && isRateUp) {
                    return `
                        <div class="${sizeClass} rounded-lg relative shrink-0 p-[3px] z-10" style="box-shadow: 0 0 15px ${pColorHex};">
                            <div class="absolute inset-0 rounded-lg z-0" style="background: linear-gradient(45deg, #ff0000, #ff7300, #ffeb00, #47e247, #00bbff, #0055ff, #8800ff, #ff0000); background-size: 400%; animation: rainbowMove 3s linear infinite;"></div>
                            <div class="absolute inset-[3px] rounded-[5px] overflow-hidden bg-[#fcf8f2] dark:bg-gray-800 z-10">
                                ${innerHTML}
                            </div>
                        </div>`;
                } else {
                    return `
                        <div class="${sizeClass} rounded-lg border-2 ${borderColor} shadow-inner bg-[#fcf8f2] dark:bg-gray-800 relative overflow-hidden shrink-0">
                            ${innerHTML}
                        </div>`;
                }
            }
            
            function showRealGachaResults() {
