<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終極角色資料管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="data_config.js"></script>
    <script src="data_core.js"></script>
    <script src="data_skills.js"></script>
    <script src="data_aside.js"></script>
    <script src="data_intro.js"></script>
    <script src="data_collectibles.js"></script>
    
    <!-- Firebase SDK -->
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    // 🌟 新增 getDocs 與 collection 來抓取整個資料表
    import { getFirestore, doc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyDhv8D2pY_0M56UJrDTQw0RGPHA-BkXU8Y", 
        authDomain: "crayon-note.firebaseapp.com", 
        projectId: "crayon-note", 
        storageBucket: "crayon-note.firebasestorage.app", 
        messagingSenderId: "210614088940", 
        appId: "1:210614088940:web:7addbdc7c466eeb05421c9", 
        measurementId: "G-M1EJPE12TE" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    window.db = db;
    window.setDoc = setDoc;
    window.doc = doc;
    window.collection = collection;
    window.getDocs = getDocs;

    // ⚠️ 務必改成你自己的真實 Email 
    const ADMIN_EMAILS = [
        "kai2002002@gmail.com" 
    ];

    onAuthStateChanged(auth, (user) => {
        const overlay = document.getElementById('loginOverlay');
        if (user) {
            if (ADMIN_EMAILS.length === 0 || ADMIN_EMAILS.includes(user.email)) {
                console.log("✅ 管理員驗證成功：", user.email);
                overlay.classList.add('hidden');
                
                // 🌟 登入成功後，立刻從 Firestore 抓取雲端角色清單！
                if(typeof window.fetchFirestoreData === 'function') {
                    window.fetchFirestoreData();
                }
            } else {
                alert(`❌ 帳號 ${user.email} 沒有管理員權限！`);
                signOut(auth);
            }
        } else {
            console.log("🔒 尚未登入");
            overlay.classList.remove('hidden');
        }
    });

    window.addEventListener('DOMContentLoaded', () => {
        const loginBtn = document.getElementById('googleLoginBtn');
        if (loginBtn) {
            loginBtn.addEventListener('click', () => {
                const provider = new GoogleAuthProvider();
                signInWithPopup(auth, provider).catch((error) => {
                    console.error("登入失敗:", error);
                    alert("登入失敗：" + error.message);
                });
            });
        }
    });
    </script>
    
    <script>
        tailwind.config = { darkMode: 'class' };
        
        if(typeof LANG_DICT === 'undefined') window.LANG_DICT = { "zh-TW": {}, "ja": {}, "en": {} };
        if(typeof INITIAL_DATA === 'undefined') window.INITIAL_DATA = [];
        if(typeof CV_MAP === 'undefined') window.CV_MAP = {};
        if(typeof GRADE_MAP === 'undefined') window.GRADE_MAP = {};
        if(typeof ELDAIN_LIST === 'undefined') window.ELDAIN_LIST = [];
        if(typeof FOOD_MAP === 'undefined') window.FOOD_MAP = {};
        if(typeof REWARD_MAP === 'undefined') window.REWARD_MAP = {};
        if(typeof WORK_URL === 'undefined') window.WORK_URL = {};
        if(typeof SPINE_MAP === 'undefined') window.SPINE_MAP = {};
        if(typeof COSTUME_MAP === 'undefined') window.COSTUME_MAP = {};
        if(typeof SD_COSTUME === 'undefined') window.SD_COSTUME = {};
        if(typeof MINI_SPINE === 'undefined') window.MINI_SPINE = {};
        
        if(typeof ASIDE_DATA === 'undefined') window.ASIDE_DATA = {};
        if(typeof characterSkills === 'undefined') window.characterSkills = []; 
        
        if(typeof INTRO_MAP === 'undefined') window.INTRO_MAP = { "zh-TW": {}, "ja": {}, "en": {} };
        if(typeof PRESENT_MAP === 'undefined') window.PRESENT_MAP = {};
        if(typeof THOUGHT_MAP === 'undefined') window.THOUGHT_MAP = { "zh-TW": {}, "ja": {}, "en": {} };
        if(typeof LETTER_MAP === 'undefined') window.LETTER_MAP = { "zh-TW": {}, "ja": {}, "en": {} };
    </script>
    <style>
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen font-sans p-4 lg:p-6">

    <div class="max-w-screen-2xl mx-auto flex flex-col lg:flex-row gap-6">
        <!-- 🔐 登入解鎖遮罩 -->

                <p class="text-xs text-slate-400 mb-6">請使用管理員 Google 帳號登入以存取後台。</p>

            </div>
        </div>
        
        <!-- 左側：資料填寫表單 -->
        <div class="w-full lg:w-3/4 bg-slate-800 rounded-xl shadow-xl p-6 h-[90vh] overflow-y-auto border border-slate-700 relative">
            <div class="sticky top-0 bg-slate-800 pb-4 border-b border-slate-700 z-50 flex justify-between items-end">
                <div>
                    <h1 class="text-3xl font-black text-indigo-400 mb-2">⚙️ 終極角色資料管理系統</h1>
                    <div class="flex items-center gap-4">

                        </select>

                    </div>
                </div>
            </div>
            
            <form id="charForm" class="space-y-4 mt-6">
                <!-- 區塊 1 -->
                <div class="bg-slate-900 p-5 rounded-lg border border-slate-600 border-l-4 border-l-amber-500">
                    <h2 class="text-lg font-bold text-white mb-4">1. 核心識別碼 (Key)</h2>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div><label class="block text-sm text-slate-400 mb-1">中文名字 (主鍵)</label><input type="text" id="zhName" class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-white font-bold" required></div>

                        <div><label class="block text-sm text-slate-400 mb-1">英文名字</label><input type="text" id="enName" class="w-full bg-slate-800 border border-slate-600 rounded p-2"></div>

                </div>

                <!-- 區塊 2 -->
                <details class="bg-slate-900 rounded-lg border border-slate-700 group" open>
                    <summary class="cursor-pointer p-4 font-bold text-lg text-indigo-300 bg-slate-800/50 hover:bg-slate-700 rounded-lg flex justify-between items-center">
                        2. 基本與外觀屬性 (data_core.js)

                    </summary>
                    <div class="p-5 border-t border-slate-700 grid grid-cols-2 md:grid-cols-4 gap-4">

                        <div><label class="block text-xs text-slate-400 mb-1">種族</label><input type="text" id="race" class="w-full bg-slate-800 border border-slate-600 rounded p-2"></div>
                        <div><label class="block text-xs text-slate-400 mb-1">站位</label><input type="text" id="position" class="w-full bg-slate-800 border border-slate-600 rounded p-2"></div>

                        <div><label class="block text-xs text-slate-400 mb-1">初始星數</label><input type="text" id="grade" class="w-full bg-slate-800 border border-slate-600 rounded p-2"></div>
                        
                        <div class="col-span-4 border-b border-slate-700 my-2"></div>

                        <div><label class="block text-xs text-slate-400 mb-1">主 Spine</label><input type="text" id="spine" class="w-full bg-slate-800 border border-slate-600 rounded p-2"></div>
                        <div><label class="block text-xs text-slate-400 mb-1">迷你 Spine</label><input type="text" id="miniSpine" class="w-full bg-slate-800 border border-slate-600 rounded p-2"></div>
                        <div><label class="block text-xs text-slate-400 mb-1">立繪服裝 (逗號分隔)</label><input type="text" id="costume" class="w-full bg-slate-800 border border-slate-600 rounded p-2"></div>

                    </summary>
                    <div class="p-5 border-t border-slate-700">

                            <label class="block text-sm text-slate-400 mb-1">戰鬥屬性 (Attribute)</label>

        <!-- 右側：資料更新與下載區 -->
        <div class="w-full lg:w-1/4 bg-slate-800 rounded-xl shadow-xl flex flex-col h-[90vh] border border-slate-700 p-6 sticky top-6">
            <h2 class="text-2xl font-black text-green-400 mb-6 border-b border-slate-700 pb-4">📦 儲存與發布</h2>
            
            <p class="text-sm text-slate-400 mb-6">點擊儲存後，資料會同步寫入本機記憶體以及 Firebase 雲端資料庫。</p>

            <button type="button" onclick="updateMemoryData()" class="w-full py-4 mb-6 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-lg rounded-xl shadow-lg transition-transform hover:scale-[1.02] border border-indigo-400">
                💾 1. 同步儲存 (本機 + 雲端)
            </button>

            <div class="space-y-3 flex-1 overflow-y-auto pr-2" id="downloadSection" style="opacity: 0.3; pointer-events: none;">
                <h3 class="font-bold text-white mb-2 sticky top-0 bg-slate-800 py-1">2. 產生靜態 JS 更新檔</h3>
                <button onclick="downloadJS('data_core.js', generateCoreData())" class="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded text-left px-4 font-mono text-sm border border-slate-600">⬇️ data_core.js</button>
                <button onclick="downloadJS('data_intro.js', generateDataMap('INTRO_MAP', INTRO_MAP))" class="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded text-left px-4 font-mono text-sm border border-slate-600">⬇️ data_intro.js</button>
                <button onclick="downloadJS('data_collectibles.js', generateCollectiblesData())" class="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded text-left px-4 font-mono text-sm border border-slate-600">⬇️ data_collectibles.js</button>
                <button onclick="downloadJS('data_skills.js', generateDataMap('characterSkills', characterSkills))" class="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded text-left px-4 font-mono text-sm border border-slate-600 text-rose-300">⬇️ data_skills.js</button>
                <button onclick="downloadJS('data_aside.js', generateDataMap('ASIDE_DATA', ASIDE_DATA))" class="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded text-left px-4 font-mono text-sm border border-slate-600 text-amber-300">⬇️ data_aside.js</button>
            </div>
            
            <div id="statusMsg" class="mt-4 p-3 rounded bg-green-900/50 text-green-400 text-sm font-bold hidden text-center border border-green-500">
                ✅ 成功儲存！
            </div>
        </div>

    </div>

    <!-- UI 生成與資料處理邏輯 -->
    <script>
        const LANGS = ['zh-TW', 'ja', 'en'];
        const LANG_LABELS = {'zh-TW': '繁體中文', 'ja': '日本語', 'en': 'English'};

        function textToArray(text) { return text ? text.split('\n').map(l => l.trim()).filter(l => l) : []; }
        function arrayToText(arr) { return arr && Array.isArray(arr) ? arr.join('\n') : ''; }
        function textToCommaArray(text) { return text ? text.split(',').map(l => l.trim()).filter(l => l) : []; }
        function commaArrayToText(arr) { return arr && Array.isArray(arr) ? arr.join(', ') : ''; }

        window.fetchFirestoreData = async function() {
            try {
                const selector = document.getElementById('charSelector');
                selector.innerHTML = '<option value="">-- ⏳ 從雲端同步角色資料中... --</option>';

                const querySnapshot = await window.getDocs(window.collection(window.db, "global_characters"));
                
                window.INITIAL_DATA = []; // 清空，重新從雲端載入

                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    const zhName = data.names?.["zh-TW"] || data.core?.name || doc.id;
                    const spineName = data.spineName || doc.id;

                    // 1. 重新建構 INITIAL_DATA
                    if (data.core) {
                        data.core.name = zhName; // 確保名稱正確
                        INITIAL_DATA.push(data.core);
                    } else {
                        INITIAL_DATA.push({ name: zhName });
                    }

                    // 2. 將雲端的各種屬性同步回本機變數
                    SPINE_MAP[zhName] = spineName;
                    if (data.names) {
                        LANG_DICT['zh-TW'][zhName] = data.names['zh-TW'] || zhName;
                        if (data.names['ja']) LANG_DICT['ja'][zhName] = data.names['ja'];
                        if (data.names['en']) LANG_DICT['en'][zhName] = data.names['en'];
                    }

                    // 🌟🌟🌟 新增：把散落的欄位解壓縮回全域 MAP 中，表單才讀得到
                    if (data.cv) CV_MAP[zhName] = data.cv;
                    if (data.grade) GRADE_MAP[zhName] = data.grade;
                    if (data.isEldain && !ELDAIN_LIST.includes(zhName)) ELDAIN_LIST.push(zhName);
                    if (data.miniSpine) MINI_SPINE[zhName] = data.miniSpine;
                    if (data.costume) COSTUME_MAP[zhName] = data.costume;
                    if (data.sdCostume) SD_COSTUME[zhName] = data.sdCostume;
                    if (data.food) FOOD_MAP[spineName] = data.food;
                    if (data.rewards) REWARD_MAP[spineName] = data.rewards;
                    if (data.workUrl) WORK_URL[spineName] = data.workUrl;

                    if (data.skills) {
                        const skIndex = characterSkills.findIndex(s => s.name === zhName);
                        if(skIndex >= 0) characterSkills[skIndex] = data.skills;
                        else characterSkills.push(data.skills);
                    }

                    if (data.aside) ASIDE_DATA[spineName] = data.aside;

                    if (data.texts) {
                        if (data.texts.intro) {
                            LANGS.forEach(l => { if(data.texts.intro[l]) { INTRO_MAP[l] = INTRO_MAP[l]||{}; INTRO_MAP[l][spineName] = data.texts.intro[l]; } });
                        }
                        if (data.texts.thought) {
                            LANGS.forEach(l => { if(data.texts.thought[l]) { THOUGHT_MAP[l] = THOUGHT_MAP[l]||{}; THOUGHT_MAP[l][spineName] = data.texts.thought[l]; } });
                        }
                        if (data.texts.letter) {
                            LANGS.forEach(l => { if(data.texts.letter[l]) { LETTER_MAP[l] = LETTER_MAP[l]||{}; LETTER_MAP[l][spineName] = data.texts.letter[l]; } });
                        }
                        if (data.texts.present) PRESENT_MAP[spineName] = data.texts.present;
                    }
                });

                console.log(`✅ 成功從雲端同步 ${INITIAL_DATA.length} 隻角色！`);
                populateDropdown(); 

            } catch (error) {
                console.error("同步 Firestore 失敗:", error);
                document.getElementById('charSelector').innerHTML = '<option value="">-- ❌ 載入失敗 --</option>';
            }
        };

        window.onload = function() {
            buildTextInputs();
            buildSkillInputs();
            buildAsideInputs();
            // populateDropdown() 移到了 fetchFirestoreData 裡面執行
        };

        function populateDropdown() {
            const selector = document.getElementById('charSelector');
            selector.innerHTML = '<option value="">-- 選擇現有角色 --</option>';
            INITIAL_DATA.forEach(char => {
                const option = document.createElement('option');
                option.value = char.name;
                option.textContent = char.name + (SPINE_MAP[char.name] ? ` (${SPINE_MAP[char.name]})` : '');
                selector.appendChild(option);
            });
        }

        function clearForm() {
            document.getElementById('charSelector').value = "";
            document.getElementById('charForm').reset();
            document.getElementById('downloadSection').style.opacity = '0.3';
            document.getElementById('downloadSection').style.pointerEvents = 'none';
        }

        function buildTextInputs() {
            const container = document.getElementById('textInputsArea');
            LANGS.forEach(lang => {
                container.innerHTML += `
                    <div class="space-y-3 bg-slate-800 p-4 rounded border border-slate-600">
                        <h4 class="font-bold text-blue-300 border-b border-slate-600 pb-2">${LANG_LABELS[lang]}</h4>
                        <div><label class="block text-xs text-slate-400 mb-1">簡介 (Intro)</label><textarea id="intro_${lang}" class="w-full bg-slate-900 border border-slate-700 rounded p-2 h-20 text-sm"></textarea></div>
                        <div><label class="block text-xs text-slate-400 mb-1">珍藏品名稱 (Present)</label><input type="text" id="present_${lang}" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm"></div>
                        <div><label class="block text-xs text-slate-400 mb-1">教主感想 (Thought)</label><textarea id="thought_${lang}" class="w-full bg-slate-900 border border-slate-700 rounded p-2 h-20 text-sm"></textarea></div>
                        <div><label class="block text-xs text-slate-400 mb-1">書信內容 (Letter)</label><textarea id="letter_${lang}" class="w-full bg-slate-900 border border-slate-700 rounded p-2 h-24 text-sm"></textarea></div>
                    </div>`;
            });
        }

        function loadCharacterData(zhName) {
            if (!zhName) { clearForm(); return; }
            const spineName = SPINE_MAP[zhName] || "";
            
            // Core
            document.getElementById('zhName').value = zhName;
            document.getElementById('spineName').value = spineName;
            document.getElementById('jaName').value = (LANG_DICT['ja'] && LANG_DICT['ja'][zhName]) || "";
            document.getElementById('enName').value = (LANG_DICT['en'] && LANG_DICT['en'][zhName]) || "";

            const coreData = INITIAL_DATA.find(c => c.name === zhName) || {};
            ['personality', 'race', 'position', 'job', 'pathVersion', 'releaseDate'].forEach(k => {
                document.getElementById(k).value = coreData[k] || "";
            });

            document.getElementById('cv').value = CV_MAP[zhName] || "";
            document.getElementById('grade').value = GRADE_MAP[zhName] || "";
            document.getElementById('isEldain').checked = ELDAIN_LIST.includes(zhName);
            
            document.getElementById('spine').value = SPINE_MAP[zhName] || "";
            document.getElementById('miniSpine').value = MINI_SPINE[zhName] || "";
            document.getElementById('costume').value = commaArrayToText(COSTUME_MAP[zhName]);
            document.getElementById('sdCostume').value = commaArrayToText(SD_COSTUME[zhName]);
            
            if(FOOD_MAP[spineName]) {
                document.getElementById('foodSuper').value = FOOD_MAP[spineName].super || "";
                document.getElementById('foodSpecial').value = commaArrayToText(FOOD_MAP[spineName].special);
            } else { document.getElementById('foodSuper').value = ""; document.getElementById('foodSpecial').value = ""; }
            
            document.getElementById('rewards').value = arrayToText(REWARD_MAP[spineName]);
            document.getElementById('workUrl').value = WORK_URL[spineName] || "";

            // Texts
            LANGS.forEach(lang => {
                document.getElementById(`intro_${lang}`).value = (INTRO_MAP[lang] && INTRO_MAP[lang][spineName]) || "";
                document.getElementById(`thought_${lang}`).value = (THOUGHT_MAP[lang] && THOUGHT_MAP[lang][spineName]) || "";
                document.getElementById(`letter_${lang}`).value = (LETTER_MAP[lang] && LETTER_MAP[lang][spineName]) || "";
                if(PRESENT_MAP[spineName] && PRESENT_MAP[spineName].name) {
                    document.getElementById(`present_${lang}`).value = PRESENT_MAP[spineName].name[lang] || "";
                } else { document.getElementById(`present_${lang}`).value = ""; }
            });

            // Skills
            const skData = characterSkills.find(s => s.name === zhName) || { skills: {} };
            document.getElementById('skillAttribute').value = skData.attribute || "";
            LANGS.forEach(lang => {
                const sl = skData.skills[lang] || {};
                document.getElementById(`sk_${lang}_na_b`).value = sl.normalAttack?.basic || "";
                document.getElementById(`sk_${lang}_na_e`).value = sl.normalAttack?.enhanced || "";
                document.getElementById(`sk_${lang}_ns_n`).value = sl.normalSkill?.name || "";
                document.getElementById(`sk_${lang}_ns_d`).value = sl.normalSkill?.desc || "";
                document.getElementById(`sk_${lang}_ns_s`).value = arrayToText(sl.normalSkill?.stats);
                document.getElementById(`sk_${lang}_us_n`).value = sl.ultimateSkill?.name || "";
                document.getElementById(`sk_${lang}_us_c`).value = sl.ultimateSkill?.cooldown || "";
                document.getElementById(`sk_${lang}_us_d`).value = sl.ultimateSkill?.desc || "";
                document.getElementById(`sk_${lang}_us_s`).value = arrayToText(sl.ultimateSkill?.stats);
                document.getElementById(`sk_${lang}_ps_d`).value = sl.passiveSkill?.desc || "";
                document.getElementById(`sk_${lang}_ps_s`).value = arrayToText(sl.passiveSkill?.stats);
            });

            // Aside
            const asData = ASIDE_DATA[spineName] || { totalName:{}, stars:{ 1:{}, 2:{}, 3:{} } };
            LANGS.forEach(lang => {
                const asideLang = (lang === 'zh-TW') ? 'zh' : lang; 
                
                document.getElementById(`as_total_${lang}`).value = asData.totalName?.[asideLang] || "";
                [1,2,3].forEach(star => {
                    const st = asData.stars?.[star] || {};
                    document.getElementById(`as_${star}_n_${lang}`).value = st.name?.[asideLang] || "";
                    document.getElementById(`as_${star}_d_${lang}`).value = st.desc?.[asideLang] || "";
                    document.getElementById(`as_${star}_e_${lang}`).value = arrayToText(st.effects?.[asideLang]);
                    if(star===3) document.getElementById(`as_3_g_${lang}`).value = arrayToText(st.globalEffects?.[asideLang]);
                });
            });

            document.getElementById('downloadSection').style.opacity = '1';
            document.getElementById('downloadSection').style.pointerEvents = 'auto';
        }

        async function updateMemoryData() {
            const zhName = document.getElementById('zhName').value.trim();
            const spineName = document.getElementById('spineName').value.trim();
            if (!zhName || !spineName) { alert("中文名字與 Spine 名稱必填！"); return; }

            // 1. 更新本機記憶體變數
            LANG_DICT['zh-TW'][zhName] = zhName;
            if(document.getElementById('jaName').value) LANG_DICT['ja'][zhName] = document.getElementById('jaName').value;
            if(document.getElementById('enName').value) LANG_DICT['en'][zhName] = document.getElementById('enName').value;

            let coreIndex = INITIAL_DATA.findIndex(c => c.name === zhName);
            const newCoreData = { name: zhName };
            ['personality', 'race', 'position', 'job', 'pathVersion', 'releaseDate'].forEach(k => {
                if(document.getElementById(k).value) newCoreData[k] = document.getElementById(k).value;
            });
            if(coreIndex >= 0) INITIAL_DATA[coreIndex] = { ...INITIAL_DATA[coreIndex], ...newCoreData };
            else { INITIAL_DATA.push(newCoreData); populateDropdown(); document.getElementById('charSelector').value = zhName; }

            if(document.getElementById('cv').value) CV_MAP[zhName] = document.getElementById('cv').value;
            if(document.getElementById('grade').value) GRADE_MAP[zhName] = document.getElementById('grade').value;
            SPINE_MAP[zhName] = spineName;
            
            const isEldain = document.getElementById('isEldain').checked;
            const eldainIndex = ELDAIN_LIST.indexOf(zhName);
            if (isEldain && eldainIndex === -1) ELDAIN_LIST.push(zhName);
            if (!isEldain && eldainIndex > -1) ELDAIN_LIST.splice(eldainIndex, 1);

            if(document.getElementById('spine').value) SPINE_MAP[zhName] = document.getElementById('spine').value;
            if(document.getElementById('miniSpine').value) MINI_SPINE[zhName] = document.getElementById('miniSpine').value;
            
            const costumeArr = textToCommaArray(document.getElementById('costume').value);
            if(costumeArr.length) COSTUME_MAP[zhName] = costumeArr;
            const sdCostumeArr = textToCommaArray(document.getElementById('sdCostume').value);
            if(sdCostumeArr.length) SD_COSTUME[zhName] = sdCostumeArr;

            const superFood = document.getElementById('foodSuper').value;
            const specialFood = textToCommaArray(document.getElementById('foodSpecial').value);
            if(superFood || specialFood.length) FOOD_MAP[spineName] = { super: superFood, special: specialFood };
            
            const rewards = textToArray(document.getElementById('rewards').value);
            if(rewards.length) REWARD_MAP[spineName] = rewards;
            if(document.getElementById('workUrl').value) WORK_URL[spineName] = document.getElementById('workUrl').value;

            // Texts
            LANGS.forEach(lang => {
                if(!INTRO_MAP[lang]) INTRO_MAP[lang] = {};
                if(!THOUGHT_MAP[lang]) THOUGHT_MAP[lang] = {};
                if(!LETTER_MAP[lang]) LETTER_MAP[lang] = {};
                
                if(document.getElementById(`intro_${lang}`).value) INTRO_MAP[lang][spineName] = document.getElementById(`intro_${lang}`).value;
                if(document.getElementById(`thought_${lang}`).value) THOUGHT_MAP[lang][spineName] = document.getElementById(`thought_${lang}`).value;
                if(document.getElementById(`letter_${lang}`).value) LETTER_MAP[lang][spineName] = document.getElementById(`letter_${lang}`).value;
                
                const pres = document.getElementById(`present_${lang}`).value;
                if(pres) {
                    if(!PRESENT_MAP[spineName]) PRESENT_MAP[spineName] = { name: {} };
                    if(!PRESENT_MAP[spineName].name) PRESENT_MAP[spineName].name = {};
                    PRESENT_MAP[spineName].name[lang] = pres;
                }
            });

            // Skills
            let skIndex = characterSkills.findIndex(s => s.name === zhName);
            let skillObj = skIndex >= 0 ? characterSkills[skIndex] : { name: zhName, skills: {} };
            skillObj.attribute = document.getElementById('skillAttribute').value;
            LANGS.forEach(lang => {
                skillObj.skills[lang] = {
                    normalAttack: {
                        basic: document.getElementById(`sk_${lang}_na_b`).value,
                        enhanced: document.getElementById(`sk_${lang}_na_e`).value
                    },
                    normalSkill: {
                        name: document.getElementById(`sk_${lang}_ns_n`).value,
                        desc: document.getElementById(`sk_${lang}_ns_d`).value,
                        stats: textToArray(document.getElementById(`sk_${lang}_ns_s`).value)
                    },
                    ultimateSkill: {
                        name: document.getElementById(`sk_${lang}_us_n`).value,
                        desc: document.getElementById(`sk_${lang}_us_d`).value,
                        cooldown: document.getElementById(`sk_${lang}_us_c`).value,
                        stats: textToArray(document.getElementById(`sk_${lang}_us_s`).value)
                    },
                    passiveSkill: {
                        desc: document.getElementById(`sk_${lang}_ps_d`).value,
                        stats: textToArray(document.getElementById(`sk_${lang}_ps_s`).value)
                    }
                };
            });
            if(skIndex >= 0) characterSkills[skIndex] = skillObj; else characterSkills.push(skillObj);

            // Aside
            let asObj = ASIDE_DATA[spineName] || { asideIcon: "", totalName: {}, stars: { 1:{icon:""}, 2:{icon:""}, 3:{icon:""} } };
            if(!asObj.totalName) asObj.totalName = {};
            if(!asObj.stars) asObj.stars = { 1:{icon:""}, 2:{icon:""}, 3:{icon:""} };
            
            LANGS.forEach(lang => {
                const asideLang = (lang === 'zh-TW') ? 'zh' : lang; 
                
                if(document.getElementById(`as_total_${lang}`).value) {
                    asObj.totalName[asideLang] = document.getElementById(`as_total_${lang}`).value;
                }
                
                [1,2,3].forEach(star => {
                    if(!asObj.stars[star]) asObj.stars[star] = {icon:"", name:{}, desc:{}, effects:{}};
                    if(!asObj.stars[star].name) asObj.stars[star].name = {};
                    if(!asObj.stars[star].desc) asObj.stars[star].desc = {};
                    if(!asObj.stars[star].effects) asObj.stars[star].effects = {};
                    
                    asObj.stars[star].name[asideLang] = document.getElementById(`as_${star}_n_${lang}`).value;
                    asObj.stars[star].desc[asideLang] = document.getElementById(`as_${star}_d_${lang}`).value;
                    asObj.stars[star].effects[asideLang] = textToArray(document.getElementById(`as_${star}_e_${lang}`).value);
                    
                    if(star===3) {
                        if(!asObj.stars[3].globalEffects) asObj.stars[3].globalEffects = {};
                        asObj.stars[3].globalEffects[asideLang] = textToArray(document.getElementById(`as_3_g_${lang}`).value);
                    }
                });
            });
            ASIDE_DATA[spineName] = asObj;

            // 2. 將資料整合成大 JSON 並寫入 Firebase
            const characterDocument = {
                spineName: spineName,
                names: {
                    "zh-TW": zhName,
                    "ja": document.getElementById('jaName').value || "",
                    "en": document.getElementById('enName').value || ""
                },
                core: INITIAL_DATA.find(c => c.name === zhName) || {},
                
                // 🌟 新增：將原本散落的 Map 資料一併打包進 Firebase！
                cv: document.getElementById('cv').value || "",
                grade: document.getElementById('grade').value || "",
                isEldain: document.getElementById('isEldain').checked,
                miniSpine: document.getElementById('miniSpine').value || "",
                costume: textToCommaArray(document.getElementById('costume').value),
                sdCostume: textToCommaArray(document.getElementById('sdCostume').value),
                food: {
                    super: document.getElementById('foodSuper').value || "",
                    special: textToCommaArray(document.getElementById('foodSpecial').value)
                },
                rewards: textToArray(document.getElementById('rewards').value),
                workUrl: document.getElementById('workUrl').value || "",

                skills: characterSkills.find(s => s.name === zhName) || {},
                aside: ASIDE_DATA[spineName] || {},
                texts: {
                    intro: {
                        "zh-TW": document.getElementById('intro_zh-TW').value || "",
                        "ja": document.getElementById('intro_ja').value || "",
                        "en": document.getElementById('intro_en').value || ""
                    },
                    thought: {
                        "zh-TW": document.getElementById('thought_zh-TW').value || "",
                        "ja": document.getElementById('thought_ja').value || "",
                        "en": document.getElementById('thought_en').value || ""
                    },
                    letter: {
                        "zh-TW": document.getElementById('letter_zh-TW').value || "",
                        "ja": document.getElementById('letter_ja').value || "",
                        "en": document.getElementById('letter_en').value || ""
                    },
                    present: PRESENT_MAP[spineName] || {}
                },
                lastUpdated: new Date().toISOString()
            };

            try {
                if (window.setDoc && window.doc && window.db) {
                    await window.setDoc(window.doc(window.db, "global_characters", spineName), characterDocument);
                    const msg = document.getElementById('statusMsg');
                    msg.textContent = "✅ 成功同步至本機與 Firebase 雲端！請點擊下載更新檔。";
                    msg.classList.remove('hidden');
                    setTimeout(() => msg.classList.add('hidden'), 5000);
                } else {
                    alert("⚠️ Firebase 尚未正確初始化，目前僅儲存至本機記憶體。");
                }
            } catch (error) {
                console.error("Firebase 寫入失敗:", error);
                alert("儲存至雲端失敗！請開啟 F12 開發者工具檢查 Console 錯誤訊息。");
            }

            document.getElementById('downloadSection').style.opacity = '1';
            document.getElementById('downloadSection').style.pointerEvents = 'auto';
        }

        // 🌟 修正點：防止 INITIAL_DATA 再度被寫回 data_core.js 造成資料兩倍的 Bug
        function generateCoreData() {
            return `const LANG_DICT = ${JSON.stringify(LANG_DICT, null, 4)};\n\n` +

                   `const INITIAL_DATA = [];\n\n` +

                   `const GRADE_MAP = ${JSON.stringify(GRADE_MAP, null, 4)};\n\n` +

                   `const REWARD_MAP = ${JSON.stringify(REWARD_MAP, null, 4)};\n\n` +
                   `const WORK_URL = ${JSON.stringify(WORK_URL, null, 4)};\n\n` +
                   `const SPINE_MAP = ${JSON.stringify(SPINE_MAP, null, 4)};\n\n` +
                   `const COSTUME_MAP = ${JSON.stringify(COSTUME_MAP, null, 4)};\n\n` +

                   `const MINI_SPINE = ${JSON.stringify(MINI_SPINE, null, 4)};\n`;
        }

        function generateCollectiblesData() {
            return `const PRESENT_MAP = ${JSON.stringify(PRESENT_MAP, null, 4)};\n\n` +
                   `const THOUGHT_MAP = ${JSON.stringify(THOUGHT_MAP, null, 4)};\n\n` +
                   `const LETTER_MAP = ${JSON.stringify(LETTER_MAP, null, 4)};\n`;
        }

        function generateDataMap(varName, dataObj) {
            return `const ${varName} = ${JSON.stringify(dataObj, null, 4)};\n`;
        }

        function downloadJS(filename, content) {
            const blob = new Blob(['\ufeff' + content], { type: 'text/javascript;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
