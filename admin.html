<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終極角色資料管理系統 (單機版)</title>
    <link rel="stylesheet" href="./style.css">
    <script src="data_config.js"></script> 
    <script src="data_core.js"></script>
    <script src="data_skills.js"></script>
    <script src="data_aside.js"></script>
    <script src="data_intro.js"></script>
    <script src="data_collectibles.js"></script>
    
    <script>
        if(typeof LANG_DICT === 'undefined') window.LANG_DICT = { "zh-TW": {}, "ja": {}, "en": {} };
        if(typeof INITIAL_DATA === 'undefined') window.INITIAL_DATA = [];
        if(typeof CV_MAP === 'undefined') window.CV_MAP = {};
        if(typeof GRADE_MAP === 'undefined') window.GRADE_MAP = {};
        if(typeof ELDAIN_LIST === 'undefined') window.ELDAIN_LIST = [];
        if(typeof FOOD_MAP === 'undefined') window.FOOD_MAP = {};
        if(typeof REWARD_MAP === 'undefined') window.REWARD_MAP = {};
        if(typeof WORK_URL === 'undefined') window.WORK_URL = {};
        if(typeof SPINE_MAP === 'undefined') window.SPINE_MAP = {};
        if(typeof COSTUME_MAP === 'undefined') window.COSTUME_MAP = {};
        if(typeof SD_COSTUME === 'undefined') window.SD_COSTUME = {};
        if(typeof MINI_SPINE === 'undefined') window.MINI_SPINE = {};
        
        if(typeof ASIDE_DATA === 'undefined') window.ASIDE_DATA = {};
        if(typeof characterSkills === 'undefined') window.characterSkills = []; 
        
        if(typeof INTRO_MAP === 'undefined') window.INTRO_MAP = { "zh-TW": {}, "ja": {}, "en": {} };
        if(typeof PRESENT_MAP === 'undefined') window.PRESENT_MAP = {};
        if(typeof THOUGHT_MAP === 'undefined') window.THOUGHT_MAP = { "zh-TW": {}, "ja": {}, "en": {} };
        if(typeof LETTER_MAP === 'undefined') window.LETTER_MAP = { "zh-TW": {}, "ja": {}, "en": {} };
        
        if(typeof FOOD_ICON === 'undefined') window.FOOD_ICON = {};
        if(typeof REWARD_ICON === 'undefined') window.REWARD_ICON = {};
    </script>
    <style>
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        
        /* 拖曳時游標樣式 */
        .cursor-grab { cursor: grab; }
        .cursor-grab:active { cursor: grabbing; }
        
        /* 拖放目標的高亮特效 */
        .drag-over {
            border-color: #fbbf24 !important;
            background-color: rgba(251, 191, 36, 0.1) !important;
        }
        .drag-over-reward {
            border-color: #34d399 !important;
            background-color: rgba(52, 211, 153, 0.1) !important;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen font-sans p-4 lg:p-6">

    <div class="max-w-screen-2xl mx-auto flex flex-col lg:flex-row gap-6">
        
        <!-- 左側：資料填寫表單 -->
        <div class="w-full lg:w-3/4 bg-slate-800 rounded-xl shadow-xl p-6 h-[90vh] overflow-y-auto border border-slate-700 relative">
            <div class="sticky top-0 bg-slate-800 pb-4 border-b border-slate-700 z-50 flex justify-between items-end">
                <div>
                    <h1 class="text-3xl font-black text-indigo-400 mb-2">⚙️ 終極角色資料管理系統 (單機版)</h1>
                    <div class="flex items-center gap-4">
                        <select id="charSelector" onchange="loadCharacterData(this.value)" class="bg-slate-900 border border-slate-600 text-white font-bold rounded p-2 focus:ring-2 focus:ring-indigo-500 outline-none w-64">
                            <option value="">-- 選擇現有角色 --</option>
                        </select>
                        <button onclick="clearForm()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded text-sm font-bold transition-colors shadow">
                            + 建立全新角色
                        </button>
                    </div>
                </div>
            </div>
            
            <form id="charForm" class="space-y-4 mt-6">
                <!-- 區塊 1 -->
                <div class="bg-slate-900 p-5 rounded-lg border border-slate-600 border-l-4 border-l-amber-500">
                    <h2 class="text-lg font-bold text-white mb-4">1. 核心識別碼 (Key)</h2>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div><label class="block text-sm text-slate-400 mb-1">中文名字 (主鍵)</label><input type="text" id="zhName" class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-white font-bold" required></div>
                        <div><label class="block text-sm text-slate-400 mb-1">Spine 名稱 (主鍵)</label><input type="text" id="spineName" class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-amber-300 font-bold" required></div>
                        <div><label class="block text-sm text-slate-400 mb-1">日文名字</label><input type="text" id="jaName" class="w-full bg-slate-800 border border-slate-600 rounded p-2"></div>
                        <div><label class="block text-sm text-slate-400 mb-1">英文名字</label><input type="text" id="enName" class="w-full bg-slate-800 border border-slate-600 rounded p-2"></div>
                    </div>
                </div>

                <!-- 區塊 2 -->
                <details class="bg-slate-900 rounded-lg border border-slate-700 group" open>
                    <summary class="cursor-pointer p-4 font-bold text-lg text-indigo-300 bg-slate-800/50 hover:bg-slate-700 rounded-lg flex justify-between items-center">
                        2. 基本與外觀屬性 (data_core.js)
                        <span class="text-xl group-open:rotate-180 transition-transform">▼</span>
                    </summary>
                    <div class="p-5 border-t border-slate-700 grid grid-cols-2 md:grid-cols-4 gap-4">
                        
                        <div><label class="block text-xs text-slate-400 mb-1">性格</label><input type="text" id="personality" list="list-personality" class="w-full bg-slate-800 border border-slate-600 rounded p-2"></div>
                        <div><label class="block text-xs text-slate-400 mb-1">種族</label><input type="text" id="race" list="list-race" class="w-full bg-slate-800 border border-slate-600 rounded p-2"></div>
                        <div><label class="block text-xs text-slate-400 mb-1">站位</label><input type="text" id="position" list="list-position" class="w-full bg-slate-800 border border-slate-600 rounded p-2"></div>
                        <div><label class="block text-xs text-slate-400 mb-1">職業</label><input type="text" id="job" list="list-job" class="w-full bg-slate-800 border border-slate-600 rounded p-2"></div>
                        
                        <div><label class="block text-xs text-slate-400 mb-1">實裝版本</label><input type="text" id="pathVersion" class="w-full bg-slate-800 border border-slate-600 rounded p-2"></div>
                        <div><label class="block text-xs text-slate-400 mb-1">實裝日期</label><input type="text" id="releaseDate" class="w-full bg-slate-800 border border-slate-600 rounded p-2" placeholder="YYYY-MM-DD..."></div>
                        <div><label class="block text-xs text-slate-400 mb-1">聲優 (CV)</label><input type="text" id="cv" class="w-full bg-slate-800 border border-slate-600 rounded p-2"></div>
                        <div><label class="block text-xs text-slate-400 mb-1">初始星數</label><input type="text" id="grade" class="w-full bg-slate-800 border border-slate-600 rounded p-2"></div>
                        
                        <div class="col-span-4 border-b border-slate-700 my-2"></div>

                        <div><label class="block text-xs text-slate-400 mb-1">主 Spine</label><input type="text" id="spine" class="w-full bg-slate-800 border border-slate-600 rounded p-2"></div>
                        <div><label class="block text-xs text-slate-400 mb-1">迷你 Spine</label><input type="text" id="miniSpine" class="w-full bg-slate-800 border border-slate-600 rounded p-2"></div>
                        <div><label class="block text-xs text-slate-400 mb-1">立繪服裝 (逗號分隔)</label><input type="text" id="costume" class="w-full bg-slate-800 border border-slate-600 rounded p-2"></div>
                        <div><label class="block text-xs text-slate-400 mb-1">SD 服裝 (逗號分隔)</label><input type="text" id="sdCostume" class="w-full bg-slate-800 border border-slate-600 rounded p-2"></div>

                        <div class="col-span-4 flex items-center bg-slate-800 p-3 rounded border border-slate-600">
                            <input type="checkbox" id="isEldain" class="w-5 h-5 mr-3 accent-indigo-500"> <label class="text-slate-200 font-bold">標記為艾爾丁 (Eldain)</label>
                        </div>

                        <!-- 💡 料理拖曳圖庫與輸入區 -->
                        <div class="col-span-4 bg-slate-800/80 p-4 rounded-xl border border-amber-600/50 mt-4 shadow-inner">
                            <div class="flex justify-between items-center mb-2">
                                <label class="block text-sm font-bold text-amber-400">🍎 共用料理圖庫</label>
                                <input type="text" placeholder="🔍 搜尋料理..." oninput="filterIcons('drag-source-food', this.value)" class="bg-slate-900 border border-slate-600 rounded px-3 py-1 text-sm text-white focus:outline-none focus:border-amber-400">
                            </div>
                            <!-- 加入 h-[140px] 與 overflow-y-auto 讓圖庫不會無限長大 -->
                            <div id="drag-source-food" class="flex flex-wrap content-start gap-3 mb-5 p-3 bg-slate-900/50 rounded-lg h-[140px] overflow-y-auto border border-slate-700 custom-scrollbar"></div>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">最愛料理 (Super) - 只能1項</label>
                                    <input type="text" id="foodSuper" placeholder="將料理圖示拖曳到此處..." class="w-full bg-slate-900 border-2 border-dashed border-slate-500 rounded-lg p-3 text-amber-200 font-bold focus:outline-none transition-colors"
                                    ondragover="allowDrop(event)" ondragenter="dragEnterFood(event)" ondragleave="dragLeaveFood(event)" ondrop="dropItem(event, 'foodSuper')">
                                </div>
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">喜歡料理 (Special) - 逗號分隔，可多項</label>
                                    <input type="text" id="foodSpecial" placeholder="將料理圖示拖曳到此處..." class="w-full bg-slate-900 border-2 border-dashed border-slate-500 rounded-lg p-3 text-amber-100 focus:outline-none transition-colors"
                                    ondragover="allowDrop(event)" ondragenter="dragEnterFood(event)" ondragleave="dragLeaveFood(event)" ondrop="dropItem(event, 'foodSpecial')">
                                </div>
                            </div>
                        </div>

                        <!-- 💡 打工獎勵拖曳圖庫與輸入區 -->
                        <div class="col-span-4 bg-slate-800/80 p-4 rounded-xl border border-emerald-600/50 mt-2 shadow-inner">
                            <div class="flex justify-between items-center mb-2">
                                <label class="block text-sm font-bold text-emerald-400">💼 打工獎勵圖庫</label>
                                <input type="text" placeholder="🔍 搜尋獎勵..." oninput="filterIcons('drag-source-reward', this.value)" class="bg-slate-900 border border-slate-600 rounded px-3 py-1 text-sm text-white focus:outline-none focus:border-emerald-400">
                            </div>
                            <!-- 加入 h-[140px] 與 overflow-y-auto -->
                            <div id="drag-source-reward" class="flex flex-wrap content-start gap-3 mb-5 p-3 bg-slate-900/50 rounded-lg h-[140px] overflow-y-auto border border-slate-700 custom-scrollbar"></div>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">打工獎勵 (換行分隔) - 可多項</label>
                                    <textarea id="rewards" placeholder="將獎勵圖示拖曳到此處..." class="w-full bg-slate-900 border-2 border-dashed border-slate-500 rounded-lg p-3 h-24 text-emerald-200 focus:outline-none transition-colors"
                                    ondragover="allowDrop(event)" ondragenter="dragEnterReward(event)" ondragleave="dragLeaveReward(event)" ondrop="dropItem(event, 'rewards')"></textarea>
                                </div>
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">打工影片 URL</label>
                                    <input type="text" id="workUrl" class="w-full bg-slate-900 border border-slate-600 rounded p-2">
                                </div>
                            </div>
                        </div>
                    </div>
                </details>

                <!-- 區塊 3 -->
                <details class="bg-slate-900 rounded-lg border border-slate-700 group">
                    <summary class="cursor-pointer p-4 font-bold text-lg text-blue-300 bg-slate-800/50 hover:bg-slate-700 rounded-lg flex justify-between items-center">
                        3. 簡介與珍藏品 (data_intro / collectibles)
                        <span class="text-xl group-open:rotate-180 transition-transform">▼</span>
                    </summary>
                    <div class="p-5 border-t border-slate-700 space-y-6">
                        <div id="textInputsArea" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
                    </div>
                </details>

                <!-- 區塊 4 -->
                <details class="bg-slate-900 rounded-lg border border-slate-700 group">
                    <summary class="cursor-pointer p-4 font-bold text-lg text-rose-300 bg-slate-800/50 hover:bg-slate-700 rounded-lg flex justify-between items-center">
                        4. 技能設定 (data_skills.js)
                        <span class="text-xl group-open:rotate-180 transition-transform">▼</span>
                    </summary>
                    <div class="p-5 border-t border-slate-700">
                        <div class="mb-4 w-1/3">
                            <label class="block text-sm text-slate-400 mb-1">戰鬥屬性 (Attribute)</label>
                            <input type="text" id="skillAttribute" class="w-full bg-slate-800 border border-slate-600 rounded p-2" placeholder="物理/魔法">
                        </div>
                        <div id="skillInputsArea" class="space-y-8"></div>
                    </div>
                </details>

                <!-- 區塊 5 -->
                <details class="bg-slate-900 rounded-lg border border-slate-700 group">
                    <summary class="cursor-pointer p-4 font-bold text-lg text-amber-300 bg-slate-800/50 hover:bg-slate-700 rounded-lg flex justify-between items-center">
                        5. 願像設定 (data_aside.js)
                        <span class="text-xl group-open:rotate-180 transition-transform">▼</span>
                    </summary>
                    <div class="p-5 border-t border-slate-700">
                        <div id="asideInputsArea" class="space-y-8"></div>
                    </div>
                </details>

            </form>
            <br><br><br>
        </div>

        <!-- 右側：資料更新與下載區 -->
        <div class="w-full lg:w-1/4 bg-slate-800 rounded-xl shadow-xl flex flex-col h-[90vh] border border-slate-700 p-6 sticky top-6">
            <h2 class="text-2xl font-black text-green-400 mb-6 border-b border-slate-700 pb-4">📦 儲存與發布</h2>
            <button type="button" onclick="updateMemoryData()" class="w-full py-4 mb-6 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-lg rounded-xl shadow-lg transition-transform hover:scale-[1.02] border border-indigo-400">
                💾 1. 同步儲存 (寫入記憶體)
            </button>
            <div class="space-y-3 flex-1 overflow-y-auto pr-2" id="downloadSection" style="opacity: 0.3; pointer-events: none;">
                <h3 class="font-bold text-white mb-2 sticky top-0 bg-slate-800 py-1">2. 產生靜態 JS 更新檔</h3>
                <button onclick="downloadJS('data_core.js', generateCoreData())" class="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded text-left px-4 font-mono text-sm border border-slate-600">⬇️ data_core.js</button>
                <button onclick="downloadJS('data_intro.js', generateDataMap('INTRO_MAP', INTRO_MAP))" class="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded text-left px-4 font-mono text-sm border border-slate-600">⬇️ data_intro.js</button>
                <button onclick="downloadJS('data_collectibles.js', generateCollectiblesData())" class="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded text-left px-4 font-mono text-sm border border-slate-600">⬇️ data_collectibles.js</button>
                <button onclick="downloadJS('data_skills.js', generateDataMap('characterSkills', characterSkills))" class="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded text-left px-4 font-mono text-sm border border-slate-600 text-rose-300">⬇️ data_skills.js</button>
                <button onclick="downloadJS('data_aside.js', generateDataMap('ASIDE_DATA', ASIDE_DATA))" class="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded text-left px-4 font-mono text-sm border border-slate-600 text-amber-300">⬇️ data_aside.js</button>
            </div>
            <div id="statusMsg" class="mt-4 p-3 rounded bg-green-900/50 text-green-400 text-sm font-bold hidden text-center border border-green-500">
                ✅ 已更新記憶體！請點擊上方按鈕下載。
            </div>
        </div>

    </div>

    <!-- 隱藏的 Datalist (性格, 種族, 站位, 職業) -->
    <datalist id="list-personality"></datalist>
    <datalist id="list-race"></datalist>
    <datalist id="list-position"></datalist>
    <datalist id="list-job"></datalist>

    <script>
        const LANGS = ['zh-TW', 'ja', 'en'];
        const LANG_LABELS = {'zh-TW': '繁體中文', 'ja': '日本語', 'en': 'English'};

        function textToArray(text) { return text ? text.split('\n').map(l => l.trim()).filter(l => l) : []; }
        function arrayToText(arr) { return arr && Array.isArray(arr) ? arr.join('\n') : ''; }
        function textToCommaArray(text) { return text ? text.split(',').map(l => l.trim()).filter(l => l) : []; }
        function commaArrayToText(arr) { return arr && Array.isArray(arr) ? arr.join(', ') : ''; }

        window.onload = function() {
            buildTextInputs();
            buildSkillInputs();
            buildAsideInputs();
            populateDropdown(); 
            buildHelperUI(); 
            document.getElementById('downloadSection').style.opacity = '1';
            document.getElementById('downloadSection').style.pointerEvents = 'auto';
        };

        // ========== 拖曳 (Drag & Drop) 事件邏輯 ==========
        function dragStart(e, value, type) {
            e.dataTransfer.setData('custom/type', type);
            e.dataTransfer.setData('custom/value', value);
            e.dataTransfer.effectAllowed = 'copy';
        }

        function allowDrop(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; }
        function dragEnterFood(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
        function dragLeaveFood(e) { e.currentTarget.classList.remove('drag-over'); }
        function dragEnterReward(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over-reward'); }
        function dragLeaveReward(e) { e.currentTarget.classList.remove('drag-over-reward'); }

        function dropItem(e, targetId) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over', 'drag-over-reward');
            
            const type = e.dataTransfer.getData('custom/type');
            const val = e.dataTransfer.getData('custom/value');
            if(!val) return; 

            // 確保料理不能拉進獎勵，獎勵不能拉進料理
            if (targetId.startsWith('food') && type !== 'food') { alert('這不是料理圖示！'); return; }
            if (targetId === 'rewards' && type !== 'reward') { alert('這不是獎勵圖示！'); return; }

            const input = document.getElementById(targetId);
            
            if (targetId === 'foodSuper') {
                input.value = val; // 最愛料理單選覆蓋
            } else if (targetId === 'foodSpecial') {
                let arr = textToCommaArray(input.value);
                if (!arr.includes(val)) arr.push(val);
                input.value = commaArrayToText(arr); // 喜歡料理逗號分隔
            } else if (targetId === 'rewards') {
                let arr = textToArray(input.value);
                if (!arr.includes(val)) arr.push(val);
                input.value = arrayToText(arr); // 獎勵換行分隔
            }
        }
        // ========== 圖庫即時搜尋過濾 ==========
        function filterIcons(containerId, keyword) {
            const container = document.getElementById(containerId);
            const items = container.children;
            // 轉成小寫方便比對，如果是日文/英文也可以支援
            const lowerKeyword = keyword.toLowerCase().trim();
    
            for (let item of items) {
                // 從我們建立圖示時設定的 title 屬性中抓出中文名稱
                const title = item.getAttribute('title').toLowerCase();
        
                // 如果包含關鍵字，就移除隱藏標籤，否則隱藏起來 (設定 display: none)
                if (title.includes(lowerKeyword)) {
                    item.style.display = '';
                } else {
                    item.style.display = 'none';
                }
            }
        // ============================================

        function buildHelperUI() {
            // 1. 初始化下拉清單
            const dataSets = { personality: new Set(), race: new Set(), position: new Set(), job: new Set() };
            INITIAL_DATA.forEach(c => {
                if (c.personality) dataSets.personality.add(c.personality);
                if (c.race) dataSets.race.add(c.race);
                if (c.position) dataSets.position.add(c.position);
                if (c.job) dataSets.job.add(c.job);
            });
            ['personality', 'race', 'position', 'job'].forEach(key => {
                const list = document.getElementById(`list-${key}`);
                list.innerHTML = '';
                [...dataSets[key]].sort().forEach(val => list.innerHTML += `<option value="${val}">`);
            });

            // 2. 建立料理拖曳圖庫 (合併 Super & Special，並從 FOOD_ICON 取圖)
            const foodSet = new Set();
            if (typeof FOOD_ICON !== 'undefined') Object.keys(FOOD_ICON).forEach(k => foodSet.add(k));
            Object.values(FOOD_MAP).forEach(f => {
                if (f.super) foodSet.add(f.super);
                if (f.special) f.special.forEach(sp => foodSet.add(sp));
            });

            const dragSourceFood = document.getElementById('drag-source-food');
            dragSourceFood.innerHTML = '';
            [...foodSet].sort().forEach(val => {
                // 💡 修正：移除 window. 前綴，直接讀取全域變數
                let iconUrl = (typeof FOOD_ICON !== 'undefined' && FOOD_ICON[val] && FOOD_ICON[val].url) ? FOOD_ICON[val].url : null;
                let el = iconUrl 
                    ? `<img src="${iconUrl}" title="${val}" draggable="true" ondragstart="dragStart(event, '${val}', 'food')" class="w-12 h-12 object-contain bg-slate-700 border border-slate-600 rounded shadow-md cursor-grab hover:scale-110 hover:border-amber-400 transition-all p-1">`
                    : `<div draggable="true" ondragstart="dragStart(event, '${val}', 'food')" title="${val}" class="w-12 h-12 flex items-center justify-center bg-slate-700 border border-slate-600 rounded shadow-md cursor-grab hover:scale-110 hover:border-amber-400 transition-all p-1 text-[10px] text-center text-slate-300 font-bold overflow-hidden leading-tight">${val}</div>`;
                dragSourceFood.innerHTML += el;
            });

            // 3. 建立打工獎勵拖曳圖庫 (從 REWARD_ICON 取圖)
            const rewardSet = new Set();
            if (typeof REWARD_ICON !== 'undefined') Object.keys(REWARD_ICON).forEach(k => rewardSet.add(k));
            Object.values(REWARD_MAP).forEach(rList => {
                if(Array.isArray(rList)) rList.forEach(r => rewardSet.add(r));
            });

            const dragSourceReward = document.getElementById('drag-source-reward');
            dragSourceReward.innerHTML = '';
            [...rewardSet].sort().forEach(val => {
                // 💡 修正：移除 window. 前綴，直接讀取全域變數
                let iconUrl = (typeof REWARD_ICON !== 'undefined' && REWARD_ICON[val] && REWARD_ICON[val].url) ? REWARD_ICON[val].url : null;
                let el = iconUrl 
                    ? `<img src="${iconUrl}" title="${val}" draggable="true" ondragstart="dragStart(event, '${val}', 'reward')" class="w-12 h-12 object-contain bg-slate-700 border border-slate-600 rounded shadow-md cursor-grab hover:scale-110 hover:border-emerald-400 transition-all p-1">`
                    : `<div draggable="true" ondragstart="dragStart(event, '${val}', 'reward')" title="${val}" class="w-12 h-12 flex items-center justify-center bg-slate-700 border border-slate-600 rounded shadow-md cursor-grab hover:scale-110 hover:border-emerald-400 transition-all p-1 text-[10px] text-center text-slate-300 font-bold overflow-hidden leading-tight">${val}</div>`;
                dragSourceReward.innerHTML += el;
            });
        }

        // --- 下方為原本已有的表單生成與下載邏輯 (無異動，僅為保持完整性) ---
        function populateDropdown() {
            const selector = document.getElementById('charSelector');
            selector.innerHTML = '<option value="">-- 選擇現有角色 --</option>';
            INITIAL_DATA.forEach(char => {
                const option = document.createElement('option');
                option.value = char.name;
                option.textContent = char.name + (SPINE_MAP[char.name] ? ` (${SPINE_MAP[char.name]})` : '');
                selector.appendChild(option);
            });
        }

            document.getElementById('charSelector').value = "";
            document.getElementById('charForm').reset();
        }

                            <div class="space-y-2 border border-slate-700 p-3 rounded bg-slate-900/50">

                                    <input type="text" id="sk_${lang}_us_n" placeholder="技能名稱" class="w-2/3 bg-slate-900 border border-slate-700 rounded p-2 text-xs">

                                <textarea id="sk_${lang}_us_d" placeholder="技能描述" class="w-full bg-slate-900 border border-slate-700 rounded p-2 h-16 text-xs"></textarea>

                            <div class="space-y-2 border border-slate-700 p-3 rounded bg-slate-900/50">

        function buildAsideInputs() {
            const container = document.getElementById('asideInputsArea');
            let totalHtml = '<div class="grid grid-cols-3 gap-4 mb-6 border border-slate-600 p-3 rounded bg-slate-800">';
            LANGS.forEach(lang => { totalHtml += `<div><label class="block text-xs text-slate-400 mb-1">願像總名稱 (${lang})</label><input type="text" id="as_total_${lang}" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm"></div>`; });
            totalHtml += '</div>';
            container.innerHTML += totalHtml;

            [1, 2, 3].forEach(star => {
                let starHtml = `<div class="bg-slate-800 p-4 rounded border border-slate-600 mb-4">
                    <h4 class="font-bold text-amber-400 border-b border-slate-600 pb-2 mb-4">⭐ 星級 ${star}</h4>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">`;
                
                LANGS.forEach(lang => {
                    starHtml += `<div class="space-y-2 border border-slate-700 p-3 rounded bg-slate-900/50">
                        <h5 class="text-xs font-bold text-slate-300">${LANG_LABELS[lang]}</h5>
                        <input type="text" id="as_${star}_n_${lang}" placeholder="星級名稱" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs">
                        <textarea id="as_${star}_d_${lang}" placeholder="星級描述" class="w-full bg-slate-900 border border-slate-700 rounded p-2 h-16 text-xs"></textarea>
                        <textarea id="as_${star}_e_${lang}" placeholder="Effects (換行分隔)" class="w-full bg-slate-900 border border-slate-700 rounded p-2 h-16 text-xs text-green-200"></textarea>`;
                    
                    if(star === 3) starHtml += `<textarea id="as_3_g_${lang}" placeholder="Global Effects (換行)" class="w-full bg-slate-900 border border-slate-700 rounded p-2 h-12 text-xs text-purple-300"></textarea>`;
                    starHtml += `</div>`;
                });
                starHtml += `</div></div>`;
                container.innerHTML += starHtml;
            });
        }

        function loadCharacterData(zhName) {
            if (!zhName) { clearForm(); return; }
            const spineName = SPINE_MAP[zhName] || "";
            
            document.getElementById('zhName').value = zhName;
            document.getElementById('spineName').value = spineName;
            document.getElementById('jaName').value = (LANG_DICT['ja'] && LANG_DICT['ja'][zhName]) || "";
            document.getElementById('enName').value = (LANG_DICT['en'] && LANG_DICT['en'][zhName]) || "";

            const coreData = INITIAL_DATA.find(c => c.name === zhName) || {};
            ['personality', 'race', 'position', 'job', 'pathVersion', 'releaseDate'].forEach(k => {
                document.getElementById(k).value = coreData[k] || "";
            });

            document.getElementById('cv').value = CV_MAP[zhName] || "";
            document.getElementById('grade').value = GRADE_MAP[zhName] || "";
            document.getElementById('isEldain').checked = ELDAIN_LIST.includes(zhName);
            
            document.getElementById('spine').value = SPINE_MAP[zhName] || "";
            document.getElementById('miniSpine').value = MINI_SPINE[zhName] || "";
            document.getElementById('costume').value = commaArrayToText(COSTUME_MAP[zhName]);
            document.getElementById('sdCostume').value = commaArrayToText(SD_COSTUME[zhName]);
            
            if(FOOD_MAP[spineName]) {
                document.getElementById('foodSuper').value = FOOD_MAP[spineName].super || "";
                document.getElementById('foodSpecial').value = commaArrayToText(FOOD_MAP[spineName].special);
            } else { document.getElementById('foodSuper').value = ""; document.getElementById('foodSpecial').value = ""; }
            
            document.getElementById('rewards').value = arrayToText(REWARD_MAP[spineName]);
            document.getElementById('workUrl').value = WORK_URL[spineName] || "";

            LANGS.forEach(lang => {
                document.getElementById(`intro_${lang}`).value = (INTRO_MAP[lang] && INTRO_MAP[lang][spineName]) || "";
                document.getElementById(`thought_${lang}`).value = (THOUGHT_MAP[lang] && THOUGHT_MAP[lang][spineName]) || "";
                document.getElementById(`letter_${lang}`).value = (LETTER_MAP[lang] && LETTER_MAP[lang][spineName]) || "";
                if(PRESENT_MAP[spineName] && PRESENT_MAP[spineName].name) {
                    document.getElementById(`present_${lang}`).value = PRESENT_MAP[spineName].name[lang] || "";
                } else { document.getElementById(`present_${lang}`).value = ""; }
            });

            const skData = characterSkills.find(s => s.name === zhName) || { skills: {} };
            document.getElementById('skillAttribute').value = skData.attribute || "";
            LANGS.forEach(lang => {
                const sl = skData.skills[lang] || {};
                document.getElementById(`sk_${lang}_na_b`).value = sl.normalAttack?.basic || "";
                document.getElementById(`sk_${lang}_na_e`).value = sl.normalAttack?.enhanced || "";
                document.getElementById(`sk_${lang}_ns_n`).value = sl.normalSkill?.name || "";
                document.getElementById(`sk_${lang}_ns_d`).value = sl.normalSkill?.desc || "";
                document.getElementById(`sk_${lang}_ns_s`).value = arrayToText(sl.normalSkill?.stats);
                document.getElementById(`sk_${lang}_us_n`).value = sl.ultimateSkill?.name || "";
                document.getElementById(`sk_${lang}_us_c`).value = sl.ultimateSkill?.cooldown || "";
                document.getElementById(`sk_${lang}_us_d`).value = sl.ultimateSkill?.desc || "";
                document.getElementById(`sk_${lang}_us_s`).value = arrayToText(sl.ultimateSkill?.stats);
                document.getElementById(`sk_${lang}_ps_d`).value = sl.passiveSkill?.desc || "";
                document.getElementById(`sk_${lang}_ps_s`).value = arrayToText(sl.passiveSkill?.stats);
            });

            const asData = ASIDE_DATA[spineName] || { totalName:{}, stars:{ 1:{}, 2:{}, 3:{} } };
            LANGS.forEach(lang => {
                const asideLang = (lang === 'zh-TW') ? 'zh' : lang; 
                document.getElementById(`as_total_${lang}`).value = asData.totalName?.[asideLang] || "";
                [1,2,3].forEach(star => {
                    const st = asData.stars?.[star] || {};
                    document.getElementById(`as_${star}_n_${lang}`).value = st.name?.[asideLang] || "";
                    document.getElementById(`as_${star}_d_${lang}`).value = st.desc?.[asideLang] || "";
                    document.getElementById(`as_${star}_e_${lang}`).value = arrayToText(st.effects?.[asideLang]);
                    if(star===3) document.getElementById(`as_3_g_${lang}`).value = arrayToText(st.globalEffects?.[asideLang]);
                });
            });
        }

        function updateMemoryData() {
            const zhName = document.getElementById('zhName').value.trim();
            const spineName = document.getElementById('spineName').value.trim();
            if (!zhName || !spineName) { alert("中文名字與 Spine 名稱必填！"); return; }

            LANG_DICT['zh-TW'][zhName] = zhName;
            if(document.getElementById('jaName').value) LANG_DICT['ja'][zhName] = document.getElementById('jaName').value;
            if(document.getElementById('enName').value) LANG_DICT['en'][zhName] = document.getElementById('enName').value;

            let coreIndex = INITIAL_DATA.findIndex(c => c.name === zhName);
            const newCoreData = { name: zhName };
            ['personality', 'race', 'position', 'job', 'pathVersion', 'releaseDate'].forEach(k => {
                if(document.getElementById(k).value) newCoreData[k] = document.getElementById(k).value;
            });
            if(coreIndex >= 0) INITIAL_DATA[coreIndex] = { ...INITIAL_DATA[coreIndex], ...newCoreData };
            else { INITIAL_DATA.push(newCoreData); populateDropdown(); document.getElementById('charSelector').value = zhName; }

            if(document.getElementById('cv').value) CV_MAP[zhName] = document.getElementById('cv').value;
            if(document.getElementById('grade').value) GRADE_MAP[zhName] = document.getElementById('grade').value;
            SPINE_MAP[zhName] = spineName;
            
            const isEldain = document.getElementById('isEldain').checked;
            const eldainIndex = ELDAIN_LIST.indexOf(zhName);
            if (isEldain && eldainIndex === -1) ELDAIN_LIST.push(zhName);
            if (!isEldain && eldainIndex > -1) ELDAIN_LIST.splice(eldainIndex, 1);

            if(document.getElementById('spine').value) SPINE_MAP[zhName] = document.getElementById('spine').value;
            if(document.getElementById('miniSpine').value) MINI_SPINE[zhName] = document.getElementById('miniSpine').value;
            
            const costumeArr = textToCommaArray(document.getElementById('costume').value);
            if(costumeArr.length) COSTUME_MAP[zhName] = costumeArr;
            const sdCostumeArr = textToCommaArray(document.getElementById('sdCostume').value);
            if(sdCostumeArr.length) SD_COSTUME[zhName] = sdCostumeArr;

            const superFood = document.getElementById('foodSuper').value;
            const specialFood = textToCommaArray(document.getElementById('foodSpecial').value);
            if(superFood || specialFood.length) FOOD_MAP[spineName] = { super: superFood, special: specialFood };
            
            const rewards = textToArray(document.getElementById('rewards').value);
            if(rewards.length) REWARD_MAP[spineName] = rewards;
            if(document.getElementById('workUrl').value) WORK_URL[spineName] = document.getElementById('workUrl').value;

            LANGS.forEach(lang => {
                if(!INTRO_MAP[lang]) INTRO_MAP[lang] = {};
                if(!THOUGHT_MAP[lang]) THOUGHT_MAP[lang] = {};
                if(!LETTER_MAP[lang]) LETTER_MAP[lang] = {};
                if(document.getElementById(`intro_${lang}`).value) INTRO_MAP[lang][spineName] = document.getElementById(`intro_${lang}`).value;
                if(document.getElementById(`thought_${lang}`).value) THOUGHT_MAP[lang][spineName] = document.getElementById(`thought_${lang}`).value;
                if(document.getElementById(`letter_${lang}`).value) LETTER_MAP[lang][spineName] = document.getElementById(`letter_${lang}`).value;
                const pres = document.getElementById(`present_${lang}`).value;
                if(pres) {
                    if(!PRESENT_MAP[spineName]) PRESENT_MAP[spineName] = { name: {} };
                    if(!PRESENT_MAP[spineName].name) PRESENT_MAP[spineName].name = {};
                    PRESENT_MAP[spineName].name[lang] = pres;
                }
            });

            let skIndex = characterSkills.findIndex(s => s.name === zhName);
            let skillObj = skIndex >= 0 ? characterSkills[skIndex] : { name: zhName, skills: {} };
            skillObj.attribute = document.getElementById('skillAttribute').value;
            LANGS.forEach(lang => {
                skillObj.skills[lang] = {
                    normalAttack: { basic: document.getElementById(`sk_${lang}_na_b`).value, enhanced: document.getElementById(`sk_${lang}_na_e`).value },
                    normalSkill: { name: document.getElementById(`sk_${lang}_ns_n`).value, desc: document.getElementById(`sk_${lang}_ns_d`).value, stats: textToArray(document.getElementById(`sk_${lang}_ns_s`).value) },
                    ultimateSkill: { name: document.getElementById(`sk_${lang}_us_n`).value, desc: document.getElementById(`sk_${lang}_us_d`).value, cooldown: document.getElementById(`sk_${lang}_us_c`).value, stats: textToArray(document.getElementById(`sk_${lang}_us_s`).value) },
                    passiveSkill: { desc: document.getElementById(`sk_${lang}_ps_d`).value, stats: textToArray(document.getElementById(`sk_${lang}_ps_s`).value) }
                };
            });
            if(skIndex >= 0) characterSkills[skIndex] = skillObj; else characterSkills.push(skillObj);

            let asObj = ASIDE_DATA[spineName] || { asideIcon: "", totalName: {}, stars: { 1:{icon:""}, 2:{icon:""}, 3:{icon:""} } };
            if(!asObj.totalName) asObj.totalName = {};
            if(!asObj.stars) asObj.stars = { 1:{icon:""}, 2:{icon:""}, 3:{icon:""} };
            LANGS.forEach(lang => {
                const asideLang = (lang === 'zh-TW') ? 'zh' : lang; 
                if(document.getElementById(`as_total_${lang}`).value) asObj.totalName[asideLang] = document.getElementById(`as_total_${lang}`).value;
                [1,2,3].forEach(star => {
                    if(!asObj.stars[star]) asObj.stars[star] = {icon:"", name:{}, desc:{}, effects:{}};
                    if(!asObj.stars[star].name) asObj.stars[star].name = {};
                    if(!asObj.stars[star].desc) asObj.stars[star].desc = {};
                    if(!asObj.stars[star].effects) asObj.stars[star].effects = {};
                    asObj.stars[star].name[asideLang] = document.getElementById(`as_${star}_n_${lang}`).value;
                    asObj.stars[star].desc[asideLang] = document.getElementById(`as_${star}_d_${lang}`).value;
                    asObj.stars[star].effects[asideLang] = textToArray(document.getElementById(`as_${star}_e_${lang}`).value);
                    if(star===3) {
                        if(!asObj.stars[3].globalEffects) asObj.stars[3].globalEffects = {};
                        asObj.stars[3].globalEffects[asideLang] = textToArray(document.getElementById(`as_3_g_${lang}`).value);
                    }
                });
            });
            ASIDE_DATA[spineName] = asObj;

            buildHelperUI(); 

            const msg = document.getElementById('statusMsg');
            msg.classList.remove('hidden');
            setTimeout(() => msg.classList.add('hidden'), 5000);
        }

        function generateCoreData() {
            return `const LANG_DICT = ${JSON.stringify(LANG_DICT, null, 4)};\n\n` +
                   `const INITIAL_DATA = ${JSON.stringify(INITIAL_DATA, null, 4)};\n\n` +
                   `const CV_MAP = ${JSON.stringify(CV_MAP, null, 4)};\n\n` +
                   `const GRADE_MAP = ${JSON.stringify(GRADE_MAP, null, 4)};\n\n` +
                   `const ELDAIN_LIST = ${JSON.stringify(ELDAIN_LIST, null, 4)};\n\n` +
                   `const FOOD_MAP = ${JSON.stringify(FOOD_MAP, null, 4)};\n\n` +
                   `const REWARD_MAP = ${JSON.stringify(REWARD_MAP, null, 4)};\n\n` +
                   `const WORK_URL = ${JSON.stringify(WORK_URL, null, 4)};\n\n` +
                   `const SPINE_MAP = ${JSON.stringify(SPINE_MAP, null, 4)};\n\n` +
                   `const COSTUME_MAP = ${JSON.stringify(COSTUME_MAP, null, 4)};\n\n` +
                   `const SD_COSTUME = ${JSON.stringify(SD_COSTUME, null, 4)};\n\n` +
                   `const MINI_SPINE = ${JSON.stringify(MINI_SPINE, null, 4)};\n`;
        }

        function generateCollectiblesData() {
            return `const PRESENT_MAP = ${JSON.stringify(PRESENT_MAP, null, 4)};\n\n` +
                   `const THOUGHT_MAP = ${JSON.stringify(THOUGHT_MAP, null, 4)};\n\n` +
                   `const LETTER_MAP = ${JSON.stringify(LETTER_MAP, null, 4)};\n`;
        }

        function generateDataMap(varName, dataObj) {
            return `const ${varName} = ${JSON.stringify(dataObj, null, 4)};\n`;
        }

        function downloadJS(filename, content) {
            const blob = new Blob(['\ufeff' + content], { type: 'text/javascript;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
