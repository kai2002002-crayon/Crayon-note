<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色動態展示器</title>
    //ver 1.0
    
    <script src="data_core.js"></script>
    <script src="data_intro.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link id="dynamicFavicon" rel="icon" href="https://i.postimg.cc/mkfSTq5k/Favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-player@4.1.23/dist/spine-player.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-player@4.1.23/dist/iife/spine-player.min.js"></script>

    <script>
        tailwind.config = { darkMode: 'class', }
        const isDarkMode = localStorage.getItem('theme') === 'dark' || 
                           (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDarkMode) { document.documentElement.classList.add('dark'); }
        window.currentLang = localStorage.getItem('user_lang') || "zh-TW";
    </script>

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        
        /* 隱藏原生選單，並強制畫布填滿容器避免塌陷 */
        .spine-player-controls { display: none !important; }
        #spineCanvasContainer canvas {
            width: 100% !important; height: 100% !important;
            display: block !important; touch-action: none;
        }
        
        .spine-player-loading-custom {
            position: absolute; top: 50%; left: 50%;
            width: 80px; height: 80px; margin: -40px 0 0 -40px;
            background: url('https://i.postimg.cc/qvjNxZzg/golden-crayon.png') no-repeat center center;
            background-size: contain;
            animation: crayonFloat 1.5s ease-in-out infinite;
            z-index: 10;
        }
        @keyframes crayonFloat {
            0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 5px rgba(251, 191, 36, 0.5)); }
            50% { transform: translateY(-10px) scale(1.05); filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.9)); }
        }

        /* 捲動條美化 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background-color: #475569; }

        .collapsible-content { transition: max-height 0.3s ease-out, opacity 0.3s ease-out; overflow: hidden; }
        .collapsed { max-height: 0; opacity: 0; margin-top: 0 !important; overflow: hidden;}
        
        @keyframes raceBgPan {
            0%   { background-position: 0px 0px; }
            25%  { background-position: -200px 200px; }
            50%  { background-position: 0px 400px; }
            75%  { background-position: 200px 200px; }
            100% { background-position: 0px 0px; }
        }
        .animated-bg {
            background-repeat: repeat !important;
            background-size: 200px !important; 
            animation: raceBgPan 40s linear infinite;
        }
        .dark .animated-bg { opacity: 0.8; }
        
        .custom-select-btn { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="p-2 sm:p-6 bg-[#fcf8f2] dark:bg-slate-900 text-gray-800 dark:text-gray-200 min-h-screen transition-colors duration-300">

    <div class="max-w-[1400px] mx-auto space-y-4">
        
        <header class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md p-4 sm:p-5 rounded-2xl shadow-md border-4 border-amber-400 dark:border-slate-600 flex justify-between items-center relative z-10">
            <div>
                <h1 class="text-xl sm:text-2xl font-black text-amber-950 dark:text-amber-400 mb-0.5">🎭 角色動態展示</h1>
                <p class="text-xs sm:text-sm text-amber-800 dark:text-gray-400">大廳互動與戰鬥小人完美融合</p>
            </div>
            <button onclick="window.close()" class="px-3 py-1.5 sm:px-4 sm:py-2 text-xs sm:text-sm bg-amber-500 text-white font-bold rounded-xl shadow hover:bg-amber-600 transition shrink-0">
                ⬅️ 返回
            </button>
        </header>

        <section class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md p-4 sm:p-5 rounded-2xl shadow-md border border-amber-200 dark:border-slate-700 transition-all">
            <div class="flex justify-between items-center mb-3 border-b border-amber-200 dark:border-slate-700 pb-2">
                <h2 class="text-base sm:text-lg font-bold text-amber-900 dark:text-amber-400">👥 選擇角色</h2>
                <button id="toggleAllCharBtn" onclick="toggleAllCharacters()" class="px-3 py-1 text-xs font-bold bg-amber-100 dark:bg-slate-700 text-amber-800 dark:text-gray-300 rounded-lg hover:bg-amber-200 dark:hover:bg-slate-600 transition shadow-sm">
                    顯示全部 🔽
                </button>
            </div>
            <div id="charGridContainer" class="space-y-3 collapsible-content collapsed" style="max-height: 0px; opacity: 0;">
            </div>
        </section>

        <section id="spineViewerSection" class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md p-4 sm:p-5 rounded-2xl shadow-md border-4 border-amber-400 dark:border-slate-600 transition-all">
            
            <div class="flex items-center gap-3 mb-4 border-b border-amber-100 dark:border-slate-700 pb-3">
                <img id="activeCharIcon" src="" class="w-10 h-10 sm:w-12 sm:h-12 rounded-lg border-2 border-amber-400 shadow-sm object-cover bg-white dark:bg-slate-700 hidden">
                <div>
                    <h2 id="activeCharName" class="text-lg sm:text-xl font-black text-amber-900 dark:text-amber-300">請先選擇角色</h2>
                    </div>
            </div>

            <div class="flex flex-col gap-3 min-w-0 relative z-10 w-full lg:w-3/4 mx-auto">
                
                <div id="spineCanvasContainer" class="w-full h-[60vh] sm:h-[600px] rounded-xl border-2 border-dashed border-amber-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900/50 relative overflow-hidden flex items-center justify-center cursor-move">
                    <div class="text-gray-400 font-bold tracking-widest">等待載入...</div>
                </div>

                <div id="playerControls" class="bg-amber-50 dark:bg-slate-700/50 p-3 rounded-xl border border-amber-200 dark:border-slate-600 flex flex-col gap-3 opacity-50 pointer-events-none transition-opacity">
                    
                    <div class="flex items-center justify-between gap-2 flex-wrap">
                        <div class="flex items-center gap-2">
                            <button id="btnPlayPause" onclick="togglePlay()" class="w-9 h-9 flex items-center justify-center bg-amber-500 text-white rounded-lg shadow hover:bg-amber-600 transition" title="播放/暫停">⏸️</button>
                            <div class="flex bg-white dark:bg-slate-800 rounded-lg border border-gray-200 dark:border-slate-600 p-1 shadow-inner">
                                <button onclick="setSpeed(0.5)" class="speed-btn px-2 py-1 text-[10px] sm:text-xs font-bold rounded hover:bg-amber-100 dark:hover:bg-slate-600 text-gray-700 dark:text-gray-300">0.5x</button>
                                <button onclick="setSpeed(1)" class="speed-btn px-2 py-1 text-[10px] sm:text-xs font-bold rounded bg-amber-200 dark:bg-slate-600 text-amber-900 dark:text-white">1.0x</button>
                                <button onclick="setSpeed(2)" class="speed-btn px-2 py-1 text-[10px] sm:text-xs font-bold rounded hover:bg-amber-100 dark:hover:bg-slate-600 text-gray-700 dark:text-gray-300">2.0x</button>
                                <button onclick="setSpeed(3)" class="speed-btn px-2 py-1 text-[10px] sm:text-xs font-bold rounded hover:bg-amber-100 dark:hover:bg-slate-600 text-gray-700 dark:text-gray-300">3.0x</button>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button id="btnModeSwitch" onclick="toggleViewerMode()" class="px-3 py-1.5 bg-blue-500 hover:bg-blue-600 text-white text-xs sm:text-sm font-bold rounded-lg shadow transition-colors whitespace-nowrap">
                                🔄 模式: 大廳
                            </button>
                            <select id="costumeSelect" onchange="changeSpineCostume(this.value)" class="bg-white dark:bg-slate-800 border border-gray-300 dark:border-slate-600 text-xs sm:text-sm font-bold rounded-lg px-2 py-1.5 outline-none focus:ring-2 focus:ring-amber-500 min-w-[100px]">
                                <option value="">服裝</option>
                            </select>
                        </div>
                    </div>

                    <div class="flex justify-between w-full relative z-[100] items-center gap-2">
                        
                        <div class="relative w-[130px] sm:w-[150px]" id="animDropdownWrapper">
                            <button onclick="toggleCustomSelect('animList')" class="custom-select-btn w-full bg-white dark:bg-slate-800 border border-gray-300 dark:border-slate-600 text-[10px] sm:text-xs font-bold rounded-lg px-2 py-1.5 flex justify-between items-center text-left shadow-sm">
                                <span id="animSelectText" class="truncate text-amber-900 dark:text-gray-200">選擇動作</span>
                                <span class="ml-1 text-gray-400 shrink-0 text-[10px]">▼</span>
                            </button>
                            <div id="animList" class="hidden absolute bottom-[calc(100%+6px)] left-0 w-[160px] sm:w-[200px] bg-white dark:bg-slate-800 border border-amber-300 dark:border-slate-600 rounded-lg shadow-2xl max-h-[160px] overflow-y-auto flex-col py-1 z-[110]"></div>
                        </div>

                        <div class="flex items-center gap-2">
                            <div class="relative w-[130px] sm:w-[150px]" id="slotDropdownWrapper">
                                <button onclick="toggleCustomSelect('slotList')" class="custom-select-btn w-full bg-white dark:bg-slate-800 border border-gray-300 dark:border-slate-600 text-[10px] sm:text-xs font-bold rounded-lg px-2 py-1.5 flex justify-between items-center text-left shadow-sm">
                                    <span class="truncate text-amber-900 dark:text-gray-200">🧩 外觀插槽</span>
                                    <span class="ml-1 text-gray-400 shrink-0 text-[10px]">▼</span>
                                </button>
                                <div id="slotList" class="hidden absolute bottom-[calc(100%+6px)] right-0 w-[180px] sm:w-[220px] bg-white dark:bg-slate-800 border border-amber-300 dark:border-slate-600 rounded-lg shadow-2xl max-h-[160px] overflow-y-auto flex-col z-[110]">
                                    <div class="flex gap-1 p-1.5 border-b border-gray-100 dark:border-slate-700 sticky top-0 bg-gray-50 dark:bg-slate-800 z-20">
                                        <button onclick="toggleAllSlots(true, event)" class="flex-1 py-1 text-[10px] font-bold bg-white dark:bg-slate-700 hover:bg-amber-100 dark:hover:bg-slate-600 rounded border transition shadow-sm text-gray-700 dark:text-gray-200">全顯</button>
                                        <button onclick="toggleAllSlots(false, event)" class="flex-1 py-1 text-[10px] font-bold bg-white dark:bg-slate-700 hover:bg-amber-100 dark:hover:bg-slate-600 rounded border transition shadow-sm text-gray-700 dark:text-gray-200">全隱</button>
                                    </div>
                                    <div id="slotsContainerInner" class="flex flex-col pb-1"></div>
                                </div>
                            </div>

                            <button onclick="resetCamera()" class="px-3 py-1.5 bg-slate-600 hover:bg-slate-700 text-white text-[10px] sm:text-xs font-bold rounded-lg shadow transition-colors whitespace-nowrap shrink-0 h-full">
                                🔄 鏡頭
                            </button>
                        </div>
                        
                    </div>
            </div>
        </section>

    </div>

    <script>
        function getI18n(key) {
            if (!key) return key;
            const safeLang = (typeof LANG_DICT !== 'undefined' && LANG_DICT[window.currentLang]) ? window.currentLang : 'zh-TW';
            if (typeof LANG_DICT !== 'undefined' && LANG_DICT[safeLang] && LANG_DICT[safeLang][key]) return LANG_DICT[safeLang][key];
            return key; 
        }

        const personalityColors = { 
            "天真": "border-green-400 text-green-400", 
            "冷靜": "border-blue-400 text-blue-400", 
            "狂亂": "border-red-400 text-red-400", 
            "活潑": "border-yellow-400 text-yellow-400", 
            "憂鬱": "border-purple-400 text-purple-400" 
        };

        let globalPlayer = null;
        let slotVisibilityMap = {};
        
        // 核心狀態變數
        let activeCharData = null; 
        let currentMode = 'lobby'; // 'lobby' | 'battle'
        let currentZoom = 1.0;
        let isDragging = false;
        let lastMouseX = 0, lastMouseY = 0;
        
        // 互動拉扯專用變數 (僅大廳生效)
        let hitZoneOnDown = null;
        let activeFaceBone = null; 
        let initialBoneX = 0, initialBoneY = 0;
        let dragDistance = 0;
        let startX = 0, startY = 0;

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#animDropdownWrapper')) {
                document.getElementById('animList').classList.add('hidden');
                document.getElementById('animList').classList.remove('flex');
            }
            if (!e.target.closest('#slotDropdownWrapper')) {
                document.getElementById('slotList').classList.add('hidden');
                document.getElementById('slotList').classList.remove('flex');
            }
        });

        function toggleCustomSelect(listId) {
            const list = document.getElementById(listId);
            if (list.classList.contains('hidden')) {
                if (listId === 'animList') {
                    document.getElementById('slotList').classList.add('hidden');
                    document.getElementById('slotList').classList.remove('flex');
                } else {
                    document.getElementById('animList').classList.add('hidden');
                    document.getElementById('animList').classList.remove('flex');
                }
                list.classList.remove('hidden'); list.classList.add('flex');
            } else {
                list.classList.add('hidden'); list.classList.remove('flex');
            }
        }

        function toggleAllCharacters() {
            const container = document.getElementById('charGridContainer');
            const btn = document.getElementById('toggleAllCharBtn');
            if (container.classList.contains('collapsed')) {
                container.classList.remove('collapsed');
                container.style.maxHeight = '2000px';
                container.style.opacity = '1';
                btn.innerHTML = '隱藏全部 🔼';
            } else {
                container.classList.add('collapsed');
                container.style.maxHeight = '0px';
                container.style.opacity = '0';
                btn.innerHTML = '顯示全部 🔽';
            }
        }

        function togglePersonalityGroup(id, btnId) {
            const group = document.getElementById(id);
            const btn = document.getElementById(btnId);
            if (group.classList.contains('collapsed')) {
                group.classList.remove('collapsed');
                group.style.maxHeight = '1000px';
                group.style.opacity = '1';
                btn.innerHTML = btn.innerHTML.replace('🔽', '🔼');
            } else {
                group.classList.add('collapsed');
                group.style.maxHeight = '0px';
                group.style.opacity = '0';
                btn.innerHTML = btn.innerHTML.replace('🔼', '🔽');
            }
        }

        // 預載圖片以加快後續顯示
        function preloadIcons() {
            if (typeof INITIAL_DATA === 'undefined') return;
            INITIAL_DATA.forEach(c => {
                const iconUrl = typeof IMAGE_MAP !== 'undefined' ? IMAGE_MAP[`avatar_${c.name}`] : '';
                if (iconUrl) { const img = new Image(); img.src = iconUrl; }
            });
        }

        function initCharacterGrid() {
            preloadIcons(); // 背景預載

            const container = document.getElementById('charGridContainer');
            if (typeof INITIAL_DATA === 'undefined' || !INITIAL_DATA) return;

            const personalities = ["天真", "冷靜", "狂亂", "活潑", "憂鬱"];
            
            personalities.forEach((p, index) => {
                const chars = INITIAL_DATA.filter(c => c.personality === p);
                if (chars.length === 0) return;

                const borderTextClass = personalityColors[p] || "border-gray-400 text-gray-400";
                const borderClass = borderTextClass.split(' ')[0];

                const groupId = `group_${index}`;
                const btnId = `btn_${index}`;

                const row = document.createElement('div');
                row.className = "flex flex-col bg-amber-50/50 dark:bg-slate-800/50 p-2 rounded-xl border border-dashed border-amber-200 dark:border-slate-700";
                
                const header = document.createElement('div');
                header.className = "flex justify-between items-center cursor-pointer hover:bg-amber-100/50 dark:hover:bg-slate-700/50 p-1.5 rounded-lg transition";
                header.onclick = () => togglePersonalityGroup(groupId, btnId);
                header.innerHTML = `
                    <h3 class="text-xs sm:text-sm font-black text-amber-700 dark:text-amber-500 border-l-4 ${borderClass} pl-2">🎭 性格: ${p}</h3>
                    <span id="${btnId}" class="text-xs text-gray-400">🔼</span>
                `;
                
                const iconContainer = document.createElement('div');
                iconContainer.id = groupId;
                iconContainer.className = "flex flex-wrap gap-1.5 pt-2 pl-1 collapsible-content";
                iconContainer.style.maxHeight = "1000px";
                iconContainer.style.opacity = "1";

                chars.forEach(c => {
                    const iconUrl = typeof IMAGE_MAP !== 'undefined' ? IMAGE_MAP[`avatar_${c.name}`] : '';
                    const spineName = typeof SPINE_MAP !== 'undefined' ? SPINE_MAP[c.name] : c.name;
                    const displayName = getI18n(c.name);

                    const btn = document.createElement('button');
                    btn.className = "group flex flex-col items-center gap-0.5 transition-transform hover:scale-110 active:scale-95 w-12 sm:w-14";
                    btn.onclick = () => selectCharacter(c, spineName, iconUrl);

                    btn.innerHTML = `
                        <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl border-2 ${borderClass} overflow-hidden bg-white dark:bg-slate-700 shadow-sm group-hover:shadow-md transition-all">
                            ${iconUrl ? `<img src="${iconUrl}" class="w-full h-full object-cover">` : `<span class="flex h-full items-center justify-center font-bold text-xs">${c.name.charAt(0)}</span>`}
                        </div>
                        <span class="text-[9px] sm:text-[10px] font-bold text-gray-600 dark:text-gray-300 group-hover:text-amber-600 dark:group-hover:text-amber-400 text-center w-full truncate leading-tight">${displayName}</span>
                    `;
                    iconContainer.appendChild(btn);
                });

                row.appendChild(header);
                row.appendChild(iconContainer);
                container.appendChild(row);
            });
        }

        function applyRaceBackground(charName) {
            const container = document.getElementById('spineCanvasContainer');
            const char = INITIAL_DATA.find(c => c.name === charName);
            
            if (char && typeof SPINE_BACKGROUNDS !== 'undefined' && SPINE_BACKGROUNDS[char.race]) {
                container.style.backgroundImage = `url('${SPINE_BACKGROUNDS[char.race]}')`;
                container.classList.add('animated-bg');
            } else {
                container.style.backgroundImage = 'none';
                container.classList.remove('animated-bg');
            }
        }

        // 取得對應模式的服裝清單
        function getCostumeList(charName, mode) {
            if (mode === 'lobby') {
                return (typeof COSTUME_MAP !== 'undefined' && COSTUME_MAP[charName]) ? COSTUME_MAP[charName] : [];
            } else {
                // SD 戰鬥版的資料來源 (若無 SD_COSTUME，就試著用標準的)
                return (typeof SD_COSTUME !== 'undefined' && SD_COSTUME[charName]) ? SD_COSTUME[charName] : 
                       ((typeof COSTUME_MAP !== 'undefined' && COSTUME_MAP[charName]) ? COSTUME_MAP[charName] : []);
            }
        }

        function toggleViewerMode() {
            if (!activeCharData) return;
            currentMode = currentMode === 'lobby' ? 'battle' : 'lobby';
            
            const btn = document.getElementById('btnModeSwitch');
            btn.innerHTML = currentMode === 'lobby' ? '🔄 模式: 大廳' : '⚔️ 模式: 戰鬥';
            btn.className = currentMode === 'lobby' 
                ? "px-3 py-1.5 bg-blue-500 hover:bg-blue-600 text-white text-xs sm:text-sm font-bold rounded-lg shadow transition-colors whitespace-nowrap"
                : "px-3 py-1.5 bg-red-500 hover:bg-red-600 text-white text-xs sm:text-sm font-bold rounded-lg shadow transition-colors whitespace-nowrap";

            // 重新整理服裝選單並載入 (會自動 Fallback)
            refreshCostumeDropdownAndLoad();
        }

        function selectCharacter(charObj, spineName, iconUrl) {
            activeCharData = { ...charObj, spineName: spineName };
            document.getElementById('spineViewerSection').classList.remove('hidden');
            
            const iconEl = document.getElementById('activeCharIcon');
            iconEl.src = iconUrl;
            iconEl.classList.remove('hidden');
            document.getElementById('activeCharName').innerText = getI18n(charObj.name);

            // 重置狀態
            document.getElementById('animList').classList.add('hidden');
            document.getElementById('slotList').classList.add('hidden');
            slotVisibilityMap = {};
            
            applyRaceBackground(charObj.name);
            document.getElementById('spineViewerSection').scrollIntoView({ behavior: 'smooth', block: 'start' });

            refreshCostumeDropdownAndLoad();
        }

        function refreshCostumeDropdownAndLoad() {
            const costumes = getCostumeList(activeCharData.name, currentMode);
            const fallbackKey = costumes.length > 0 ? costumes[0] : activeCharData.spineName;
            
            // 嘗試保留當前選擇的服裝，如果新模式找不到，就用 fallbackKey
            const selectEl = document.getElementById('costumeSelect');
            const currentSelection = selectEl.value;
            let targetCostume = costumes.includes(currentSelection) ? currentSelection : fallbackKey;

            selectEl.innerHTML = '';
            if (costumes.length > 0) {
                costumes.forEach((costume, idx) => {
                    const opt = document.createElement('option');
                    opt.value = costume;
                    opt.text = idx === 0 ? "預設服裝" : `服裝 ${idx}`;
                    if (costume === targetCostume) opt.selected = true;
                    selectEl.appendChild(opt);
                });
            } else {
                const opt = document.createElement('option');
                opt.value = targetCostume;
                opt.text = "預設模型";
                selectEl.appendChild(opt);
            }

            loadSpine(activeCharData.spineName, targetCostume, currentMode);
        }

        function changeSpineCostume(costumeKey) {
            if(!costumeKey || !activeCharData) return;
            loadSpine(activeCharData.spineName, costumeKey, currentMode);
        }

        // 核心載入：根據模式設定路徑與參數
        function loadSpine(baseFolderKey, costumeKey, mode) {
            const container = document.getElementById('spineCanvasContainer');
            
            if (globalPlayer) { globalPlayer.dispose(); globalPlayer = null; }

            container.innerHTML = '<div class="spine-player-loading-custom"></div>';
            document.getElementById('playerControls').classList.add('opacity-50', 'pointer-events-none');
            document.getElementById('slotsContainerInner').innerHTML = '<div class="p-3 text-center text-xs font-bold text-gray-400">讀取資料中...</div>';

            currentZoom = mode === 'battle' ? 2.0 : 1.0; // 戰鬥版預設大2倍
            
            const skelUrl = mode === 'lobby' 
                ? `./spine_assets/${baseFolderKey}/${costumeKey}.skel.bytes` 
                : `./spine_sd_assets/${costumeKey}.skel.bytes`;
                
            const atlasUrl = mode === 'lobby' 
                ? `./spine_assets/${baseFolderKey}/${costumeKey}.atlas.txt`
                : `./spine_sd_assets/${costumeKey}.atlas.txt`;

            // 大廳使用 premultipliedAlpha: true，戰鬥(SD)用 false
            const isPma = mode === 'lobby';
            const baseViewport = mode === 'lobby' ? { x: -400, y: 0, width: 800, height: 1000 } : { x: -500, y: -150, width: 1500, height: 3000 };

            globalPlayer = new spine.SpinePlayer(container, {
                skelUrl: skelUrl,
                atlasUrl: atlasUrl,
                premultipliedAlpha: isPma,
                backgroundColor: "#00000000", 
                alpha: true,
                showControls: false,
                showLoading: false, 
                viewport: { ...baseViewport },

                success: function (player) {
                    const loader = container.querySelector('.spine-player-loading-custom');
                    if (loader) loader.remove();

                    document.getElementById('playerControls').classList.remove('opacity-50', 'pointer-events-none');
                    setSpeed(1);

                    const skins = player.skeleton.data.skins;
                    if (skins && skins.length > 0) {
                        const targetSkin = skins.find(s => s.name === 'Normal') || skins.find(s => s.name !== 'default') || skins[0];
                        if (targetSkin) {
                            player.skeleton.setSkinByName(targetSkin.name);
                        }
                    }
                    
                    player.skeleton.scaleX = currentZoom;
                    player.skeleton.scaleY = currentZoom;
                    player.skeleton.setToSetupPose(); 
                    player.skeleton.updateWorldTransform();

                    buildAnimationDropdown(player);
                    buildSlotsPanel(player);

                    // 延遲喚醒
                    setTimeout(() => {
                        const anims = player.skeleton.data.animations.map(a => a.name);
                        const fallbackAnim = mode === 'lobby' ? 'Idle_1' : 'Idle';
                        let startAnim = anims.includes(fallbackAnim) ? fallbackAnim : (anims.includes('idle') ? 'idle' : anims[0]);
                        
                        if (startAnim) {
                            player.animationState.setAnimation(0, startAnim, true);
                            document.getElementById('animSelectText').innerText = startAnim;
                            document.getElementById('btnPlayPause').innerText = '⏸️';
                        }
                        player.play();
                        setupComplexInteractions(player, container);
                        window.dispatchEvent(new Event('resize'));
                    }, 50);
                },
                error: function (player, reason) {
                    container.innerHTML = `<div class="text-red-500 font-bold text-sm text-center p-4">載入失敗：${mode === 'lobby' ? '大廳' : '戰鬥'}檔案可能不存在</div>`;
                }
            });
        }

        // --- 播放器控制與 UI 刷新 ---
        function togglePlay() {
            if (!globalPlayer) return;
            if (globalPlayer.paused) {
                globalPlayer.play(); document.getElementById('btnPlayPause').innerText = '⏸️';
            } else {
                globalPlayer.pause(); document.getElementById('btnPlayPause').innerText = '▶️';
            }
        }

        function setSpeed(speed) {
            if (!globalPlayer) return;
            globalPlayer.speed = speed; // 統一使用 speed 屬性
            document.querySelectorAll('.speed-btn').forEach(btn => {
                if (btn.innerText.includes(speed.toFixed(1))) {
                    btn.className = "speed-btn px-2 py-1 text-[10px] sm:text-xs font-bold rounded bg-amber-200 dark:bg-slate-600 text-amber-900 dark:text-white";
                } else {
                    btn.className = "speed-btn px-2 py-1 text-[10px] sm:text-xs font-bold rounded hover:bg-amber-100 dark:hover:bg-slate-600 text-gray-700 dark:text-gray-300";
                }
            });
        }

        function buildAnimationDropdown(player) {
            const animList = document.getElementById('animList');
            animList.innerHTML = '';
            const anims = player.skeleton.data.animations.map(a => a.name).sort();
            
            anims.forEach(animName => {
                const btn = document.createElement('button');
                btn.className = "text-left px-3 py-2.5 text-[11px] sm:text-xs hover:bg-amber-100 dark:hover:bg-slate-700 w-full truncate transition-colors text-gray-700 dark:text-gray-300 flex-shrink-0 border-b border-gray-50 dark:border-slate-700/50";
                btn.innerText = animName;
                btn.onclick = (e) => {
                    e.stopPropagation(); 
                    player.animationState.setAnimation(0, animName, true);
                    document.getElementById('animSelectText').innerText = animName;
                    animList.classList.add('hidden'); animList.classList.remove('flex');
                    player.play(); document.getElementById('btnPlayPause').innerText = '⏸️';
                    player.skeleton.updateWorldTransform();
                };
                animList.appendChild(btn);
            });
        }

        function buildSlotsPanel(player) {
            const container = document.getElementById('slotsContainerInner');
            container.innerHTML = '';
            slotVisibilityMap = {};
            
            const slots = player.skeleton.slots.filter(s => s.attachment != null);

            slots.forEach((slot) => {
                const slotName = slot.data.name;
                slotVisibilityMap[slotName] = true;
                const originalColor = { r: slot.color.r, g: slot.color.g, b: slot.color.b };

                const item = document.createElement('label');
                item.className = "flex items-center gap-2 px-3 py-2 lg:py-1.5 hover:bg-red-50 dark:hover:bg-slate-700 cursor-pointer transition-colors border-b border-gray-50 dark:border-slate-700/50 group";
                
                const checkbox = document.createElement('input');
                checkbox.type = "checkbox";
                checkbox.checked = true;
                checkbox.className = "w-3.5 h-3.5 text-amber-500 rounded focus:ring-amber-500 border-gray-300";
                checkbox.onchange = (e) => { toggleSlot(slotName, e.target.checked); };

                const span = document.createElement('span');
                span.className = "text-[10px] sm:text-xs font-medium text-gray-700 dark:text-gray-300 truncate group-hover:text-red-600 transition-colors";
                span.innerText = slotName;

                item.addEventListener('click', (e) => e.stopPropagation());
                item.onmouseenter = () => { slot.color.r = 1; slot.color.g = 0; slot.color.b = 0; };
                item.onmouseleave = () => { slot.color.r = originalColor.r; slot.color.g = originalColor.g; slot.color.b = originalColor.b; };

                item.appendChild(checkbox);
                item.appendChild(span);
                container.appendChild(item);
            });

            if(!globalPlayer.config.injectedUpdate) {
                const origUpdate = player.skeleton.updateWorldTransform;
                player.skeleton.updateWorldTransform = function() {
                    origUpdate.call(player.skeleton);
                    const skelSlots = player.skeleton.slots;
                    for(let i = 0; i < skelSlots.length; i++) {
                        const s = skelSlots[i];
                        if (slotVisibilityMap[s.data.name] === false) s.color.a = 0;
                    }
                };
                globalPlayer.config.injectedUpdate = true;
            }
        }

        function toggleSlot(slotName, isVisible) {
            slotVisibilityMap[slotName] = isVisible;
            if (globalPlayer && globalPlayer.skeleton) {
                const s = globalPlayer.skeleton.findSlot(slotName);
                if (s) s.color.a = isVisible ? 1 : 0;
            }
        }

        function toggleAllSlots(show, event) {
            if(event) event.stopPropagation();
            const checkboxes = document.querySelectorAll('#slotsContainerInner input[type="checkbox"]');
            checkboxes.forEach(cb => {
                cb.checked = show;
                const slotName = cb.nextElementSibling.innerText;
                slotVisibilityMap[slotName] = show;
                if (globalPlayer && globalPlayer.skeleton) {
                    const s = globalPlayer.skeleton.findSlot(slotName);
                    if (s) s.color.a = show ? 1 : 0;
                }
            });
        }

        function resetCamera() {
            if (!globalPlayer || !globalPlayer.skeleton) return;
            currentZoom = currentMode === 'battle' ? 2.0 : 1.0;
            globalPlayer.skeleton.scaleX = currentZoom;
            globalPlayer.skeleton.scaleY = currentZoom;
            globalPlayer.skeleton.x = 0;
            globalPlayer.skeleton.y = 0;
            // 恢復大廳特定的 y 軸錨點偏移
            if(currentMode === 'lobby') {
                globalPlayer.skeleton.y = 600 * (1 - currentZoom);
            }
        }

        // --- 🌟 共用互動與拖曳邏輯 ---
        function setupComplexInteractions(player, container) {
            const canvas = container.querySelector('canvas');
            if (!canvas) return;
            canvas.style.touchAction = 'none';

            // 清除之前的監聽器防重複綁定 (SpinePlayer dispose 已清理大部分)
            
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomDelta = e.deltaY < 0 ? 0.1 : -0.1;
                currentZoom = Math.min(Math.max(currentZoom + zoomDelta, 0.3), 4.0); 
                player.skeleton.scaleX = currentZoom;
                player.skeleton.scaleY = currentZoom;
                // 大廳縮放錨點微調，戰鬥不需要
                if (currentMode === 'lobby') player.skeleton.y = 600 * (1 - currentZoom);
            }, { passive: false });

            // 抓取大廳點擊區塊 (戰鬥模式無效)
            function getLobbyHitZone(mouseX, mouseY) {
                if(currentMode !== 'lobby') return null;
                const rect = canvas.getBoundingClientRect();
                let clickedPart = null;
                let minDistance = Infinity;
                const hitZones = [
                    { name: "頭部", bones: ["Character_Pat", "S3_Head", "S1_Head", "Head"], radius: 220 }, 
                    { name: "身體", bones: ["Character_Tickle", "S3_Body_1", "S1_Body_1", "Body_1"], radius: 150 }
                ];
                hitZones.forEach(zone => {
                    let targetBone = null;
                    for (let bName of zone.bones) { targetBone = player.skeleton.findBone(bName); if (targetBone) break; }
                    if (targetBone) {
                        const boneCanvasX = ((targetBone.worldX - player.viewport.x) / player.viewport.width) * rect.width;
                        const boneCanvasY = rect.height - ((targetBone.worldY - player.viewport.y) / player.viewport.height) * rect.height;
                        const distance = Math.hypot(mouseX - boneCanvasX, mouseY - boneCanvasY);
                        const scaledRadius = (zone.radius * currentZoom) * (rect.height / player.viewport.height);
                        if (distance < scaledRadius && distance < minDistance) { minDistance = distance; clickedPart = zone; }
                    }
                });
                return clickedPart;
            }

            canvas.addEventListener('pointerdown', (e) => {
                isDragging = true;
                startX = lastMouseX = e.clientX;
                startY = lastMouseY = e.clientY;
                dragDistance = 0;
                hitZoneOnDown = null;
                activeFaceBone = null;
                canvas.setPointerCapture(e.pointerId);

                // 只有大廳才處理臉部互動
                if (currentMode === 'lobby') {
                    const rect = canvas.getBoundingClientRect();
                    hitZoneOnDown = getLobbyHitZone(e.clientX - rect.left, e.clientY - rect.top);
                    if (hitZoneOnDown && hitZoneOnDown.name === "頭部") {
                        let bone = player.skeleton.findBone("Character_Ball_Move") || player.skeleton.findBone("S1_Ball_R_CT") || player.skeleton.findBone("Ball_R_CT");
                        if (bone) {
                            activeFaceBone = bone; initialBoneX = bone.x; initialBoneY = bone.y;
                        }
                    }
                }
            });

            canvas.addEventListener('pointermove', (e) => {
                if (!isDragging || !player.skeleton) return;
                const rect = canvas.getBoundingClientRect();
                if (rect.width === 0) return;

                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                dragDistance += Math.hypot(dx, dy);

                // 處理臉部拉扯 (大廳模式)
                if (currentMode === 'lobby' && hitZoneOnDown && hitZoneOnDown.name === "頭部" && activeFaceBone) {
                    const spineScaleX = player.viewport.width / rect.width / currentZoom;
                    const spineScaleY = player.viewport.height / rect.height / currentZoom;
                    const stretchIntensity = 1.3; 
                    let worldDx = (e.clientX - startX) * spineScaleX * stretchIntensity;
                    let worldDy = -(e.clientY - startY) * spineScaleY * stretchIntensity;

                    if (worldDx > 0) worldDx = 0; 
                    let targetWorld = { x: activeFaceBone.worldX + worldDx, y: activeFaceBone.worldY + worldDy };
                    if (activeFaceBone.parent) activeFaceBone.parent.worldToLocal(targetWorld);
                    
                    let localDx = targetWorld.x - initialBoneX;
                    let localDy = targetWorld.y - initialBoneY;
                    let rawDistance = Math.hypot(localDx, localDy);
                    const MAX_RADIUS = 55; 

                    if (rawDistance > 0) {
                        let elasticDist = MAX_RADIUS * (1 - Math.exp(-rawDistance / (MAX_RADIUS * 1.2)));
                        localDx = (localDx / rawDistance) * elasticDist;
                        localDy = (localDy / rawDistance) * elasticDist;
                    }
                    activeFaceBone.x = initialBoneX + localDx;
                    activeFaceBone.y = initialBoneY + localDy;
                } 
                // 🌟 通用 1:1 鏡頭平移 (點擊空白處，或是戰鬥模式的所有拖曳)
                else if (!hitZoneOnDown) {
                    const camW = player.viewport.cameraWidth || player.viewport.width;
                    const camH = player.viewport.cameraHeight || player.viewport.height;
                    const scaleFactorX = camW / rect.width / currentZoom;
                    const scaleFactorY = camH / rect.height / currentZoom;

                    player.skeleton.x += dx * scaleFactorX;
                    player.skeleton.y -= dy * scaleFactorY;
                }

                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });

            const stopDrag = (e) => { 
                if (!isDragging) return;
                isDragging = false; 

                // 臉部彈回動畫 (大廳模式)
                if (currentMode === 'lobby' && activeFaceBone) {
                    let targetX = initialBoneX, targetY = initialBoneY;
                    let bouncingFaceBone = activeFaceBone;
                    activeFaceBone = null; 
                    let velX = 0, velY = 0;
                    function applyBounce() {
                        let dx = targetX - bouncingFaceBone.x; let dy = targetY - bouncingFaceBone.y;
                        velX = (velX + dx * 0.35) * 0.65; velY = (velY + dy * 0.35) * 0.65;
                        bouncingFaceBone.x += velX; bouncingFaceBone.y += velY;
                        if (Math.abs(dx) > 0.1 || Math.abs(velX) > 0.1 || Math.abs(dy) > 0.1 || Math.abs(velY) > 0.1) {
                            requestAnimationFrame(applyBounce);
                        } else {
                            bouncingFaceBone.x = targetX; bouncingFaceBone.y = targetY;
                        }
                    }
                    applyBounce();
                }

                // 輕點播放動畫 (大廳模式，拖曳距離小於 10 才算點擊)
                if (currentMode === 'lobby' && dragDistance < 10 && hitZoneOnDown) {
                    const animNames = player.skeleton.data.animations.map(a => a.name);
                    if (hitZoneOnDown.name === "頭部" && animNames.includes("Touch_Idle")) {
                        player.animationState.setAnimation(0, "Touch_Idle", false);
                        player.animationState.addAnimation(0, "Idle_1", true, 0);
                        document.getElementById('animSelectText').innerText = "Touch_Idle";
                    } else if (hitZoneOnDown.name === "身體" && animNames.includes("Tickle_Idle_1")) {
                        player.animationState.setAnimation(0, "Tickle_Idle_1", false);
                        player.animationState.addAnimation(0, "Idle_1", true, 0);
                        document.getElementById('animSelectText').innerText = "Tickle_Idle_1";
                    }
                }
            };

            canvas.addEventListener('pointerup', stopDrag);
            canvas.addEventListener('pointercancel', stopDrag);
        }

        window.onload = function() { initCharacterGrid(); };
    </script>
</body>
